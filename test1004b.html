<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f6b6cf"
  >

  <meta
    name="description"
    content="サクラミーツとミーツメンバーの出演番組をまとめた応援アプリ"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="サクラミーツ"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >

  <title>サクラミーツ応援アプリ</title>


  <style>

    /* =========================================================
       Base
    ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      background:
        radial-gradient(
          circle at top left,
          #fff8fb 0%,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #fff4f8 0%,
          #fdf7fa 50%,
          #fff 100%
        );

      color: #333;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

      padding-bottom:
        calc(78px + env(safe-area-inset-bottom));
    }


    button {
      font-family: inherit;
    }


    /* =========================================================
       Header
    ========================================================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      padding:
        max(18px, env(safe-area-inset-top))
        20px
        16px;

      background:
        rgba(255, 255, 255, 0.82);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(232, 106, 154, 0.12);
    }


    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
    }


    .app-title {
      margin: 0;

      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.04em;

      color: #d95b8c;
    }


    .app-subtitle {
      margin: 5px 0 0;

      font-size: 12px;
      color: #999;

      letter-spacing: 0.08em;
    }


    /* =========================================================
       Page
    ========================================================= */

    .page {
      display: none;

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding:
        20px
        16px
        40px;
    }


    .page.active {
      display: block;
    }


    /* =========================================================
       Home
    ========================================================= */

    .status {
      margin: 4px 0 18px;

      font-size: 13px;
      color: #999;
    }


    .loading {
      padding: 50px 20px;

      text-align: center;

      color: #aaa;
      font-size: 14px;
    }


    .error {
      padding: 30px 20px;

      text-align: center;

      color: #d95b8c;

      background:
        rgba(255, 255, 255, 0.7);

      border-radius: 18px;
    }


    /* =========================================================
       Episode list
    ========================================================= */

    .episode-list {
      display: grid;
      gap: 12px;
    }


    .episode {
      display: flex;
      align-items: stretch;

      width: 100%;
      min-height: 96px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.9);

      border:
        1px solid rgba(232, 106, 154, 0.10);

      border-radius: 16px;

      text-decoration: none;
      color: inherit;

      box-shadow:
        0 4px 16px rgba(80, 40, 60, 0.05);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .episode:active {
      transform: scale(0.985);
    }


    .thumbnail {
      flex: 0 0 140px;

      width: 140px;

      aspect-ratio: 16 / 9;

      align-self: center;

      object-fit: cover;

      background: #f4edf0;
    }


    .episode-content {
      flex: 1;
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 12px 14px;
    }


    .episode-title {
      margin: 0;

      font-size: 14px;
      line-height: 1.65;

      font-weight: 700;

      color: #3c3c3c;

      display: -webkit-box;

      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;

      overflow: hidden;
    }


    .episode-link {
      margin-top: 7px;

      font-size: 11px;

      color: #d95b8c;

      font-weight: 700;
    }


    /* =========================================================
       Settings
    ========================================================= */

    .settings-header {
      margin-bottom: 20px;
    }


    .settings-title {
      margin: 0;

      font-size: 24px;

      font-weight: 800;

      color: #d95b8c;
    }


    .settings-subtitle {
      margin: 6px 0 0;

      font-size: 13px;

      color: #999;
    }


    .settings-card {
      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.92);

      border:
        1px solid rgba(232, 106, 154, 0.10);

      border-radius: 18px;

      box-shadow:
        0 4px 16px rgba(80, 40, 60, 0.05);
    }


    .settings-section {
      padding: 20px;
    }


    .settings-section-title {
      margin: 0 0 6px;

      font-size: 16px;

      font-weight: 800;

      color: #444;
    }


    .settings-section-description {
      margin: 0 0 18px;

      font-size: 12px;

      line-height: 1.7;

      color: #999;
    }


    /* =========================================================
       Push Notification
    ========================================================= */

    .notification-setting {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;
    }


    .notification-info {
      flex: 1;
      min-width: 0;
    }


    .notification-title {
      margin: 0;

      font-size: 14px;

      font-weight: 700;

      color: #444;
    }


    .notification-status {
      margin: 5px 0 0;

      font-size: 11px;

      line-height: 1.5;

      color: #999;
    }


    .notification-button {
      flex: 0 0 auto;

      min-width: 130px;

      min-height: 44px;

      padding:
        10px
        16px;

      border: 0;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #e86a9a,
          #d95b8c
        );

      color: #fff;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 5px 14px rgba(217, 91, 140, 0.20);

      transition:
        transform 0.15s ease,
        opacity 0.2s ease;
    }


    .notification-button:active {
      transform: scale(0.96);
    }


    .notification-button:disabled {
      opacity: 0.5;

      cursor: default;

      box-shadow: none;
    }


    .notification-button.allowed {
      background:
        #eee;

      color: #777;

      box-shadow: none;
    }


    .notification-result {
      display: none;

      margin-top: 16px;

      padding:
        12px
        14px;

      border-radius: 12px;

      font-size: 12px;

      line-height: 1.6;
    }


    .notification-result.show {
      display: block;
    }


    .notification-result.success {
      background:
        rgba(100, 190, 130, 0.10);

      color: #4f9c68;
    }


    .notification-result.error {
      background:
        rgba(232, 106, 154, 0.08);

      color: #d95b8c;
    }


    /* =========================================================
       Settings divider
    ========================================================= */

    .settings-divider {
      height: 1px;

      background:
        rgba(232, 106, 154, 0.08);
    }


    .app-info {
      padding: 20px;

      text-align: center;
    }


    .app-info-name {
      margin: 0;

      font-size: 13px;

      font-weight: 700;

      color: #777;
    }


    .app-info-version {
      margin: 5px 0 0;

      font-size: 11px;

      color: #aaa;
    }


    /* =========================================================
       Bottom Navigation
    ========================================================= */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 200;

      padding:
        8px
        16px
        calc(8px + env(safe-area-inset-bottom));

      background:
        rgba(255, 255, 255, 0.90);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-top:
        1px solid rgba(232, 106, 154, 0.12);

      box-shadow:
        0 -4px 20px rgba(80, 40, 60, 0.06);
    }


    .bottom-nav-inner {
      width: 100%;

      max-width: 420px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;
    }


    .bottom-nav-item {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      min-height: 56px;

      border: 0;

      border-radius: 16px;

      background: transparent;

      color: #999;

      font-family: inherit;

      font-size: 11px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }


    .bottom-nav-item:active {
      transform: scale(0.96);
    }


    .bottom-nav-item.active {
      color: #d95b8c;

      background:
        rgba(232, 106, 154, 0.08);
    }


    .bottom-nav-icon {
      width: 23px;
      height: 23px;

      margin-bottom: 3px;

      fill: none;

      stroke: currentColor;

      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* =========================================================
       PC
    ========================================================= */

    @media (min-width: 768px) {

      .header {
        padding-top: 22px;
        padding-bottom: 20px;
      }


      .app-title {
        font-size: 28px;
      }


      .app-subtitle {
        font-size: 13px;
      }


      .page {
        padding:
          32px
          24px
          60px;
      }


      .episode-list {
        grid-template-columns:
          repeat(
            auto-fill,
            minmax(340px, 1fr)
          );

        gap: 20px;
      }


      .episode {
        display: block;

        min-height: 0;

        border-radius: 20px;

        box-shadow:
          0 8px 30px rgba(80, 40, 60, 0.07);
      }


      .episode:hover {
        transform: translateY(-5px);

        box-shadow:
          0 14px 36px rgba(80, 40, 60, 0.12);
      }


      .thumbnail {
        display: block;

        width: 100%;

        aspect-ratio: 16 / 9;

        border-radius: 0;
      }


      .episode-content {
        min-height: 120px;

        padding:
          17px
          18px
          18px;
      }


      .episode-title {
        font-size: 15px;

        line-height: 1.65;

        -webkit-line-clamp: 3;
      }


      .episode-link {
        margin-top: 10px;
      }


      .bottom-nav {
        padding:
          10px
          20px
          calc(10px + env(safe-area-inset-bottom));
      }


      .bottom-nav-inner {
        max-width: 360px;
      }

    }


    /* =========================================================
       Large PC
    ========================================================= */

    @media (min-width: 1100px) {

      .episode-list {
        grid-template-columns:
          repeat(
            3,
            minmax(0, 1fr)
          );
      }

    }


    /* =========================================================
       Small Mobile
    ========================================================= */

    @media (max-width: 390px) {

      .page {
        padding-left: 10px;
        padding-right: 10px;
      }


      .episode {
        min-height: 88px;
      }


      .thumbnail {
        flex-basis: 120px;

        width: 120px;
      }


      .episode-content {
        padding:
          10px
          11px;
      }


      .episode-title {
        font-size: 13px;

        line-height: 1.55;
      }


      .notification-setting {
        align-items: stretch;

        flex-direction: column;
      }


      .notification-button {
        width: 100%;
      }

    }

  </style>

</head>

  <!-- =========================================================

  ========================================================= -->

  <script>


    // ============================================================
    // API
    // ============================================================

    const API_URL =
      "https://api.konnagi.com/meets-app-tver&radiko";


    // ============================================================
    // Web Push
    // ============================================================

    /*
     * Cloudflare Worker等で生成した
     * VAPID公開鍵をここに設定してください。
     *
     * 例：
     *
     * const VAPID_PUBLIC_KEY =
     *   "Bxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx";
     */

    const VAPID_PUBLIC_KEY =
      "YOUR_VAPID_PUBLIC_KEY";


    // ============================================================
    // DOM
    // ============================================================

    const episodeList =
      document.getElementById(
        "episodeList"
      );


    const status =
      document.getElementById(
        "status"
      );


    const homePage =
      document.getElementById(
        "homePage"
      );


    const settingsPage =
      document.getElementById(
        "settingsPage"
      );


    const bottomNavItems =
      document.querySelectorAll(
        ".bottom-nav-item"
      );


    const notificationButton =
      document.getElementById(
        "notificationButton"
      );


    const notificationStatus =
      document.getElementById(
        "notificationStatus"
      );


    const notificationResult =
      document.getElementById(
        "notificationResult"
      );


    // ============================================================
    // episodeURLから表示メッセージを判定
    // ============================================================

    function getLinkMessage(url) {

      try {

        const hostname =
          new URL(url)
            .hostname
            .toLowerCase();


        // TVer

        if (
          hostname === "tver.jp" ||
          hostname.endsWith(".tver.jp")
        ) {

          return "TVerで見る ↗";

        }


        // radiko

        if (
          hostname === "radiko.jp" ||
          hostname.endsWith(".radiko.jp")
        ) {

          return "radikoで聴く ↗";

        }


        // その他

        return "";

      } catch (error) {

        return "";

      }

    }


    // ============================================================
    // エピソード取得
    // ============================================================

    async function loadEpisodes() {

      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "APIのレスポンス形式が正しくありません"
          );

        }


        renderEpisodes(data);


      } catch (error) {

        console.error(error);


        status.textContent =
          "エピソードを読み込めませんでした。";


        episodeList.innerHTML = `
          <div class="error">
            エピソード情報を取得できませんでした。
          </div>
        `;

      }

    }


    // ============================================================
    // エピソード表示
    // ============================================================

    function renderEpisodes(episodes) {

      episodeList.innerHTML = "";


      if (episodes.length === 0) {

        status.textContent =
          "エピソードがありません。";


        episodeList.innerHTML = `
          <div class="error">
            現在表示できるエピソードがありません。
          </div>
        `;


        return;

      }


      status.textContent =
        `${episodes.length}件のエピソード`;


      episodes.forEach(
        (episode) => {

          const title =
            episode.title ||
            "タイトルなし";


          const thumbnail =
            episode.horizontal_thumbnail_path ||
            "";


          const episodeURL =
            episode.episodeURL ||
            "#";


          const linkMessage =
            getLinkMessage(
              episodeURL
            );


          const link =
            document.createElement(
              "a"
            );


          link.className =
            "episode";


          link.href =
            episodeURL;


          link.target =
            "_blank";


          link.rel =
            "noopener noreferrer";


          const messageHTML =
            linkMessage
              ? `
                <div class="episode-link">
                  ${escapeHTML(linkMessage)}
                </div>
              `
              : "";


          link.innerHTML = `

            <img
              class="thumbnail"
              src="${escapeHTML(thumbnail)}"
              alt=""
              loading="lazy"
              decoding="async"
            >

            <div class="episode-content">

              <h2 class="episode-title">
                ${escapeHTML(title)}
              </h2>

              ${messageHTML}

            </div>

          `;


          episodeList.appendChild(
            link
          );

        }
      );

    }


    // ============================================================
    // HTMLエスケープ
    // ============================================================

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ============================================================
    // ページ切り替え
    // ============================================================

    function switchPage(page) {

      homePage.classList.remove(
        "active"
      );

      settingsPage.classList.remove(
        "active"
      );


      bottomNavItems.forEach(
        (item) => {

          item.classList.remove(
            "active"
          );

          item.removeAttribute(
            "aria-current"
          );

        }
      );


      if (page === "home") {

        homePage.classList.add(
          "active"
        );


        const button =
          document.querySelector(
            '[data-page="home"]'
          );


        button.classList.add(
          "active"
        );


        button.setAttribute(
          "aria-current",
          "page"
        );


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });


        return;

      }


      if (page === "settings") {

        settingsPage.classList.add(
          "active"
        );


        const button =
          document.querySelector(
            '[data-page="settings"]'
          );


        button.classList.add(
          "active"
        );


        button.setAttribute(
          "aria-current",
          "page"
        );


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }

    }


    // ============================================================
    // Bottom Navigation
    // ============================================================

    bottomNavItems.forEach(
      (item) => {

        item.addEventListener(
          "click",
          () => {

            switchPage(
              item.dataset.page
            );

          }
        );

      }
    );


    // ============================================================
    // Base64URL → Uint8Array
    // ============================================================

    function urlBase64ToUint8Array(
      base64String
    ) {

      const padding =
        "=".repeat(
          (4 - base64String.length % 4) % 4
        );


      const base64 =
        (
          base64String
          + padding
        )
          .replace(
            /-/g,
            "+"
          )
          .replace(
            /_/g,
            "/"
          );


      const rawData =
        window.atob(base64);


      return Uint8Array.from(
        [...rawData].map(
          char => char.charCodeAt(0)
        )
      );

    }


    // ============================================================
    // 通知状態表示
    // ============================================================

    async function updateNotificationStatus() {

      if (
        !("Notification" in window)
      ) {

        notificationStatus.textContent =
          "このブラウザは通知に対応していません。";

        notificationButton.disabled =
          true;

        return;

      }


      if (
        !("serviceWorker" in navigator)
      ) {

        notificationStatus.textContent =
          "Service Workerに対応していません。";

        notificationButton.disabled =
          true;

        return;

      }


      if (
        Notification.permission === "granted"
      ) {

        notificationStatus.textContent =
          "通知は許可されています。";


        notificationButton.textContent =
          "通知は許可済み";


        notificationButton.classList.add(
          "allowed"
        );


        return;

      }


      if (
        Notification.permission === "denied"
      ) {

        notificationStatus.textContent =
          "通知がブロックされています。ブラウザの設定から許可してください。";


        notificationButton.textContent =
          "通知を許可する";


        return;

      }


      notificationStatus.textContent =
        "通知はまだ許可されていません。";


      notificationButton.textContent =
        "通知を許可する";

    }


    // ============================================================
    // 結果メッセージ
    // ============================================================

    function showNotificationResult(
      message,
      type
    ) {

      notificationResult.textContent =
        message;


      notificationResult.className =
        `notification-result show ${type}`;

    }


    // ============================================================
    // Web Push購読
    // ============================================================

    async function subscribeToPush() {

      try {

        if (
          !("Notification" in window)
        ) {

          throw new Error(
            "このブラウザは通知に対応していません。"
          );

        }


        if (
          !("serviceWorker" in navigator)
        ) {

          throw new Error(
            "Service Workerに対応していません。"
          );

        }


        if (
          !VAPID_PUBLIC_KEY ||
          VAPID_PUBLIC_KEY ===
          "YOUR_VAPID_PUBLIC_KEY"
        ) {

          throw new Error(
            "VAPID公開鍵が設定されていません。"
          );

        }


        notificationButton.disabled =
          true;


        notificationButton.textContent =
          "設定中…";


        /*
         * 通知許可を取得
         */

        const permission =
          await Notification.requestPermission();


        if (
          permission !== "granted"
        ) {

          if (
            permission === "denied"
          ) {

            showNotificationResult(
              "通知が拒否されました。ブラウザの設定から通知を許可してください。",
              "error"
            );

          } else {

            showNotificationResult(
              "通知の許可がキャンセルされました。",
              "error"
            );

          }


          await updateNotificationStatus();


          return;

        }


        /*
         * Service Worker取得
         */

        const registration =
          await navigator.serviceWorker.ready;


        /*
         * Push購読
         */

        let subscription =
          await registration.pushManager.getSubscription();


        if (!subscription) {

          subscription =
            await registration.pushManager.subscribe({

              userVisibleOnly: true,

              applicationServerKey:
                urlBase64ToUint8Array(
                  VAPID_PUBLIC_KEY
                )

            });

        }


        /*
         * 現在の購読情報
         *
         * ここではLocalStorageにも保存します。
         *
         * 実際のPush送信を行う場合は、
         * このsubscriptionをCloudflare Worker等の
         * サーバーへ送信して保存します。
         */

        const subscriptionJSON =
          subscription.toJSON();


        localStorage.setItem(
          "web_push_subscription",
          JSON.stringify(
            subscriptionJSON
          )
        );


        console.log(
          "Push Subscription:",
          subscriptionJSON
        );


        showNotificationResult(
          "通知が許可されました。プッシュ通知を受け取る準備ができました。",
          "success"
        );


        await updateNotificationStatus();


      } catch (error) {

        console.error(
          "Web Push Error:",
          error
        );


        showNotificationResult(
          error.message ||
          "通知の設定に失敗しました。",
          "error"
        );


      } finally {

        notificationButton.disabled =
          false;

      }

    }


    // ============================================================
    // 通知ボタン
    // ============================================================

    notificationButton.addEventListener(
      "click",
      async () => {

        /*
         * すでに許可されている場合
         */

        if (
          Notification.permission ===
          "granted"
        ) {

          try {

            const registration =
              await navigator.serviceWorker.ready;


            const subscription =
              await registration.pushManager
                .getSubscription();


            if (subscription) {

              localStorage.setItem(
                "web_push_subscription",
                JSON.stringify(
                  subscription.toJSON()
                )
              );


              showNotificationResult(
                "通知はすでに許可されています。",
                "success"
              );


              return;

            }

          } catch (error) {

            console.error(error);

          }

        }


        await subscribeToPush();

      }
    );


    // ============================================================
    // Service Worker登録
    // ============================================================

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        async () => {

          try {

            const registration =
              await navigator.serviceWorker.register(
                "./sw.js"
              );


            console.log(
              "Service Worker registered:",
              registration.scope
            );


            /*
             * Service Worker登録後に
             * 通知状態を確認
             */

            await updateNotificationStatus();


          } catch (error) {

            console.error(
              "Service Worker registration failed:",
              error
            );


            notificationStatus.textContent =
              "Service Workerの登録に失敗しました。";

          }

        }
      );

    } else {

      notificationStatus.textContent =
        "Service Workerに対応していません。";

      notificationButton.disabled =
        true;

    }


    // ============================================================
    // 起動
    // ============================================================

    loadEpisodes();

  </script>
