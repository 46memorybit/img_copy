
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fde8ef">
  <meta name="description" content="サクラミーツのエピソード画像を作成・共有">
  <title>サクラミーツ画像メーカー</title>

  <style>
    :root {
      --pink: #e86a9a;
      --pink-light: #fde8ef;
      --orange: #f58b29;
      --text: #493942;
      --muted: #8b7881;
      --border: #f1d4df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px 32px;
      background: linear-gradient(180deg, #fff7fa 0%, #fff 100%);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 22px;
      letter-spacing: 0.04em;
    }

    .description {
      margin: 0 0 20px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* 正方形プレビュー */
    #preview {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 5px 24px rgb(125 59 83 / 10%);
    }

    #captureCard {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 4.2%;
      background:
        radial-gradient(circle at 100% 0%, #fff0f5 0, transparent 40%),
        #fff;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      min-height: 10%;
      margin-bottom: 2%;
    }

    #programName {
      max-width: 72%;
      color: var(--pink);
      font-size: clamp(11px, 3.1vw, 16px);
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #createdAt {
      flex-shrink: 0;
      color: var(--muted);
      font-size: clamp(8px, 2.1vw, 11px);
      text-align: right;
      line-height: 1.4;
    }

    #thumbnailFrame {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff5f8;
      border-radius: 8px;
    }

    #thumbnail {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #imagePlaceholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    #imagePlaceholder[hidden] {
      display: none;
    }

    #episodeIdBadge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      max-width: calc(100% - 20px);
      padding: 5px 9px;
      overflow: hidden;
      border-radius: 5px;
      background: rgb(30 20 25 / 78%);
      color: #fff;
      font-size: clamp(9px, 2.3vw, 12px);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #episodeTitle {
      display: -webkit-box;
      flex-shrink: 0;
      margin: 3.5% 0 0;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(12px, 3.2vw, 17px);
      font-weight: 800;
      line-height: 1.45;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2%;
      color: var(--muted);
      font-size: clamp(8px, 2vw, 10px);
    }

    .brand {
      color: var(--pink);
      font-weight: 800;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 48px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #shareButton {
      background: var(--pink);
      color: #fff;
    }

    #saveButton {
      background: var(--pink-light);
      color: #a53f69;
      border: 1px solid var(--border);
    }

    #status {
      min-height: 42px;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .episode-link {
      display: block;
      margin-top: 12px;
      color: #bf4d7b;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .episode-link:hover {
      text-decoration: underline;
    }

    @media (min-width: 560px) {
      body {
        padding-top: 32px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>サクラミーツ画像メーカー</h1>
    <p class="description">エピソードのサムネイルを画像にして共有</p>

    <div id="preview">
      <div id="captureCard">
        <div class="card-header">
          <div id="programName">サクラミーツ</div>
          <div id="createdAt"></div>
        </div>

        <div id="thumbnailFrame">
          <div id="imagePlaceholder">サムネイルを読み込んでいます…</div>
          <img id="thumbnail" alt="エピソードのサムネイル">
          <div id="episodeIdBadge" hidden></div>
        </div>

        <p id="episodeTitle">データを取得しています…</p>

        <div class="card-footer">
          <span class="brand">サクラミーツ応援</span>
          <span id="sourceLabel">EPISODE</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="shareButton" disabled>画像をXで共有</button>
      <button id="saveButton" disabled>画像を保存</button>
    </div>

    <div id="status" role="status" aria-live="polite">
      APIからデータを取得しています…
    </div>

    <a
      id="episodeLink"
      class="episode-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      hidden
    >エピソードを開く</a>
  </main>

  <!-- HTMLをPNG画像に変換 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    "use strict";

    // =========================================================
    // 設定
    // =========================================================

    const CONFIG = {
      API_URL: "https://api.konnagi.com/meets-app-tver&radiko",

      // APIのサムネイルURLで取得できない場合に使用する予備URL
      TVER_THUMBNAIL_TEMPLATE:
        "https://statics.tver.jp/images/content/thumbnail/episode/xlarge/{id}.jpg",

      // 画像を生成する際の倍率
      CAPTURE_SCALE: 2,

      // APIから取得するデータのうち、最初に表示する項目
      DEFAULT_ITEM_INDEX: 0
    };

    // =========================================================
    // DOM
    // =========================================================

    const captureCard = document.getElementById("captureCard");
    const programNameElement = document.getElementById("programName");
    const createdAtElement = document.getElementById("createdAt");
    const thumbnailElement = document.getElementById("thumbnail");
    const placeholderElement = document.getElementById("imagePlaceholder");
    const episodeIdBadge = document.getElementById("episodeIdBadge");
    const episodeTitleElement = document.getElementById("episodeTitle");
    const sourceLabelElement = document.getElementById("sourceLabel");
    const shareButton = document.getElementById("shareButton");
    const saveButton = document.getElementById("saveButton");
    const statusElement = document.getElementById("status");
    const episodeLink = document.getElementById("episodeLink");

    let currentEpisode = null;
    let imageReady = false;
    let currentImage = null;

    // =========================================================
    // 共通処理
    // =========================================================

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function getEpisodeId(url) {
      if (!url) return "";

      try {
        const parsed = new URL(url);
        const match = parsed.pathname.match(/\/episodes\/([^/?#]+)/i);
        return match ? match[1] : "";
      } catch (error) {
        const match = String(url).match(/\/episodes\/([^/?#]+)/i);
        return match ? match[1] : "";
      }
    }

    function isTverEpisode(item) {
      return /(^|\.)tver\.jp$/i.test(
        (() => {
          try {
            return new URL(item.episodeURL).hostname;
          } catch (error) {
            return "";
          }
        })()
      );
    }

    function getProgramName(item) {
      return isTverEpisode(item) ? "サクラミーツ" : "櫻坂46こち星";
    }

    function getThumbnailUrls(item) {
      const urls = [];

      // 1. APIが返した画像URLを最優先で使用
      const apiUrl = String(item.horizontal_thumbnail_path || "").trim();

      if (apiUrl) {
        urls.push(apiUrl);
      }

      // 2. TVerの場合はエピソードIDから予備URLを生成
      if (isTverEpisode(item)) {
        const episodeId = getEpisodeId(item.episodeURL);

        if (episodeId) {
          const fallbackUrl = CONFIG.TVER_THUMBNAIL_TEMPLATE.replace(
            "{id}",
            encodeURIComponent(episodeId)
          );

          if (!urls.includes(fallbackUrl)) {
            urls.push(fallbackUrl);
          }
        }
      }

      return urls;
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();

        // Canvasに描画できるようCORSモードで読み込む
        // 配信元がCORSを許可していない場合、この画像は失敗することがある
        img.crossOrigin = "anonymous";

        img.onload = () => {
          if (img.naturalWidth > 0 && img.naturalHeight > 0) {
            resolve(img);
          } else {
            reject(new Error("画像サイズが不正です"));
          }
        };

        img.onerror = () => {
          reject(new Error("画像の読み込みに失敗しました"));
        };

        img.src = url;
      });
    }

    function updateCreatedAt() {
      const now = new Date();

      createdAtElement.textContent =
        now.toLocaleDateString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }) +
        "\n" +
        now.toLocaleTimeString("ja-JP", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
    }

    // =========================================================
    // API取得
    // =========================================================

    async function fetchEpisodes() {
      setStatus("APIからエピソード情報を取得しています…");

      const response = await fetch(CONFIG.API_URL, {
        method: "GET",
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("API取得失敗（HTTP " + response.status + "）");
      }

      const data = await response.json();

      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("APIから有効なエピソードデータが返されませんでした");
      }

      // 既定では最初のTVerエピソードを優先
      const tverItems = data.filter(isTverEpisode);
      const items = tverItems.length > 0 ? tverItems : data;

      const index = Math.min(
        Math.max(0, CONFIG.DEFAULT_ITEM_INDEX),
        items.length - 1
      );

      return items[index];
    }

    // =========================================================
    // エピソード表示
    // =========================================================

    async function renderEpisode(item) {
      currentEpisode = item;
      currentImage = null;
      imageReady = false;

      shareButton.disabled = true;
      saveButton.disabled = true;

      programNameElement.textContent = getProgramName(item);
      episodeTitleElement.textContent = item.title || "タイトル不明";
      sourceLabelElement.textContent = isTverEpisode(item) ? "TVER" : "RADIKO";

      updateCreatedAt();

      const episodeId = getEpisodeId(item.episodeURL);

      if (episodeId) {
        episodeIdBadge.textContent = "ID: " + episodeId;
        episodeIdBadge.hidden = false;
      } else {
        episodeIdBadge.hidden = true;
      }

      if (item.episodeURL) {
        try {
          const parsed = new URL(item.episodeURL);

          if (parsed.protocol === "https:" || parsed.protocol === "http:") {
            episodeLink.href = parsed.href;
            episodeLink.hidden = false;
          } else {
            episodeLink.hidden = true;
          }
        } catch (error) {
          episodeLink.hidden = true;
        }
      } else {
        episodeLink.hidden = true;
      }

      thumbnailElement.removeAttribute("src");
      placeholderElement.hidden = false;
      placeholderElement.textContent = "サムネイルを読み込んでいます…";

      const urls = getThumbnailUrls(item);

      if (urls.length === 0) {
        placeholderElement.textContent = "サムネイルURLがありません";
        setStatus("APIデータに画像URLがなく、エピソードIDからも生成できませんでした。");
        return;
      }

      let loadedImage = null;
      let loadedUrl = "";
      const errors = [];

      for (const url of urls) {
        setStatus(
          "サムネイルを取得しています…\n" +
          "試行 " + (errors.length + 1) + "/" + urls.length
        );

        try {
          loadedImage = await loadImage(url);
          loadedUrl = url;
          break;
        } catch (error) {
          errors.push(url + "\n" + error.message);
          console.warn("サムネイル取得失敗:", url, error);
        }
      }

      if (!loadedImage) {
        placeholderElement.textContent = "サムネイルを取得できませんでした";
        setStatus(
          "すべてのサムネイルURLから画像を取得できませんでした。\n\n" +
          errors.join("\n\n") +
          "\n\n画像URLが有効か、配信元がCORSを許可しているか確認してください。"
        );
        return;
      }

      currentImage = loadedImage;
      thumbnailElement.src = loadedImage.src;
      placeholderElement.hidden = true;

      imageReady = true;
      shareButton.disabled = false;
      saveButton.disabled = false;

      setStatus(
        "サムネイルを表示しました。\n" +
        "エピソードID：" + (episodeId || "なし") + "\n" +
        "画像URL：" + loadedUrl
      );
    }

    // =========================================================
    // キャプチャ
    // =========================================================

    async function createImageBlob() {
      if (!currentEpisode || !imageReady || !currentImage) {
        throw new Error("画像の準備が完了していません");
      }

      if (typeof html2canvas !== "function") {
        throw new Error("画像生成ライブラリを読み込めませんでした");
      }

      // フォント・画像の描画を待機
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const canvas = await html2canvas(captureCard, {
        backgroundColor: "#ffffff",
        scale: CONFIG.CAPTURE_SCALE,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 20000,
        width: captureCard.clientWidth,
        height: captureCard.clientHeight
      });

      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("PNG画像を生成できませんでした"));
          }
        }, "image/png");
      });
    }

    function makeFileName() {
      const episodeId = currentEpisode
        ? getEpisodeId(currentEpisode.episodeURL)
        : "";

      const safeId = episodeId || "episode";
      return "sakurameets-" + safeId + ".png";
    }

    // =========================================================
    // PNG保存
    // =========================================================

    saveButton.addEventListener("click", async () => {
      saveButton.disabled = true;
      setStatus("PNG画像を作成しています…");

      try {
        const blob = await createImageBlob();
        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");

        anchor.href = objectUrl;
        anchor.download = makeFileName();

        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();

        setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);

        setStatus("PNG画像を保存しました。");
      } catch (error) {
        console.error(error);
        setStatus(
          "画像の保存に失敗しました。\n" +
          error.message +
          "\n\n画像配信元のCORS設定が原因の可能性があります。"
        );
      } finally {
        saveButton.disabled = !imageReady;
      }
    });

    // =========================================================
    // Web Share APIで共有
    // =========================================================

    shareButton.addEventListener("click", async () => {
      shareButton.disabled = true;
      setStatus("共有用の画像を作成しています…");

      try {
        const blob = await createImageBlob();
        const file = new File(
          [blob],
          makeFileName(),
          { type: "image/png" }
        );

        const shareData = {
          files: [file],
          title: currentEpisode.title || "サクラミーツ",
          text: currentEpisode.title || "サクラミーツ"
        };

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          await navigator.share(shareData);
          setStatus(
            "共有画面を開きました。\n" +
            "共有先でXを選択してください。"
          );
        } else {
          // ファイル共有非対応環境ではPNGを保存する
          const objectUrl = URL.createObjectURL(blob);
          const anchor = document.createElement("a");

          anchor.href = objectUrl;
          anchor.download = makeFileName();

          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();

          setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);

          setStatus(
            "このブラウザでは画像のWeb Share APIに対応していません。\n" +
            "画像を保存しました。Xの投稿画面で添付してください。"
          );
        }
      } catch (error) {
        // ユーザーが共有シートを閉じた場合もここに入ることがある
        if (error.name === "AbortError") {
          setStatus("共有をキャンセルしました。");
        } else {
          console.error(error);
          setStatus(
            "共有に失敗しました。\n" +
            error.message +
            "\n\n画像配信元のCORS設定が原因の可能性があります。"
          );
        }
      } finally {
        shareButton.disabled = !imageReady;
      }
    });

    // =========================================================
    // 起動
    // =========================================================

    async function main() {
      try {
        const item = await fetchEpisodes();
        await renderEpisode(item);
      } catch (error) {
        console.error(error);
        placeholderElement.hidden = false;
        placeholderElement.textContent = "データを取得できませんでした";
        setStatus(
          "エラー：" + error.message +
          "\nAPIのURL、通信状態、CORS設定を確認してください。"
        );
      }
    }

    main();
  </script>
</body>
</html>
