
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>番組サムネイル</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #ffffff;
      --card-background: #ffffff;
      --text: #333333;
      --muted: #777777;
      --accent: #e86a9a;
      --border: #eeeeee;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    /* 画像カード */
    .card {
      width: 100%;
      max-width: 480px;
      padding: 16px;
      overflow: hidden;
      background: var(--card-background);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    /* 左上：番組名、右上：取得日時 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .program-name {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .timestamp {
      max-width: 48%;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: right;
      overflow-wrap: anywhere;
    }

    /* サムネイルを左右上下中央に配置 */
    .thumbnail-container {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
    }

    /* 正方形、横幅90% */
    .thumbnail {
      display: block;
      width: 90%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
      margin: 0 auto;
      border-radius: 10px;
      background: #f3f3f3;
    }

    /* 画像がない場合 */
    .placeholder {
      display: flex;
      width: 90%;
      aspect-ratio: 1 / 1;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
      border-radius: 10px;
      background: #f5f5f5;
      color: #999999;
      font-size: 14px;
    }

    /* サムネイル下：エピソードタイトル */
    .episode-title {
      margin-top: 16px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      .card {
        padding: 12px;
        border-radius: 12px;
      }

      .header {
        gap: 8px;
        margin-bottom: 12px;
      }

      .program-name {
        font-size: 13px;
      }

      .timestamp {
        font-size: 10px;
      }

      .episode-title {
        margin-top: 12px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- 左上：番組名 / 右上：取得日時 -->
    <header class="header">
      <div class="program-name" id="programName">
        サクラミーツ
      </div>

      <time class="timestamp" id="timestamp">
        2026/10/16 20:00:00
      </time>
    </header>

    <!-- 中央：正方形サムネイル -->
    <div class="thumbnail-container" id="thumbnailContainer">
      <img
        class="thumbnail"
        id="thumbnail"
        src="https://placehold.co/600x600/f6b6cf/333333?text=Thumbnail"
        alt="エピソードのサムネイル"
      >
    </div>

    <!-- 下部：エピソードタイトル -->
    <div class="episode-title" id="episodeTitle">
      エピソードタイトル
    </div>

  </main>

  <script>
    /*
     * 表示内容の設定
     * 番組名・取得日時・画像URL・タイトルを変更できます。
     */
    const DATA = {
      programName: "サクラミーツ",
      timestamp: new Date(),
      thumbnailUrl:
        "https://placehold.co/600x600/f6b6cf/333333?text=Thumbnail",
      episodeTitle:
        "エピソードタイトルをここに入力"
    };

    // 番組名
    document.getElementById("programName").textContent =
      DATA.programName;

    // 取得日時
    const timestampElement =
      document.getElementById("timestamp");

    const date = new Date(DATA.timestamp);

    timestampElement.dateTime = date.toISOString();

    timestampElement.textContent =
      new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);

    // サムネイル
    const thumbnail =
      document.getElementById("thumbnail");

    thumbnail.src = DATA.thumbnailUrl;

    thumbnail.alt = DATA.episodeTitle;

    // 画像が読み込めない場合はプレースホルダー
    thumbnail.addEventListener("error", function () {
      const placeholder = document.createElement("div");

      placeholder.className = "placeholder";
      placeholder.textContent = "画像を表示できません";

      thumbnail.replaceWith(placeholder);
    }, { once: true });

    // エピソードタイトル
    document.getElementById("episodeTitle").textContent =
      DATA.episodeTitle;
  </script>

</body>
</html>
