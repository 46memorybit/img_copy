<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>画像URLコピー</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
}

body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 画像 */
#copyImage {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

/* 全画面ボタン */
#fullscreenButton {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 10;

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.65);
    color: #fff;

    font-size: 24px;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    -webkit-tap-highlight-color: transparent;
}

/* コピー完了表示 */
#message {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);

    padding: 10px 18px;

    background: rgba(0, 0, 0, 0.75);
    color: #fff;

    border-radius: 20px;

    font-size: 14px;

    opacity: 0;
    pointer-events: none;

    transition: opacity 0.2s;
}

#message.show {
    opacity: 1;
}
</style>
</head>

<body>

<img
    id="copyImage"
    src="https://i.ytimg.com/vi/I8JZbNTl5rM/maxresdefault.jpg"
    alt="画像URLをコピー"
>

<button id="fullscreenButton" aria-label="全画面">⛶</button>

<div id="message">URLをコピーしました</div>

<script>
const IMAGE_URL =
    "https://i.ytimg.com/vi/I8JZbNTl5rM/maxresdefault.jpg";

const image = document.getElementById("copyImage");
const fullscreenButton = document.getElementById("fullscreenButton");
const message = document.getElementById("message");

// 画像をタップ → URLコピー
image.addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(IMAGE_URL);
        showMessage("URLをコピーしました");
    } catch (error) {
        // Clipboard APIが使えない環境用
        const textarea = document.createElement("textarea");

        textarea.value = IMAGE_URL;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.select();

        try {
            document.execCommand("copy");
            showMessage("URLをコピーしました");
        } catch (e) {
            showMessage("コピーできませんでした");
        }

        document.body.removeChild(textarea);
    }
});

// 全画面
fullscreenButton.addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.error(error);
    }
});

// 全画面状態に応じてアイコン変更
document.addEventListener("fullscreenchange", () => {
    if (document.fullscreenElement) {
        fullscreenButton.textContent = "×";
    } else {
        fullscreenButton.textContent = "⛶";
    }
});

// メッセージ
function showMessage(text) {
    message.textContent = text;
    message.classList.add("show");

    setTimeout(() => {
        message.classList.remove("show");
    }, 1200);
}
</script>

</body>
</html>
