<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6b6cf">
  <title>TVerランキング｜最新取得データ</title>

  <style>
    :root {
      --pink: #e86a9a;
      --pink-light: #fce8f0;
      --text: #333;
      --muted: #777;
      --border: #eee;
      --background: #fff8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      color: var(--text);
      background: var(--background);
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans JP", sans-serif;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .description {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .panel {
      padding: 20px;
      margin-bottom: 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000005;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .meta-item {
      padding: 14px;
      background: var(--pink-light);
      border-radius: 10px;
      min-width: 0;
    }

    .meta-label {
      display: block;
      margin-bottom: 6px;
      color: #815366;
      font-size: 12px;
    }

    .meta-value {
      font-size: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      padding: 10px 16px;
      color: #fff;
      background: var(--pink);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      white-space: nowrap;
      color: #704457;
      background: var(--pink-light);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .rank {
      font-weight: 800;
      color: var(--pink);
      text-align: center;
    }

    .episode-id {
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 12px;
    }

    .empty {
      padding: 35px 15px;
      color: var(--muted);
      text-align: center;
    }

    .error {
      color: #c62828;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 21px;
      }

      .panel {
        padding: 14px;
      }

      .meta {
        grid-template-columns: 1fr;
      }

      th, td {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
<main>
  <h1>TVerランキング</h1>
  <div class="description">
    公開スプレッドシートから最新取得日時のランキングデータを取得して表示します。
  </div>

  <section class="panel">
    <div class="meta">
      <div class="meta-item">
        <span class="meta-label">最新取得日時</span>
        <div class="meta-value" id="latestDate">未取得</div>
      </div>

      <div class="meta-item">
        <span class="meta-label">出力件数</span>
        <div class="meta-value" id="resultCount">0件</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <button id="reloadButton" type="button">
        最新データを再取得
      </button>
      <span class="status" id="status" role="status" aria-live="polite">
        読み込み待機中
      </span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>取得日時</th>
            <th>ランキング種別</th>
            <th>順位</th>
            <th>エピソードID</th>
            <th>番組名</th>
            <th>エピソードタイトル</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr>
            <td colspan="6" class="empty">
              データを読み込んでいます。
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <div class="footer">
    データ元：公開Googleスプレッドシート<br>
    取得方式：ブラウザから公開CSVを読み込み<br>
    ※ 元データの更新状況は、スプレッドシートの公開設定に依存します。
  </div>
</main>

<script>
"use strict";

/* ============================================================
   設定
   ============================================================ */

const CONFIG = {
  // 指定された公開スプレッドシートのID
  PUBLISHED_ID:
    "2PACX-1vTJofs8FiOCnnavLtBInpn1d6u9YiJ6kZLFDBNI8iRTL4RBJBz3PSQtMSiSKt35B0xgtv6p9zKTy-75",

  // 対象シートの gid
  GID: "91701956",

  // 公開CSVの取得先
  get CSV_URL() {
    return (
      "https://docs.google.com/spreadsheets/d/e/" +
      this.PUBLISHED_ID +
      "/pub?gid=" +
      this.GID +
      "&single=true&output=csv"
    );
  }
};


/* ============================================================
   メイン処理
   ============================================================ */

async function outputLatestTverRanking() {
  const button = document.getElementById("reloadButton");
  const status = document.getElementById("status");
  const body = document.getElementById("rankingBody");

  button.disabled = true;
  status.className = "status";
  status.textContent = "公開データを取得しています…";

  body.replaceChildren();

  document.getElementById("latestDate").textContent = "取得中…";
  document.getElementById("resultCount").textContent = "集計中…";

  try {
    // キャッシュされた応答を避けて取得
    const url = CONFIG.CSV_URL +
      "&_=" + Date.now();

    const response = await fetch(url, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "公開CSVの取得に失敗しました。HTTP " +
        response.status
      );
    }

    const csvText = await response.text();

    if (!csvText.trim()) {
      throw new Error("公開CSVが空です。");
    }

    // CSVを配列に変換
    const rows = parseCSV(csvText);

    if (rows.length < 2) {
      throw new Error(
        "CSVにランキングデータがありません。"
      );
    }

    // 1行目をヘッダーとして認識
    const headers = rows[0].map(normalizeHeader);

    const column = {
      timestamp: findColumn(headers, [
        "取得日時", "取得日", "取得時刻", "timestamp"
      ], 0),

      type: findColumn(headers, [
        "ランキング種別", "ランキングタイプ", "種別", "type"
      ], 1),

      rank: findColumn(headers, [
        "順位", "ランキング順位", "rank"
      ], 3),

      episodeId: findColumn(headers, [
        "エピソードid", "エピソードid", "episodeid",
        "episode_id"
      ], 4),

      program: findColumn(headers, [
        "番組名", "番組", "program", "title"
      ], 6),

      episodeTitle: findColumn(headers, [
        "エピソードタイトル", "エピソード名",
        "タイトル", "episode_title"
      ], 7)
    };

    // 日時が有効なデータのみを抽出
    const validRows = rows
      .slice(1)
      .map((row, index) => ({
        row,
        originalIndex: index,
        timestamp: parseRankingTimestamp(
          row[column.timestamp]
        )
      }))
      .filter(item => item.timestamp !== null);

    if (validRows.length === 0) {
      throw new Error(
        "有効な取得日時がありません。公開CSVの列構成と日時形式を確認してください。"
      );
    }

    // 最新の取得日時を特定
    const latestTimestamp = Math.max(
      ...validRows.map(item => item.timestamp)
    );

    // 最新日時のデータだけを抽出
    const latestRows = validRows
      .filter(item => item.timestamp === latestTimestamp)
      .sort((a, b) => {
        const rankA = Number(a.row[column.rank]);
        const rankB = Number(b.row[column.rank]);

        const safeA = Number.isFinite(rankA)
          ? rankA : Number.MAX_SAFE_INTEGER;

        const safeB = Number.isFinite(rankB)
          ? rankB : Number.MAX_SAFE_INTEGER;

        return safeA - safeB ||
          a.originalIndex - b.originalIndex;
      });

    // 取得日時を表示
    const latestDate = formatDate(latestTimestamp);

    document.getElementById("latestDate").textContent =
      latestDate;

    document.getElementById("resultCount").textContent =
      latestRows.length + "件";

    // 表を生成
    const fragment = document.createDocumentFragment();

    latestRows.forEach(item => {
      const row = item.row;
      const tr = document.createElement("tr");

      const values = [
        latestDate,
        getCell(row, column.type),
        getCell(row, column.rank),
        getCell(row, column.episodeId),
        getCell(row, column.program),
        getCell(row, column.episodeTitle)
      ];

      values.forEach((value, index) => {
        const td = document.createElement("td");
        td.textContent = value;

        if (index === 2) {
          td.className = "rank";
        }

        if (index === 3) {
          td.className = "episode-id";
        }

        tr.appendChild(td);
      });

      fragment.appendChild(tr);
    });

    body.replaceChildren(fragment);

    status.textContent =
      "取得完了：" + latestRows.length +
      "件のランキングデータを表示しています。";

  } catch (error) {
    console.error("TVerランキング取得エラー:", error);

    document.getElementById("latestDate").textContent =
      "取得失敗";

    document.getElementById("resultCount").textContent =
      "0件";

    body.replaceChildren();

    const tr = document.createElement("tr");
    const td = document.createElement("td");

    td.colSpan = 6;
    td.className = "empty error";
    td.textContent = error.message;

    tr.appendChild(td);
    body.appendChild(tr);

    status.className = "status error";
    status.textContent =
      "データを取得できませんでした。";

  } finally {
    button.disabled = false;
  }
}


/* ============================================================
   CSVパーサー
   カンマ、ダブルクォート、改行を含むセルに対応
   ============================================================ */

function parseCSV(text) {
  // UTF-8 BOMを除去
  text = text.replace(/^\uFEFF/, "");

  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (inQuotes) {
      if (char === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }
      } else {
        field += char;
      }
      continue;
    }

    if (char === '"' && field === "") {
      inQuotes = true;
    } else if (char === ",") {
      row.push(field);
      field = "";
    } else if (char === "\n") {
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
    } else if (char === "\r") {
      // CRLF / CRを処理
      if (text[i + 1] !== "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      }
    } else {
      field += char;
    }
  }

  if (field !== "" || row.length > 0) {
    row.push(field);
    rows.push(row);
  }

  // 末尾の空行を除外
  while (
    rows.length &&
    rows[rows.length - 1].every(
      value => value.trim() === ""
    )
  ) {
    rows.pop();
  }

  return rows;
}


/* ============================================================
   ヘッダー検索
   ============================================================ */

function normalizeHeader(value) {
  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/[\s　_\-・]/g, "");
}

function findColumn(headers, candidates, fallbackIndex) {
  const normalizedCandidates =
    candidates.map(normalizeHeader);

  const index = headers.findIndex(header =>
    normalizedCandidates.includes(header)
  );

  // ヘッダーが見つからない場合は元のGASの列位置を使用
  return index >= 0 ? index : fallbackIndex;
}

function getCell(row, index) {
  return String(row[index] ?? "").trim();
}


/* ============================================================
   取得日時の解析
   ============================================================ */

function parseRankingTimestamp(value) {
  if (value === null || value === undefined) {
    return null;
  }

  const text = String(value).trim();

  if (!text) {
    return null;
  }

  // yyyy-MM-dd HH:mm:ss / yyyy/MM/dd HH:mm:ss
  // 日本時間として解析する
  const match = text.match(
    /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/
  );

  if (match) {
    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const hour = Number(match[4]);
    const minute = Number(match[5]);
    const second = Number(match[6] || 0);

    const timestamp = Date.UTC(
      year, month - 1, day, hour - 9, minute, second
    );

    const check = new Date(timestamp + 9 * 60 * 60 * 1000);

    if (
      check.getUTCFullYear() !== year ||
      check.getUTCMonth() !== month - 1 ||
      check.getUTCDate() !== day ||
      check.getUTCHours() !== hour ||
      check.getUTCMinutes() !== minute ||
      check.getUTCSeconds() !== second
    ) {
      return null;
    }

    return timestamp;
  }

  // ISO 8601など、タイムゾーンを含む形式にも対応
  const parsed = Date.parse(text);

  return Number.isNaN(parsed) ? null : parsed;
}


/* ============================================================
   日時表示
   ============================================================ */

function formatDate(timestamp) {
  const date = new Date(timestamp);

  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(date);

  const values = {};

  parts.forEach(part => {
    values[part.type] = part.value;
  });

  return (
    values.year + "-" +
    values.month + "-" +
    values.day + " " +
    values.hour + ":" +
    values.minute + ":" +
    values.second
  );
}


/* ============================================================
   イベント登録・初回読み込み
   ============================================================ */

document
  .getElementById("reloadButton")
  .addEventListener("click", outputLatestTverRanking);

// ページを開いたときに自動取得
outputLatestTverRanking();

</script>
</body>
</html>
