
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6b6cf">
  <title>テキストと画像を同時にコピー</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, sans-serif;
      background: #fff7fa;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0000000d;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 21px;
      text-align: center;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 300px;
      margin-top: 12px;
      object-fit: contain;
      border-radius: 10px;
      background: #f5f5f5;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #e86a9a;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 16px;
      color: #777;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>テキスト＋画像コピー</h1>

    <label for="textInput">コピーするテキスト</label>
    <textarea
      id="textInput"
      placeholder="ここにテキストを入力してください"
    >テキストと画像を同時にコピーしました。</textarea>

    <label for="imageInput">コピーする画像</label>
    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >

    <img id="preview" alt="画像プレビュー">

    <button id="copyButton" type="button">
      テキストと画像を同時にコピー
    </button>

    <p id="status" role="status" aria-live="polite">
      テキストと画像を選択してください。
    </p>

    <p class="note">
      ※ HTTPS または localhost で開いてください。<br>
      ※ コピー先のアプリがテキストと画像の両方の貼り付けに対応している必要があります。
    </p>
  </main>

  <script>
    const textInput = document.getElementById("textInput");
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const copyButton = document.getElementById("copyButton");
    const status = document.getElementById("status");

    let selectedImage = null;
    let previewUrl = null;

    // 画像を選択したときのプレビュー
    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      selectedImage = file || null;

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      if (!file) {
        preview.style.display = "none";
        preview.removeAttribute("src");
        status.textContent = "画像が選択されていません。";
        return;
      }

      if (!file.type.startsWith("image/")) {
        selectedImage = null;
        imageInput.value = "";
        preview.style.display = "none";
        status.textContent = "画像ファイルを選択してください。";
        return;
      }

      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.style.display = "block";
      status.textContent = "画像を選択しました。コピーできます。";
    });

    // 画像をPNG形式に変換
    async function convertToPng(file) {
      const bitmap = await createImageBitmap(file);

      try {
        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(bitmap, 0, 0);

        return await new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("画像の変換に失敗しました。"));
            }
          }, "image/png");
        });
      } finally {
        bitmap.close();
      }
    }

    // ボタンを押すとテキストと画像を同時にコピー
    copyButton.addEventListener("click", async () => {
      if (!selectedImage) {
        status.textContent = "先にコピーする画像を選択してください。";
        return;
      }

      if (
        !navigator.clipboard ||
        typeof ClipboardItem === "undefined"
      ) {
        status.textContent =
          "このブラウザでは同時コピーに対応していません。HTTPSのChromeなどでお試しください。";
        return;
      }

      copyButton.disabled = true;
      status.textContent = "コピーしています…";

      try {
        const textBlob = new Blob(
          [textInput.value],
          { type: "text/plain" }
        );

        const imageBlob = await convertToPng(selectedImage);

        // 1つのClipboardItemにテキストと画像を格納
        const item = new ClipboardItem({
          "text/plain": textBlob,
          "image/png": imageBlob
        });

        await navigator.clipboard.write([item]);

        status.textContent =
          "コピーしました！テキストと画像を貼り付けてください。";

      } catch (error) {
        console.error(error);

        status.textContent =
          "コピーに失敗しました。ブラウザの権限、HTTPS接続、コピー先アプリの対応状況を確認してください。";

      } finally {
        copyButton.disabled = false;
      }
    });
  </script>
</body>
</html>
