<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fde8ef">
  <meta name="description" content="サクラミーツとミーツメンバーの出演番組。TVerランキング通知">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="サクラミーツ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <title>サクラミーツ</title>
  <style>
    :root {
      --sakura: #e86a9a;
      --sakura-deep: #c94d7c;
      --sakura-soft: #f4a4c0;
      --sakura-pale: #fde8ef;
      --ink: #2a2430;
      --muted: #7d727a;
      --paper: rgba(255, 252, 250, .9);
      --line: rgba(201, 77, 124, .16);
      --shadow: 0 16px 40px rgba(90, 40, 70, .1);
      --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 8% 0%, rgba(244, 164, 192, .38), transparent 34%),
        radial-gradient(circle at 100% 8%, rgba(232, 106, 154, .14), transparent 28%),
        linear-gradient(165deg, #fffafc 0%, #fdf3f7 48%, #f7eef3 100%);
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
    button, input { font-family: inherit; }
    a { color: inherit; }
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: max(14px, env(safe-area-inset-top)) 20px 14px;
      background: rgba(255, 250, 252, .78);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }
    .mark {
      margin: 0 0 4px;
      color: var(--sakura-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    .app-title {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: .04em;
    }
    .app-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }
    .header-note {
      margin: 0;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 252, 250, .8);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .page {
      display: none;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 22px 16px 28px;
    }
    .page.active { display: block; }
    .section-label { margin: 0 0 14px; }
    .status { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .loading, .error {
      padding: 36px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .error {
      color: var(--sakura-deep);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .episode-list { display: grid; gap: 12px; }
    .episode {
      display: flex;
      align-items: center;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .episode:active { transform: scale(.985); }
    .thumb-wrap {
      flex: 0 0 168px;
      width: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6eef2;
    }
    .thumbnail {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: linear-gradient(160deg, #fde8ef, #f7d5e2);
    }
    .episode-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
    }
    .source {
      align-self: flex-start;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--sakura-pale);
      color: var(--sakura-deep);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
    }
    .episode-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .episode-link {
      color: var(--sakura-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .settings-header { margin-bottom: 16px; }
    .settings-title {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 600;
      line-height: 1.15;
    }
    .settings-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .settings-card {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }
    .settings-section { padding: 20px 18px; }
    .settings-section-title {
      margin: 0 0 4px;
      font-family: var(--display);
      font-size: 20px;
      font-weight: 600;
    }
    .settings-section-description {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .notification-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .notification-title { margin: 0; font-size: 14px; font-weight: 700; }
    .notification-status { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .notification-actions { display: flex; flex-direction: column; gap: 8px; }
    .notification-button {
      min-width: 132px;
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #e86a9a, #d95b8c);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(217, 91, 140, .22);
    }
    .notification-button:disabled { opacity: .5; box-shadow: none; cursor: default; }
    .notification-button.allowed {
      background: rgba(232, 106, 154, .1);
      color: var(--muted);
      box-shadow: none;
    }
    .notification-result {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.6;
    }
    .notification-result.show { display: block; }
    .notification-result.success { background: rgba(100, 190, 130, .12); color: #3f8d58; }
    .notification-result.error { background: rgba(232, 106, 154, .1); color: var(--sakura-deep); }
    .settings-divider { height: 1px; background: var(--line); }
    .topic-group + .topic-group { margin-top: 18px; }
    .topic-group-label {
      margin: 0 0 8px;
      color: var(--sakura-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    .topic-list { display: flex; flex-direction: column; gap: 8px; }
    .topic-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 12px;
      border: 1px solid rgba(201, 77, 124, .1);
      border-radius: 16px;
      background: rgba(255, 255, 255, .62);
    }
    .topic-name { margin: 0; font-size: 14px; font-weight: 700; }
    .topic-note { margin: 3px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .switch { position: relative; flex: 0 0 auto; width: 48px; height: 28px; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch-ui {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(122, 111, 120, .25);
      cursor: pointer;
      transition: background .2s ease;
    }
    .switch-ui::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(80, 40, 60, .18);
      transition: transform .2s ease;
    }
    .switch input:checked + .switch-ui { background: linear-gradient(135deg, #e86a9a, #d95b8c); }
    .switch input:checked + .switch-ui::after { transform: translateX(20px); }
    .switch input:disabled + .switch-ui { opacity: .45; cursor: default; }
    .app-info { padding: 18px; text-align: center; }
    .app-info-name { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    .app-info-version { margin: 5px 0 0; color: #a898a2; font-size: 11px; line-height: 1.6; }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 250, 252, .9);
      border-top: 1px solid var(--line);
    }
    .bottom-nav-inner {
      max-width: 420px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
    }
    .bottom-nav-item.active { color: var(--sakura-deep); background: rgba(232, 106, 154, .12); }
    .bottom-nav-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (min-width: 860px) {
      .episode-list { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 390px) {
      .header-note { display: none; }
      .thumb-wrap { flex-basis: 128px; width: 128px; }
      .episode-title { font-size: 13px; }
      .notification-setting { align-items: stretch; flex-direction: column; }
      .notification-button { width: 100%; }
    }
    @media (max-width: 768px) {
      .header, .bottom-nav { backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    /* Ranking section */
    .ranking-section {
      margin-bottom: 28px;
    }
    .ranking-frame {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 16px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    #ranking-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ranking-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 540px;
      margin: 0 auto;
    }
    .ranking-button {
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sakura), var(--sakura-deep));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(217, 91, 140, .22);
    }
    .ranking-button:disabled {
      opacity: .5;
      box-shadow: none;
      cursor: default;
    }
    .ranking-select {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 12px;
      display: block;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
    }

  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <p class="mark">SAKURAZAKA46</p>
        <h1 class="app-title">サクラミーツ</h1>
        <p class="app-subtitle">サクラミーツとミーツメンバーの出演番組</p>
      </div>
      <p class="header-note">非公式</p>
    </div>
  </header>
  <main id="homePage" class="page active">
    <div class="ranking-section">

    <div class="section-label">
      <p class="mark">出演</p>

    <div id="episodeList" class="episode-list">

  <main id="settingsPage" class="page">
    <div class="settings-header">

      <h2 class="settings-title">通知</h2>

            <button id="notificationButton" class="notification-button" type="button">通知を許可する</button>
            <button id="unsubscribeButton" class="notification-button allowed" type="button" hidden>通知を解除する</button>
          </div>
        </div>
        <div id="notificationResult" class="notification-result"></div>
      </div>
      <div class="settings-divider"></div>
      <div class="settings-section">

        <p class="settings-section-description">オフにしたものは、この端末には届きません。</p>
        <div class="topic-group">
          <p class="topic-group-label">サクラミーツ</p>
          <div class="topic-list">
            <label class="topic-row">
              <span>

              </span>
            </label>
            <label class="topic-row">
              <span>
                <span class="topic-name">みんなで追いミーツ</span>

              </span>
              <span class="switch">
                <input id="topicOimeets" type="checkbox" data-topic="oimeets">

              </span>

          </div>
        </div>
        <div class="topic-group">
          <p class="topic-group-label">メンバー</p>
          <div class="topic-list">

      <div class="app-info">

          <path d="M3 10.5L12 3l9 7.5"></path>

          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 1.42-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2v-.48a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.42-1.42.06-.06A1.7 1.7 0 0 0 9.4 15 1.7 1.7 0 0 0 7.84 13.97H7v-2h.84A1.7 1.7 0 0 0 9.4 11 1.7 1.7 0 0 0 9.06 9.12L9 9.06l1.42-1.42.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 13.4 6.48V6h2v.48A1.7 1.7 0 0 0 16.43 8a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.42 1.42-.06.06A1.7 1.7 0 0 0 19.4 11a1.7 1.7 0 0 0 1.56 1.03H21v2h-.04A1.7 1.7 0 0 0 19.4 15Z"></path>

  </nav>
  <script>
    // =========================================================
    // ランキング画像生成
    // =========================================================
    const RANKING_CONFIG = {
      PUBLISHED_ID: "2PACX-1vTJofs8FiOCnnavLtBInpn1d6u9YiJ6kZLFDBNI8iRTL4RBJBz3PSQtMSiSKt35B0xgtv6p9zKTy-75",
      GID: "91701956",
      THUMBNAIL_BASE: "https://46memorybit.github.io/meets_tver_thumbnail/images/",
      IMAGE_SIZE: 1080,
      THUMBNAIL_WIDTH_RATE: 0.82,
      THUMBNAIL_MAX_HEIGHT: 560
    };
    RANKING_CONFIG.CSV_URL = "https://docs.google.com/spreadsheets/d/e/" + RANKING_CONFIG.PUBLISHED_ID + "/pub?gid=" + RANKING_CONFIG.GID + "&single=true&output=csv";
    const RANKING_COLUMNS = {
      timestamp: 0,
      rankingType: 1,
      rankingId: 2,
      rank: 3,
      episodeId: 4,
      seriesId: 5,
      programName: 6,
      episodeTitle: 7
    };
    const rankingCanvas = document.getElementById("ranking-canvas");
    const rankingCtx = rankingCanvas.getContext("2d");

    const shareRankingButton = document.getElementById("share-ranking");
    const rankingStatus = document.getElementById("rankingStatus");
    let rankingLatestRows = [];
    let rankingLatestTimestamp = null;
    let rankingCurrentBlob = null;
    let rankingRenderVersion = 0;

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;
      text = text.replace(/^\uFEFF/, "");
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(cell);
          if (row.some(v => v.trim() !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }
      if (cell !== "" || row.length > 0) {
        row.push(cell);
        if (row.some(v => v.trim() !== "")) rows.push(row);
      }
      return rows;
    }

    function parseTimestamp(value) {
      if (value == null || String(value).trim() === "") return null;
      const text = String(value).trim();
      const match = text.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
      if (match) {
        const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), Number(match[4] || 0), Number(match[5] || 0), Number(match[6] || 0));
        if (!Number.isNaN(date.getTime())) return date;
      }
      const parsed = new Date(text);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatDate(date) {
      if (!date) return "-";
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    function drawRankingBackground() {
      const size = RANKING_CONFIG.IMAGE_SIZE;
      rankingCtx.clearRect(0, 0, size, size);
      const gradient = rankingCtx.createLinearGradient(0, 0, 0, size);
      gradient.addColorStop(0, "#fffafc");
      gradient.addColorStop(1, "#fde8ef");
      rankingCtx.fillStyle = gradient;
      rankingCtx.fillRect(0, 0, size, size);
    }

    function drawRankingHeader(programName, timestamp) {
      const size = RANKING_CONFIG.IMAGE_SIZE;
      const padding = 48;
      const fontSize = 28;
      rankingCtx.font = `700 ${fontSize}px "Zen Kaku Gothic New", sans-serif`;
      rankingCtx.fillStyle = "#2a2430";
      rankingCtx.textAlign = "left";
      rankingCtx.textBaseline = "middle";
      const maxProgramWidth = 560;
      const originalProgram = String(programName || "番組名なし");
      let program = originalProgram;
      while (rankingCtx.measureText(program).width > maxProgramWidth && program.length > 1) {
        program = program.slice(0, -1);
      }
      if (program !== originalProgram) program = program.slice(0, -1) + "…";
      rankingCtx.fillText(program, padding, 68);
      const dateText = formatDate(timestamp);
      rankingCtx.font = `500 18px "Zen Kaku Gothic New", sans-serif`;
      rankingCtx.fillStyle = "#7d727a";
      rankingCtx.textAlign = "right";
      rankingCtx.fillText(dateText, size - padding, 68);
    }

    function wrapRankingText(text, maxWidth) {
      const lines = [];
      let line = "";
      for (const char of text) {
        const candidate = line + char;
        if (line && rankingCtx.measureText(candidate).width > maxWidth) {
          lines.push(line);
          line = char;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawRankingEpisodeTitle(title) {
      const size = RANKING_CONFIG.IMAGE_SIZE;
      const padding = 60;
      const maxWidth = size - padding * 2;
      const text = String(title || "エピソードタイトルなし");
      rankingCtx.fillStyle = "#2a2430";
      rankingCtx.textAlign = "center";
      rankingCtx.textBaseline = "middle";
      const maxFontSize = 36;
      const minFontSize = 24;
      let fontSize = maxFontSize;
      while (fontSize > minFontSize) {
        rankingCtx.font = `700 ${fontSize}px "Zen Kaku Gothic New", sans-serif`;
        const lines = wrapRankingText(text, maxWidth);
        if (lines.length <= 3) break;
        fontSize -= 2;
      }
      rankingCtx.font = `700 ${fontSize}px "Zen Kaku Gothic New", sans-serif`;
      const lines = wrapRankingText(text, maxWidth);
      const visibleLines = lines.slice(0, 3);
      if (lines.length > 3) {
        let last = visibleLines[2];
        while (rankingCtx.measureText(last + "…").width > maxWidth && last.length > 1) {
          last = last.slice(0, -1);
        }
        visibleLines[2] = last + "…";
      }
      const lineHeight = fontSize * 1.45;
      const startY = 920 - ((visibleLines.length - 1) * lineHeight) / 2;
      visibleLines.forEach((line, index) => {
        rankingCtx.fillText(line, size / 2, startY + index * lineHeight, maxWidth);
      });
    }

    function drawRankingBadge(rank, thumbX, thumbY, thumbHeight) {
      const rawRank = String(rank ?? "").trim();
      if (!rawRank) return;
      const label = `#${rawRank}`;
      rankingCtx.save();
      const fontSize = 62;
      const paddingX = 28;
      const badgeHeight = 96;
      rankingCtx.font = `900 ${fontSize}px "Zen Kaku Gothic New", sans-serif`;
      const badgeWidth = Math.max(150, rankingCtx.measureText(label).width + paddingX * 2);
      const badgeX = thumbX - 18;
      const badgeY = thumbY + thumbHeight - badgeHeight + 28;
      const radius = 20;
      rankingCtx.shadowColor = "rgba(90, 40, 70, 0.25)";
      rankingCtx.shadowBlur = 16;
      rankingCtx.shadowOffsetX = 0;
      rankingCtx.shadowOffsetY = 6;
      rankingCtx.beginPath();
      rankingCtx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, radius);
      rankingCtx.fillStyle = "#e86a9a";
      rankingCtx.fill();
      rankingCtx.shadowColor = "transparent";
      rankingCtx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      rankingCtx.lineWidth = 1.5;
      rankingCtx.stroke();
      rankingCtx.fillStyle = "#FFFFFF";
      rankingCtx.font = `900 ${fontSize}px "Zen Kaku Gothic New", sans-serif`;
      rankingCtx.textAlign = "center";
      rankingCtx.textBaseline = "middle";
      const textX = badgeX + badgeWidth / 2;
      const textY = badgeY + badgeHeight / 2 + 1;
      rankingCtx.fillText(label, textX, textY);
      rankingCtx.restore();
    }

    function drawRankingThumbnail(img, rank) {
      const size = RANKING_CONFIG.IMAGE_SIZE;
      const maxWidth = size * RANKING_CONFIG.THUMBNAIL_WIDTH_RATE;
      const maxHeight = RANKING_CONFIG.THUMBNAIL_MAX_HEIGHT;
      const scale = Math.min(maxWidth / img.naturalWidth, maxHeight / img.naturalHeight);
      const width = img.naturalWidth * scale;
      const height = img.naturalHeight * scale;
      const x = (size - width) / 2;
      const minY = 160;
      const maxY = 800;
      const availableHeight = maxY - minY;
      const y = minY + (availableHeight - height) / 2;
      rankingCtx.save();
      rankingCtx.shadowColor = "rgba(90, 40, 70, 0.18)";
      rankingCtx.shadowBlur = 24;
      rankingCtx.shadowOffsetX = 0;
      rankingCtx.shadowOffsetY = 8;
      const radius = 18;
      rankingCtx.beginPath();
      rankingCtx.roundRect(x, y, width, height, radius);
      rankingCtx.clip();
      rankingCtx.drawImage(img, x, y, width, height);
      rankingCtx.restore();
      drawRankingBadge(rank, x, y, height);
    }

    async function renderRankingImage(row) {
      const version = ++rankingRenderVersion;
      saveRankingButton.disabled = true;
      shareRankingButton.disabled = true;
      rankingCurrentBlob = null;
      const programName = String(row[RANKING_COLUMNS.programName] || "").trim() || "番組名なし";
      const episodeTitle = String(row[RANKING_COLUMNS.episodeTitle] || "").trim() || "エピソードタイトルなし";
      const episodeId = String(row[RANKING_COLUMNS.episodeId] || "").trim();
      drawRankingBackground();
      drawRankingHeader(programName, rankingLatestTimestamp);
      drawRankingEpisodeTitle(episodeTitle);
      if (!episodeId) {
        rankingStatus.textContent = "エピソードIDがないため、サムネイルを表示できません。";
        return;
      }
      const imageUrl = RANKING_CONFIG.THUMBNAIL_BASE + encodeURIComponent(episodeId) + ".jpg";
      rankingStatus.textContent = "サムネイルを読み込んでいます...";
      try {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.referrerPolicy = "no-referrer";
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("サムネイルを取得できませんでした。"));
          img.src = imageUrl;
        });
        if (version !== rankingRenderVersion) return;
        if (!img.naturalWidth || !img.naturalHeight) throw new Error("画像サイズを取得できませんでした。");
        drawRankingBackground();
        drawRankingHeader(programName, rankingLatestTimestamp);
        drawRankingThumbnail(img, row[RANKING_COLUMNS.rank]);
        drawRankingEpisodeTitle(episodeTitle);
        const blob = await new Promise((resolve, reject) => {
          rankingCanvas.toBlob(b => b ? resolve(b) : reject(new Error("画像の準備に失敗しました。")), "image/png");
        });
        if (version !== rankingRenderVersion) return;
        rankingCurrentBlob = blob;
        saveRankingButton.disabled = false;
        shareRankingButton.disabled = false;
        rankingStatus.textContent = "画像を生成しました。";
      } catch (error) {
        if (version !== rankingRenderVersion) return;
        drawRankingBackground();
        drawRankingHeader(programName, rankingLatestTimestamp);
        drawRankingEpisodeTitle(episodeTitle);
        rankingCurrentBlob = null;
        saveRankingButton.disabled = true;
        shareRankingButton.disabled = true;
        rankingStatus.textContent = error.message + " GitHub Pages上の画像を確認してください。";
        console.error(error);
      }
    }

    async function loadLatestRanking() {
      rankingSelect.disabled = true;
      saveRankingButton.disabled = true;
      shareRankingButton.disabled = true;
      rankingStatus.textContent = "公開スプレッドシートを読み込んでいます...";
      try {
        const response = await fetch(RANKING_CONFIG.CSV_URL + "&_=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("CSV取得エラー: HTTP " + response.status);
        const csvText = await response.text();
        const trimmedCSV = csvText.trim();
        if (!trimmedCSV || /^<!DOCTYPE html/i.test(trimmedCSV) || /^<html/i.test(trimmedCSV)) {
          throw new Error("公開CSVを取得できません。スプレッドシートの公開設定を確認してください。");
        }
        const parsedRows = parseCSV(csvText);
        if (!parsedRows.length) throw new Error("CSVにデータがありません。");
        let dataRows = parsedRows;
        const firstRow = parsedRows[0].map(v => v.trim().replace(/\s+/g, "").toLowerCase());
        if (firstRow.some(v => ["取得日時", "取得時刻", "timestamp"].includes(v))) {
          dataRows = parsedRows.slice(1);
        }
        const validRows = dataRows.map(row => ({
          row,
          timestamp: parseTimestamp(row[RANKING_COLUMNS.timestamp])
        })).filter(item => item.timestamp !== null);
        if (!validRows.length) throw new Error("有効な取得日時が見つかりません。");
        const latestTime = Math.max(...validRows.map(item => item.timestamp.getTime()));
        rankingLatestTimestamp = new Date(latestTime);
        rankingLatestRows = validRows.filter(item => item.timestamp.getTime() === latestTime).map(item => item.row);
        if (!rankingLatestRows.length) throw new Error("最新データがありません。");
        rankingLatestRows.sort((a, b) => {
          const ra = parseInt(a[RANKING_COLUMNS.rank], 10) || 999;
          const rb = parseInt(b[RANKING_COLUMNS.rank], 10) || 999;
          return ra - rb;
        });
        rankingSelect.replaceChildren();
        rankingLatestRows.forEach((row, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          const rank = String(row[RANKING_COLUMNS.rank] || "-").trim();
          const program = row[RANKING_COLUMNS.programName] || "番組名なし";
          const title = row[RANKING_COLUMNS.episodeTitle] || "タイトルなし";
          option.textContent = rank + "位｜" + program + "｜" + title;
          rankingSelect.appendChild(option);
        });
        rankingSelect.disabled = false;
        rankingStatus.textContent = "最新取得日時：" + formatDate(rankingLatestTimestamp) + " ／ " + rankingLatestRows.length + "件";
        if (rankingLatestRows.length) await renderRankingImage(rankingLatestRows[0]);
      } catch (error) {
        rankingStatus.textContent = "データ取得エラー：" + error.message;
        console.error(error);
        rankingLatestRows = [];
        rankingCurrentBlob = null;
        rankingSelect.replaceChildren();
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "データを取得できませんでした";
        rankingSelect.appendChild(option);
      }
    }

    function saveRankingImage() {
      if (!rankingCurrentBlob) {
        rankingStatus.textContent = "保存できる画像がありません。";
        return;
      }
      const url = URL.createObjectURL(rankingCurrentBlob);
      const link = document.createElement("a");
      const row = rankingLatestRows[Number(rankingSelect.value)] || [];
      const episodeId = String(row[RANKING_COLUMNS.episodeId] || "episode");
      const safeEpisodeId = episodeId.replace(/[^a-zA-Z0-9_-]/g, "_");
      link.href = url;
      link.download = "tver-ranking-" + safeEpisodeId + ".png";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      rankingStatus.textContent = "PNG画像の保存を開始しました。";
    }

    async function shareRankingImage() {
      if (!rankingCurrentBlob) {
        rankingStatus.textContent = "シェアできる画像がありません。";
        return;
      }
      const row = rankingLatestRows[Number(rankingSelect.value)] || [];
      const rank = String(row[RANKING_COLUMNS.rank] || "").trim();
      const program = String(row[RANKING_COLUMNS.programName] || "").trim();
      const title = String(row[RANKING_COLUMNS.episodeTitle] || "").trim();
      const text = `TVerランキング ${rank}位\n${program}\n${title}\n#サクラミーツ #TVer`;
      const file = new File([rankingCurrentBlob], "tver-ranking.png", { type: "image/png" });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: "TVerランキング",
            text: text
          });
          rankingStatus.textContent = "シェアしました。";
        } catch (error) {
          if (error.name !== "AbortError") {
            rankingStatus.textContent = "シェアに失敗しました。";
            console.error(error);
          }
        }
      } else {
        rankingStatus.textContent = "Web Share APIが利用できません。画像を保存してからシェアしてください。";
      }
    }

    rankingSelect.addEventListener("change", () => {
      const row = rankingLatestRows[Number(rankingSelect.value)];
      if (row) renderRankingImage(row);
    });
    saveRankingButton.addEventListener("click", saveRankingImage);
    shareRankingButton.addEventListener("click", shareRankingImage);

    const API_URL = "https://api.konnagi.com/meets-app-tver&radiko";
    const PUSH_API_URL = "https://sakurameets-push.aknhry819.workers.dev";
    const TOPIC_STORAGE_KEY = "web_push_topics";
    const TOPIC_DEFS = [
      { id: "ranking", label: "TVerランキング", group: "show", defaultOn: true },
      { id: "oimeets", label: "みんなで追いミーツ", group: "show", defaultOn: true },
      { id: "onuma", label: "大沼晶保ちゃん関連", group: "member", defaultOn: false },
      { id: "kojima", label: "小島凪紗ちゃん関連", group: "member", defaultOn: false },
      { id: "taniguchi", label: "谷口愛季ちゃん関連", group: "member", defaultOn: false },
      { id: "nakashima", label: "中嶋優月ちゃん関連", group: "member", defaultOn: false },
      { id: "sato", label: "佐藤愛桜ちゃん関連", group: "member", defaultOn: false },
      { id: "yamada", label: "山田桃実ちゃん関連", group: "member", defaultOn: false }
    ];
    const episodeList = document.getElementById("episodeList");
    const status = document.getElementById("status");
    const homePage = document.getElementById("homePage");
    const settingsPage = document.getElementById("settingsPage");
    const bottomNavItems = document.querySelectorAll(".bottom-nav-item");
    const notificationButton = document.getElementById("notificationButton");
    const notificationStatus = document.getElementById("notificationStatus");
    const notificationResult = document.getElementById("notificationResult");
    const unsubscribeButton = document.getElementById("unsubscribeButton");
    const topicInputs = document.querySelectorAll("[data-topic]");
    function defaultTopics() {
      const topics = {};
      TOPIC_DEFS.forEach((topic) => { topics[topic.id] = topic.defaultOn; });
      return topics;
    }
    function readTopics() {
      const topics = defaultTopics();
      try {
        const saved = JSON.parse(localStorage.getItem(TOPIC_STORAGE_KEY) || "null");
        if (saved && typeof saved === "object") {
          if (!("ranking" in saved) && "surge" in saved) saved.ranking = saved.surge;
          if (!("sato" in saved) && "satoao" in saved) saved.sato = saved.satoao;
          TOPIC_DEFS.forEach((topic) => {
            if (topic.id in saved) topics[topic.id] = saved[topic.id] !== false && saved[topic.id] !== 0;
          });
        }
      } catch (error) {
        console.error(error);
      }
      return topics;
    }
    function writeTopics(topics) {
      localStorage.setItem(TOPIC_STORAGE_KEY, JSON.stringify(topics));
    }
    function currentTopics() {
      const topics = defaultTopics();
      topicInputs.forEach((input) => { topics[input.dataset.topic] = input.checked; });
      return topics;
    }
    function syncTopicInputs(topics, enabled) {
      topicInputs.forEach((input) => {
        input.checked = Boolean(topics && topics[input.dataset.topic]);
        input.disabled = !enabled;
      });
    }
    function topicSummary(topics) {
      return TOPIC_DEFS.filter((topic) => topics[topic.id]).map((topic) => topic.label);
    }
    function getLinkMessage(url) {
      try {
        const hostname = new URL(url).hostname.toLowerCase();
        if (hostname === "tver.jp" || hostname.endsWith(".tver.jp")) return "TVerで見る";
        if (hostname === "radiko.jp" || hostname.endsWith(".radiko.jp")) return "radikoで聴く";
        return "開く";
      } catch (error) {
        return "";
      }
    }
    function sourceLabel(url) {
      try {
        const hostname = new URL(url).hostname.toLowerCase();
        if (hostname === "tver.jp" || hostname.endsWith(".tver.jp")) return "TVer";
        if (hostname === "radiko.jp" || hostname.endsWith(".radiko.jp")) return "radiko";
      } catch (error) {
        return "";
      }
      return "";
    }
    function showListError(message) {
      status.textContent = message;
      episodeList.replaceChildren();
      const box = document.createElement("div");
      box.className = "error";
      box.textContent = message;
      episodeList.appendChild(box);
    }
    async function loadEpisodes() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch(API_URL, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("APIのレスポンス形式が正しくありません");
        renderEpisodes(data);
      } catch (error) {
        console.error(error);
        showListError(error.name === "AbortError"
          ? "エピソードの取得がタイムアウトしました。"
          : "エピソード情報を取得できませんでした。");
      } finally {
        clearTimeout(timer);
      }
    }
    function renderEpisodes(episodes) {
      episodeList.replaceChildren();
      if (!episodes.length) {
        showListError("現在表示できるエピソードがありません。");
        return;
      }
      status.textContent = episodes.length + "件のエピソード";
      episodes.forEach((episode) => {
        const title = episode.title || "タイトルなし";
        const episodeURL = episode.episodeURL || "#";
        const linkMessage = getLinkMessage(episodeURL);
        const source = sourceLabel(episodeURL);
        const link = document.createElement("a");
        link.className = "episode";
        link.href = episodeURL;
        link.target = "_blank";
        link.rel = "noopener";
        const thumbWrap = document.createElement("span");
        thumbWrap.className = "thumb-wrap";
        const image = document.createElement("img");
        image.className = "thumbnail";
        image.alt = "";
        if (episode.horizontal_thumbnail_path) image.src = episode.horizontal_thumbnail_path;
        thumbWrap.appendChild(image);
        const content = document.createElement("span");
        content.className = "episode-content";
        if (source) {
          const badge = document.createElement("span");
          badge.className = "source";
          badge.textContent = source;
          content.appendChild(badge);
        }
        const heading = document.createElement("span");
        heading.className = "episode-title";
        heading.textContent = title;
        content.appendChild(heading);
        if (linkMessage) {
          const action = document.createElement("span");
          action.className = "episode-link";
          action.textContent = linkMessage + " ↗";
          content.appendChild(action);
        }
        link.append(thumbWrap, content);
        episodeList.appendChild(link);
      });
    }
    function switchPage(page) {
      const isHome = page === "home";
      homePage.classList.toggle("active", isHome);
      settingsPage.classList.toggle("active", !isHome);
      bottomNavItems.forEach((item) => {
        const active = item.dataset.page === page;
        item.classList.toggle("active", active);
        if (active) item.setAttribute("aria-current", "page");
        else item.removeAttribute("aria-current");
      });
      if (!isHome) updateNotificationStatus();
    }
    function showNotificationResult(message, kind) {
      notificationResult.textContent = message;
      notificationResult.className = "notification-result show " + (kind || "");
    }
    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);
      const output = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) output[i] = raw.charCodeAt(i);
      return output;
    }
    async function updateNotificationStatus() {
      const savedTopics = readTopics();
      if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
        notificationStatus.textContent = "このブラウザは通知に対応していません。";
        notificationButton.disabled = true;
        syncTopicInputs(savedTopics, false);
        return;
      }
      const permission = Notification.permission;
      if (permission === "denied") {
        notificationStatus.textContent = "通知がブロックされています。ブラウザの設定から許可してください。";
        notificationButton.disabled = true;
        syncTopicInputs(savedTopics, false);
        return;
      }
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      const enabled = Boolean(subscription) && permission === "granted";
      notificationButton.hidden = enabled;
      unsubscribeButton.hidden = !enabled;
      notificationStatus.textContent = enabled
        ? "この端末で受け取れます。"
        : "まだこの端末では受け取れません。";
      syncTopicInputs(savedTopics, true);
    }
    async function ensureSubscription(topics) {
      if (!PUSH_API_URL || PUSH_API_URL.includes("YOUR_SUBDOMAIN")) {
        throw new Error("PUSH_API_URL が設定されていません。");
      }
      const permission = await Notification.requestPermission();
      if (permission !== "granted") throw new Error("通知が許可されませんでした。");
      const registration = await navigator.serviceWorker.ready;
      const keyResponse = await fetch(PUSH_API_URL + "/vapid-public-key", { cache: "no-store" });
      if (!keyResponse.ok) throw new Error("公開鍵を取得できませんでした。");
      const keyJson = await keyResponse.json();
      const vapidPublicKey = keyJson.publicKey;
      if (!vapidPublicKey) throw new Error("公開鍵が空です。");
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
        });
      }
      const saveResponse = await fetch(PUSH_API_URL + "/subscribe", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ subscription, topics })
      });
      if (!saveResponse.ok) throw new Error("購読を保存できませんでした。");
      const saved = await saveResponse.json();
      return saved.topics || topics;
    }
    async function saveTopicPreference(topics) {
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      if (!subscription) return ensureSubscription(topics);
      const response = await fetch(PUSH_API_URL + "/preferences", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ endpoint: subscription.endpoint, topics })
      });
      if (!response.ok) return ensureSubscription(topics);
      const saved = await response.json();
      return saved.topics || topics;
    }
    async function subscribeToPush() {
      notificationButton.disabled = true;
      try {
        const topics = await ensureSubscription(currentTopics());
        writeTopics(topics);
        syncTopicInputs(topics, true);
        showNotificationResult("通知を受け取れるようにしました。", "success");
        await updateNotificationStatus();
      } catch (error) {
        console.error(error);
        showNotificationResult(error.message || "通知を設定できませんでした。", "error");
      } finally {
        notificationButton.disabled = false;
      }
    }
    async function unsubscribeFromPush() {
      unsubscribeButton.disabled = true;
      try {
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();
        if (subscription) {
          await fetch(PUSH_API_URL + "/unsubscribe", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ endpoint: subscription.endpoint })
          });
          await subscription.unsubscribe();
        }
        showNotificationResult("この端末の通知を解除しました。", "success");
        await updateNotificationStatus();
      } catch (error) {
        console.error(error);
        showNotificationResult("解除できませんでした。", "error");
      } finally {
        unsubscribeButton.disabled = false;
      }
    }
    bottomNavItems.forEach((item) => {
      item.addEventListener("click", () => switchPage(item.dataset.page));
    });
    notificationButton.addEventListener("click", subscribeToPush);
    unsubscribeButton.addEventListener("click", unsubscribeFromPush);
    topicInputs.forEach((input) => {
      input.addEventListener("change", async () => {
        const topics = currentTopics();
        topicInputs.forEach((item) => { item.disabled = true; });
        try {
          const saved = await saveTopicPreference(topics);
          writeTopics(saved);
          syncTopicInputs(saved, true);
          const labels = topicSummary(saved);
          showNotificationResult(
            labels.length ? labels.join("、") + " を受け取ります。" : "すべての通知をオフにしました。",
            "success"
          );
        } catch (error) {
          console.error(error);
          showNotificationResult(error.message || "設定を保存できませんでした。", "error");
          syncTopicInputs(readTopics(), true);
        }
      });
    });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((error) => console.error(error));
    }
    syncTopicInputs(readTopics(), true);
    loadEpisodes();
    loadLatestRanking();
    updateNotificationStatus();
  </script>
</body>
</html>
