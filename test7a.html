
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fde8ef">
  <meta name="description" content="サクラミーツのエピソード画像を作成・共有">
  <title>サクラミーツ画像メーカー</title>

  <style>
    :root {
      --pink: #e86a9a;
      --pink-light: #fde8ef;
      --orange: #f58b29;
      --text: #493942;
      --muted: #8b7881;
      --border: #f1d4df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px 32px;
      background: linear-gradient(180deg, #fff7fa 0%, #fff 100%);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 22px;
      letter-spacing: 0.04em;
    }

    .description {
      margin: 0 0 20px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* 正方形プレビュー */
    #preview {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 5px 24px rgb(125 59 83 / 10%);
    }

    #captureCard {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 4.2%;
      background:
        radial-gradient(circle at 100% 0%, #fff0f5 0, transparent 40%),
        #fff;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      min-height: 10%;
      margin-bottom: 2%;
    }

    #programName {
      max-width: 72%;
      color: var(--pink);
      font-size: clamp(11px, 3.1vw, 16px);
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #createdAt {
      flex-shrink: 0;
      color: var(--muted);
      font-size: clamp(8px, 2.1vw, 11px);
      text-align: right;
      line-height: 1.4;
    }

    #thumbnailFrame {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff5f8;
      border-radius: 8px;
    }

    #thumbnail {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #imagePlaceholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    #imagePlaceholder[hidden] {
      display: none;
    }

    /* サムネイル左下に重ねる順位バッジ */
    #rankBadge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 2;
      padding: 6px 11px;
      border: 2px solid #fff;
      border-radius: 7px;
      background: var(--pink);
      color: #fff;
      font-size: clamp(14px, 3.8vw, 21px);
      font-weight: 900;
      line-height: 1.2;
      text-shadow: 0 1px 2px rgb(0 0 0 / 20%);
      box-shadow: 0 2px 8px rgb(0 0 0 / 25%);
      white-space: nowrap;
    }

    /* エピソードIDは右下に表示 */
    #episodeIdBadge {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 2;
      max-width: calc(100% - 110px);
      padding: 5px 9px;
      overflow: hidden;
      border-radius: 5px;
      background: rgb(30 20 25 / 78%);
      color: #fff;
      font-size: clamp(9px, 2.3vw, 12px);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #episodeTitle {
      display: -webkit-box;
      flex-shrink: 0;
      margin: 3.5% 0 0;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(12px, 3.2vw, 17px);
      font-weight: 800;
      line-height: 1.45;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2%;
      color: var(--muted);
      font-size: clamp(8px, 2vw, 10px);
    }

    .brand {
      color: var(--pink);
      font-weight: 800;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 48px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #shareButton {
      background: var(--pink);
      color: #fff;
    }

    #saveButton {
      background: var(--pink-light);
      color: #a53f69;
      border: 1px solid var(--border);
    }

    #status {
      min-height: 42px;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .episode-link {
      display: block;
      margin-top: 12px;
      color: #bf4d7b;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .episode-link:hover {
      text-decoration: underline;
    }

    @media (min-width: 560px) {
      body {
        padding-top: 32px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>サクラミーツ画像メーカー</h1>
    <p class="description">エピソードのサムネイルを画像にして共有</p>

    <div id="preview">
      <div id="captureCard">
        <div class="card-header">
          <div id="programName">サクラミーツ</div>
          <div id="createdAt"></div>
        </div>

        <div id="thumbnailFrame">
          <div id="imagePlaceholder">サムネイルを読み込んでいます…</div>
          <img id="thumbnail" alt="エピソードのサムネイル">
          <div id="rankBadge" hidden></div>
          <div id="episodeIdBadge" hidden></div>
        </div>

        <p id="episodeTitle">データを取得しています…</p>

        <div class="card-footer">
          <span class="brand">サクラミーツ応援</span>
          <span id="sourceLabel">EPISODE</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="shareButton" disabled>画像をXで共有</button>
      <button id="saveButton" disabled>画像を保存</button>
    </div>

    <div id="status" role="status" aria-live="polite">
      公開スプレッドシートからデータを取得しています…
    </div>

    <a
      id="episodeLink"
      class="episode-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      hidden
    >エピソードを開く</a>
  </main>

  <!-- HTMLをPNG画像に変換 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    "use strict";

    // =========================================================
    // 設定
    // =========================================================

    const CONFIG = {
      // 公開Googleスプレッドシート（TVerランキングデータ）
      PUBLISHED_ID: "2PACX-1vTJofs8FiOCnnavLtBInpn1d6u9YiJ6kZLFDBNI8iRTL4RBJBz3PSQtMSiSKt35B0xgtv6p9zKTy-75",
      SHEET_GID: "91701956",
      SERIES_ID: "srx97ftk3w",

      // 指定されたGitHub Pagesのサムネイル
      THUMBNAIL_TEMPLATE:
        "https://46memorybit.github.io/meets_tver_thumbnail/images/{id}.jpg",

      CAPTURE_SCALE: 2
    };

    // =========================================================
    // DOM
    // =========================================================

    const captureCard = document.getElementById("captureCard");
    const programNameElement = document.getElementById("programName");
    const createdAtElement = document.getElementById("createdAt");
    const thumbnailElement = document.getElementById("thumbnail");
    const placeholderElement = document.getElementById("imagePlaceholder");
    const rankBadge = document.getElementById("rankBadge");
    const episodeIdBadge = document.getElementById("episodeIdBadge");
    const episodeTitleElement = document.getElementById("episodeTitle");
    const sourceLabelElement = document.getElementById("sourceLabel");
    const shareButton = document.getElementById("shareButton");
    const saveButton = document.getElementById("saveButton");
    const statusElement = document.getElementById("status");
    const episodeLink = document.getElementById("episodeLink");

    let currentEpisode = null;
    let imageReady = false;
    let currentImage = null;

    // =========================================================
    // 共通処理
    // =========================================================

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function getEpisodeId(value) {
      if (!value) return "";
      // スプレッドシート由来のID、またはTVerエピソードURLの両方に対応
      const text = String(value).trim();
      if (/^[a-zA-Z0-9_-]+$/.test(text) && !text.includes("/")) return text;
      try {
        const parsed = new URL(text);
        const match = parsed.pathname.match(/\/episodes\/([^/?#]+)/i);
        return match ? match[1] : "";
      } catch (error) {
        const match = text.match(/\/episodes\/([^/?#]+)/i);
        return match ? match[1] : "";
      }
    }

    function isTverEpisode(item) {
      return Boolean(item && item.seriesId === CONFIG.SERIES_ID);
    }

    function getProgramName(item) {
      return "サクラミーツ";
    }

    function getThumbnailUrl(item) {
      const episodeId = String(item.episodeId || "").trim();
      if (!episodeId) return "";
      return CONFIG.THUMBNAIL_TEMPLATE.replace(
        "{id}",
        encodeURIComponent(episodeId)
      );
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();

        // Canvasに描画できるようCORSモードで読み込む
        // 配信元がCORSを許可していない場合、この画像は失敗することがある
        img.crossOrigin = "anonymous";

        img.onload = () => {
          if (img.naturalWidth > 0 && img.naturalHeight > 0) {
            resolve(img);
          } else {
            reject(new Error("画像サイズが不正です"));
          }
        };

        img.onerror = () => {
          reject(new Error("画像の読み込みに失敗しました"));
        };

        img.src = url;
      });
    }

    function updateCreatedAt() {
      const now = new Date();

      createdAtElement.textContent =
        now.toLocaleDateString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }) +
        "\n" +
        now.toLocaleTimeString("ja-JP", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
    }

    // =========================================================
    // 公開GoogleスプレッドシートからCSV取得
    // =========================================================

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              quoted = false;
            }
          } else {
            field += ch;
          }
        } else if (ch === '"') {
          quoted = true;
        } else if (ch === ",") {
          row.push(field);
          field = "";
        } else if (ch === "\n") {
          row.push(field.replace(/\r$/, ""));
          if (row.some(value => value.trim() !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += ch;
        }
      }

      if (field.length || row.length) {
        row.push(field.replace(/\r$/, ""));
        if (row.some(value => value.trim() !== "")) rows.push(row);
      }
      return rows;
    }

    async function fetchEpisodes() {
      setStatus("公開Googleスプレッドシートからデータを取得しています…");

      const csvUrl =
        "https://docs.google.com/spreadsheets/d/e/" +
        CONFIG.PUBLISHED_ID +
        "/pub?gid=" + encodeURIComponent(CONFIG.SHEET_GID) +
        "&single=true&output=csv";

      const response = await fetch(csvUrl, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("公開スプレッドシートの取得に失敗しました（HTTP " +
          response.status + "）");
      }

      const csvText = await response.text();
      const rows = parseCSV(csvText);

      if (rows.length < 2) {
        throw new Error("公開CSVにデータがありません。公開設定とシートIDを確認してください。");
      }

      // 列順（0始まり）:
      // timestamp=0, rankingType=1, rankingId=2, rank=3,
      // episodeId=4, seriesId=5, programName=6, episodeTitle=7
      const records = rows.slice(1).map(row => ({
        timestamp: String(row[0] || "").trim(),
        rankingType: String(row[1] || "").trim(),
        rankingId: String(row[2] || "").trim(),
        rank: Number(String(row[3] || "").replace(/[^0-9]/g, "")) || 999999,
        episodeId: String(row[4] || "").trim(),
        seriesId: String(row[5] || "").trim(),
        programName: String(row[6] || "").trim(),
        title: String(row[7] || "").trim()
      })).filter(item =>
        item.episodeId &&
        item.title &&
        item.seriesId === CONFIG.SERIES_ID
      );

      if (records.length === 0) {
        throw new Error("公開CSVにサクラミーツのエピソードが見つかりませんでした。");
      }

      // 取得日時が最新のスナップショットを優先し、その中で順位が高い項目を表示。
      const latestTimestamp = records.reduce((latest, item) => {
        const current = Date.parse(item.timestamp);
        const previous = Date.parse(latest);
        return Number.isFinite(current) &&
          (!Number.isFinite(previous) || current > previous)
          ? item.timestamp
          : latest;
      }, records[0].timestamp);

      let latestRecords = records.filter(item => item.timestamp === latestTimestamp);
      latestRecords.sort((a, b) => a.rank - b.rank);

      // 同一エピソードの重複を除外
      const seen = new Set();
      latestRecords = latestRecords.filter(item => {
        if (seen.has(item.episodeId)) return false;
        seen.add(item.episodeId);
        return true;
      });

      if (latestRecords.length === 0) {
        throw new Error("最新データから有効なエピソードを選択できませんでした。");
      }

      return latestRecords[0];
    }

    // =========================================================
    // エピソード表示
    // =========================================================

    async function renderEpisode(item) {
      currentEpisode = item;
      currentImage = null;
      imageReady = false;

      shareButton.disabled = true;
      saveButton.disabled = true;

      programNameElement.textContent = getProgramName(item);
      episodeTitleElement.textContent = item.title || "タイトル不明";
      sourceLabelElement.textContent = isTverEpisode(item) ? "TVER" : "RADIKO";

      updateCreatedAt();

      const episodeId = getEpisodeId(item.episodeId);

      // 順位をサムネイル左下に重ねて表示
      if (Number.isFinite(Number(item.rank)) && Number(item.rank) > 0 && Number(item.rank) < 999999) {
        rankBadge.textContent = Number(item.rank) + "位";
        rankBadge.hidden = false;
      } else {
        rankBadge.textContent = "順位不明";
        rankBadge.hidden = false;
      }

      // エピソードIDはサムネイル右下に表示
      if (episodeId) {
        episodeIdBadge.textContent = "ID: " + episodeId;
        episodeIdBadge.hidden = false;
      } else {
        episodeIdBadge.hidden = true;
      }

      if (item.episodeId) {
        try {
          const parsed = new URL("https://tver.jp/episodes/" + encodeURIComponent(item.episodeId));

          if (parsed.protocol === "https:" || parsed.protocol === "http:") {
            episodeLink.href = parsed.href;
            episodeLink.hidden = false;
          } else {
            episodeLink.hidden = true;
          }
        } catch (error) {
          episodeLink.hidden = true;
        }
      } else {
        episodeLink.hidden = true;
      }

      thumbnailElement.removeAttribute("src");
      placeholderElement.hidden = false;
      placeholderElement.textContent = "サムネイルを読み込んでいます…";

      const thumbnailUrl = getThumbnailUrl(item);

      if (!thumbnailUrl) {
        placeholderElement.textContent = "エピソードIDがありません";
        setStatus("スプレッドシートのエピソードID列を確認してください。");
        return;
      }

      let loadedImage;
      try {
        loadedImage = await loadImage(thumbnailUrl);
      } catch (error) {
        placeholderElement.textContent = "サムネイルを取得できませんでした";
        setStatus(
          "指定されたサムネイルURLから画像を取得できませんでした。\n" +
          thumbnailUrl + "\n" + error.message +
          "\nGitHub Pages上に画像が存在するか確認してください。"
        );
        return;
      }

      currentImage = loadedImage;
      thumbnailElement.src = loadedImage.src;
      placeholderElement.hidden = true;

      imageReady = true;
      shareButton.disabled = false;
      saveButton.disabled = false;

      setStatus(
        "サムネイルを表示しました。\n" +
        "エピソードID：" + (episodeId || "なし") + "\n" +
        "画像URL：" + thumbnailUrl
      );
    }

    // =========================================================
    // キャプチャ
    // =========================================================

    async function createImageBlob() {
      if (!currentEpisode || !imageReady || !currentImage) {
        throw new Error("画像の準備が完了していません");
      }

      if (typeof html2canvas !== "function") {
        throw new Error("画像生成ライブラリを読み込めませんでした");
      }

      // フォント・画像の描画を待機
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const canvas = await html2canvas(captureCard, {
        backgroundColor: "#ffffff",
        scale: CONFIG.CAPTURE_SCALE,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 20000,
        width: captureCard.clientWidth,
        height: captureCard.clientHeight
      });

      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("PNG画像を生成できませんでした"));
          }
        }, "image/png");
      });
    }

    function makeFileName() {
      const episodeId = currentEpisode
        ? getEpisodeId(currentEpisode.episodeId)
        : "";

      const safeId = episodeId || "episode";
      return "sakurameets-" + safeId + ".png";
    }

    // =========================================================
    // PNG保存
    // =========================================================

    saveButton.addEventListener("click", async () => {
      saveButton.disabled = true;
      setStatus("PNG画像を作成しています…");

      try {
        const blob = await createImageBlob();
        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");

        anchor.href = objectUrl;
        anchor.download = makeFileName();

        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();

        setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);

        setStatus("PNG画像を保存しました。");
      } catch (error) {
        console.error(error);
        setStatus(
          "画像の保存に失敗しました。\n" +
          error.message +
          "\n\n画像配信元のCORS設定が原因の可能性があります。"
        );
      } finally {
        saveButton.disabled = !imageReady;
      }
    });

    // =========================================================
    // Web Share APIで共有
    // =========================================================

    shareButton.addEventListener("click", async () => {
      shareButton.disabled = true;
      setStatus("共有用の画像を作成しています…");

      try {
        const blob = await createImageBlob();
        const file = new File(
          [blob],
          makeFileName(),
          { type: "image/png" }
        );

        const shareData = {
          files: [file],
          title: currentEpisode.title || "サクラミーツ",
          text: currentEpisode.title || "サクラミーツ"
        };

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          await navigator.share(shareData);
          setStatus(
            "共有画面を開きました。\n" +
            "共有先でXを選択してください。"
          );
        } else {
          // ファイル共有非対応環境ではPNGを保存する
          const objectUrl = URL.createObjectURL(blob);
          const anchor = document.createElement("a");

          anchor.href = objectUrl;
          anchor.download = makeFileName();

          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();

          setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);

          setStatus(
            "このブラウザでは画像のWeb Share APIに対応していません。\n" +
            "画像を保存しました。Xの投稿画面で添付してください。"
          );
        }
      } catch (error) {
        // ユーザーが共有シートを閉じた場合もここに入ることがある
        if (error.name === "AbortError") {
          setStatus("共有をキャンセルしました。");
        } else {
          console.error(error);
          setStatus(
            "共有に失敗しました。\n" +
            error.message +
            "\n\n画像配信元のCORS設定が原因の可能性があります。"
          );
        }
      } finally {
        shareButton.disabled = !imageReady;
      }
    });

    // =========================================================
    // 起動
    // =========================================================

    async function main() {
      try {
        const item = await fetchEpisodes();
        await renderEpisode(item);
      } catch (error) {
        console.error(error);
        placeholderElement.hidden = false;
        placeholderElement.textContent = "データを取得できませんでした";
        setStatus(
          "エラー：" + error.message +
          "\n公開CSVのURL、公開設定、通信状態を確認してください。"
        );
      }
    }

    main();
  </script>
</body>
</html>
