<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fde8ef">
  <meta name="description" content="サクラミーツとミーツメンバーの出演番組。TVerランキング通知">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="サクラミーツ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <title>サクラミーツ</title>
  <style>
    :root {
      --sakura: #e86a9a;
      --sakura-deep: #c94d7c;
      --sakura-soft: #f4a4c0;
      --sakura-pale: #fde8ef;
      --ink: #2a2430;
      --muted: #7d727a;
      --paper: rgba(255, 252, 250, .9);
      --line: rgba(201, 77, 124, .16);
      --shadow: 0 16px 40px rgba(90, 40, 70, .1);
      --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --sans: "Zen Maru Gothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 8% 0%, rgba(244, 164, 192, .38), transparent 34%),
        radial-gradient(circle at 100% 8%, rgba(232, 106, 154, .14), transparent 28%),
        linear-gradient(165deg, #fffafc 0%, #fdf3f7 48%, #f7eef3 100%);
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
    button, input { font-family: inherit; }
    a { color: inherit; }
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: max(14px, env(safe-area-inset-top)) 20px 14px;
      background: rgba(255, 250, 252, .78);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }
    .mark {
      margin: 0 0 4px;
      color: var(--sakura-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    .app-title {
      margin: 0;
      font-family: var(--sans);
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: .02em;
    }
    .app-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }
    .header-note {
      margin: 0;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 252, 250, .8);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .page {
      display: none;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 22px 16px 28px;
    }
    .page.active { display: block; }
    .section-label { margin: 0 0 14px; }
    .status { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .loading, .error {
      padding: 36px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .error {
      color: var(--sakura-deep);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .episode-list { display: grid; gap: 12px; }
    .episode {
      display: flex;
      align-items: center;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .episode:active { transform: scale(.985); }
    .thumb-wrap {
      flex: 0 0 168px;
      width: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6eef2;
    }
    .thumbnail {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: linear-gradient(160deg, #fde8ef, #f7d5e2);
    }
    .episode-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
    }
    .source {
      align-self: flex-start;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--sakura-pale);
      color: var(--sakura-deep);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
    }
    .episode-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .episode-link {
      color: var(--sakura-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .settings-header { margin-bottom: 16px; }
    .settings-title {
      margin: 0;
      font-family: var(--sans);
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 700;
      line-height: 1.15;
    }
    .settings-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .settings-card {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }
    .settings-section { padding: 20px 18px; }
    .settings-section-title {
      margin: 0 0 4px;
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 700;
    }
    .settings-section-description {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .notification-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .notification-title { margin: 0; font-size: 14px; font-weight: 700; }
    .notification-status { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .notification-actions { display: flex; flex-direction: column; gap: 8px; }
    .notification-button {
      min-width: 132px;
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #e86a9a, #d95b8c);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(217, 91, 140, .22);
    }
    .notification-button:disabled { opacity: .5; box-shadow: none; cursor: default; }
    .notification-button.allowed {
      background: rgba(232, 106, 154, .1);
      color: var(--muted);
      box-shadow: none;
    }
    .notification-result {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.6;
    }
    .notification-result.show { display: block; }
    .notification-result.success { background: rgba(100, 190, 130, .12); color: #3f8d58; }
    .notification-result.error { background: rgba(232, 106, 154, .1); color: var(--sakura-deep); }
    .settings-divider { height: 1px; background: var(--line); }
    .topic-group + .topic-group { margin-top: 18px; }
    .topic-group-label {
      margin: 0 0 8px;
      color: var(--sakura-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    .topic-list { display: flex; flex-direction: column; gap: 8px; }
    .topic-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 12px;
      border: 1px solid rgba(201, 77, 124, .1);
      border-radius: 16px;
      background: rgba(255, 255, 255, .62);
    }
    .topic-name { margin: 0; font-size: 14px; font-weight: 700; }
    .topic-note { margin: 3px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .switch { position: relative; flex: 0 0 auto; width: 48px; height: 28px; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch-ui {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(122, 111, 120, .25);
      cursor: pointer;
      transition: background .2s ease;
    }
    .switch-ui::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(80, 40, 60, .18);
      transition: transform .2s ease;
    }
    .switch input:checked + .switch-ui { background: linear-gradient(135deg, #e86a9a, #d95b8c); }
    .switch input:checked + .switch-ui::after { transform: translateX(20px); }
    .switch input:disabled + .switch-ui { opacity: .45; cursor: default; }
    .app-info { padding: 18px; text-align: center; }
    .app-info-name { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    .app-info-version { margin: 5px 0 0; color: #a898a2; font-size: 11px; line-height: 1.6; }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: #fffafc;
      border-top: 1px solid var(--line);
    }
    .bottom-nav-inner {
      max-width: 420px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
    }
    .bottom-nav-item.active { color: var(--sakura-deep); background: rgba(232, 106, 154, .12); }
    .bottom-nav-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Pull-to-refresh indicator */
    .pull-refresh-indicator {
      position: fixed;
      z-index: 300;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      display: flex;
      align-items: center;
      gap: 11px;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 10px 17px 10px 11px;
      border: 1px solid rgba(201, 77, 124, .2);
      border-radius: 999px;
      background: rgba(255, 252, 254, .97);
      box-shadow: 0 8px 28px rgba(130, 55, 88, .18);
      color: var(--ink);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -145%);
      transition: opacity .18s ease, transform .18s ease;
      will-change: transform, opacity;
    }
    .pull-refresh-indicator.visible {
      opacity: 1;
      transform: translate(-50%, var(--pull-offset, 0px));
    }
    .pull-refresh-icon {
      display: grid;
      place-items: center;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, var(--sakura-soft), var(--sakura-deep));
      box-shadow: 0 4px 12px rgba(201, 77, 124, .24);
    }
    .pull-refresh-icon svg {
      display: block;
      width: 27px;
      height: 27px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: .7;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform: rotate(var(--pull-rotation, 0deg)) scale(var(--pull-scale, 1));
      transition: transform .08s linear;
    }
    .pull-refresh-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .pull-refresh-copy strong { font-size: 12px; line-height: 1.4; font-weight: 700; }
    .pull-refresh-copy small { color: var(--muted); font-size: 10px; line-height: 1.4; }
    .pull-refresh-indicator.refreshing .pull-refresh-icon svg {
      animation: sakura-refresh-spin .85s linear infinite;
    }
    .pull-refresh-indicator.refreshing .pull-refresh-icon {
      animation: sakura-refresh-pulse 1.2s ease-in-out infinite;
    }
    .pull-refresh-indicator.complete .pull-refresh-icon {
      background: linear-gradient(135deg, #83cda0, #45a875);
    }
    .pull-refresh-indicator.complete .pull-refresh-icon svg {
      animation: sakura-refresh-pop .32s ease-out both;
    }
    @keyframes sakura-refresh-spin { to { transform: rotate(360deg); } }
    @keyframes sakura-refresh-pulse {
      0%, 100% { box-shadow: 0 4px 12px rgba(201, 77, 124, .2); }
      50% { box-shadow: 0 0 0 7px rgba(232, 106, 154, .12), 0 4px 16px rgba(201, 77, 124, .28); }
    }
    @keyframes sakura-refresh-pop {
      0% { transform: scale(.55) rotate(-25deg); }
      75% { transform: scale(1.16) rotate(8deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pull-refresh-indicator, .pull-refresh-icon svg { transition: none; }
      .pull-refresh-indicator.refreshing .pull-refresh-icon svg,
      .pull-refresh-indicator.refreshing .pull-refresh-icon { animation: none; }
    }
    @media (min-width: 860px) {
      .episode-list { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 390px) {
      .header-note { display: none; }
      .thumb-wrap { flex-basis: 128px; width: 128px; }
      .episode-title { font-size: 13px; }
      .notification-setting { align-items: stretch; flex-direction: column; }
      .notification-button { width: 100%; }
    }
    @media (max-width: 768px) {
      .header, .bottom-nav { backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    /* Ranking section */
    .ranking-section {
      margin-bottom: 28px;
    }
    .ranking-frame {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 16px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    #ranking-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ranking-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 540px;
      margin: 0 auto;
    }
    .ranking-button {
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sakura), var(--sakura-deep));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(217, 91, 140, .22);
    }
    .ranking-button:disabled {
      opacity: .5;
      box-shadow: none;
      cursor: default;
    }

  </style>
</head>
<body>
  <div id="pullRefreshIndicator" class="pull-refresh-indicator" aria-live="polite" aria-atomic="true">
    <span class="pull-refresh-icon" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <path d="M20 4.5c2.2 5.2 5.2 7.8 10.5 8.2-3.8 3.7-5 7.2-3.1 12.1-5.1-1.8-8.8-.8-12.4 3.1-.3-5.4-2.8-8.5-8-10.6 5.2-2.2 7.7-5.3 8-10.6 1.4 1.6 3.1 2.6 5 2.8"/>
        <circle cx="30.5" cy="29.5" r="2"/>
        <circle cx="9" cy="8" r="1.5"/>
      </svg>
    </span>
    <span class="pull-refresh-copy">
      <strong id="pullRefreshTitle">下に引っ張って更新</strong>
      <small id="pullRefreshMessage">最新情報をチェックします</small>
    </span>
  </div>
  <header class="header">
    <div class="header-inner">
      <div>
        <p class="mark">SAKURAZAKA46</p>
        <h1 class="app-title">サクラミーツ</h1>
        <p class="app-subtitle">サクラミーツとミーツメンバーの出演番組</p>
      </div>
      <p class="header-note">非公式</p>
    </div>
  </header>
  <main id="homePage" class="page active">
    <div class="ranking-section" id="rankingSection" style="display: none;">
      <div class="ranking-frame">
        <canvas id="ranking-canvas" width="1080" height="1080" aria-label="TVerランキング画像"></canvas>
      </div>
      <div class="ranking-actions">
        <button id="save-ranking" class="ranking-button" type="button" disabled>画像を保存</button>
        <button id="share-ranking" class="ranking-button" type="button" disabled>Xにシェア</button>
      </div>
    </div>

    <div class="section-label">
      <p class="mark">出演</p>
      <div id="status" class="status">最新エピソードを読み込んでいます…</div>
    </div>
    <div id="episodeList" class="episode-list">
      <div class="loading">読み込み中</div>
    </div>
  </main>
  <main id="settingsPage" class="page">
    <div class="settings-header">
      <p class="mark">設定</p>
      <h2 class="settings-title">通知</h2>
      <p class="settings-subtitle">受け取る種類だけオンにできます。</p>
    </div>
    <section class="settings-card">
      <div class="settings-section">
        <h3 class="settings-section-title">この端末</h3>
        <p class="settings-section-description">
          ブラウザの通知を許可したうえで、種類ごとにオンオフできます。
          iPhone はホーム画面に追加したあとだけ受け取れます。
        </p>
        <div class="notification-setting">
          <div>
            <p class="notification-title">通知の受け取り</p>
            <p id="notificationStatus" class="notification-status">通知の状態を確認しています…</p>
          </div>
          <div class="notification-actions">
            <button id="notificationButton" class="notification-button" type="button">通知を許可する</button>
            <button id="unsubscribeButton" class="notification-button allowed" type="button" hidden>通知を解除する</button>
          </div>
        </div>
        <div id="notificationResult" class="notification-result"></div>
      </div>
      <div class="settings-divider"></div>
      <div class="settings-section">
        <h3 class="settings-section-title">受け取る通知</h3>
        <p class="settings-section-description">オフにしたものは、この端末には届きません。</p>
        <div class="topic-group">
          <p class="topic-group-label">サクラミーツ</p>
          <div class="topic-list">
            <label class="topic-row">
              <span>
                <span class="topic-name">TVerランキング</span>
                <span class="topic-note">ランキングに動いたとき。</span>
              </span>
              <span class="switch">
                <input id="topicRanking" type="checkbox" data-topic="ranking">
                <span class="switch-ui"></span>
              </span>
            </label>
            <label class="topic-row">
              <span>
                <span class="topic-name">みんなで追いミーツ</span>
                <span class="topic-note">木曜の追いかけタイム。</span>
              </span>
              <span class="switch">
                <input id="topicOimeets" type="checkbox" data-topic="oimeets">
                <span class="switch-ui"></span>
              </span>
            </label>
          </div>
        </div>
        <div class="topic-group">
          <p class="topic-group-label">メンバー</p>
          <div class="topic-list">
            <label class="topic-row">
              <span>
                <span class="topic-name">大沼晶保ちゃん関連</span>
                <span class="topic-note">関連情報があったとき。</span>
              </span>
              <span class="switch">
                <input type="checkbox" data-topic="onuma">
                <span class="switch-ui"></span>
              </span>
            </label>
            <label class="topic-row">
              <span>
                <span class="topic-name">小島凪紗ちゃん関連</span>
                <span class="topic-note">関連情報があったとき。</span>
              </span>
              <span class="switch">
                <input type="checkbox" data-topic="kojima">
                <span class="switch-ui"></span>
              </span>
            </label>
            <label class="topic-row">
              <span>
                <span class="topic-name">谷口愛季ちゃん関連</span>
                <span class="topic-note">関連情報があったとき。</span>
              </span>
              <span class="switch">
                <input type="checkbox" data-topic="taniguchi">
                <span class="switch-ui"></span>
              </span>
            </label>
            <label class="topic-row">
              <span>
                <span class="topic-name">中嶋優月ちゃん関連</span>
                <span class="topic-note">関連情報があったとき。</span>
              </span>
              <span class="switch">
                <input type="checkbox" data-topic="nakashima">
                <span class="switch-ui"></span>
              </span>
            </label>
            <label class="topic-row">
              <span>
                <span class="topic-name">佐藤愛桜ちゃん関連</span>
                <span class="topic-note">関連情報があったとき。</span>
              </span>
              <span class="switch">
                <input type="checkbox" data-topic="sato">
                <span class="switch-ui"></span>
              </span>
            </label>
            <label class="topic-row">
              <span>

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;
      text = text.replace(/^\uFEFF/, "");
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(cell);
          if (row.some(v => v.trim() !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }
      if (cell !== "" || row.length > 0) {
        row.push(cell);
        if (row.some(v => v.trim() !== "")) rows.push(row);
      }
      return rows;
    }

    function parseTimestamp(value) {
      if (value == null || String(value).trim() === "") return null;
      const text = String(value).trim();
      const match = text.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
      if (match) {
        const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), Number(match[4] || 0), Number(match[5] || 0), Number(match[6] || 0));
        if (!Number.isNaN(date.getTime())) return date;
      }
      const parsed = new Date(text);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatDate(date) {
      if (!date) return "-";
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    async function loadLogo() {
      if (rankingLogoImg) return rankingLogoImg;
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => { rankingLogoImg = img; resolve(img); };
        img.onerror = () => resolve(null);
        img.src = RANKING_CONFIG.LOGO_URL;
      });
    }

    function drawRankingBackground() {
      const size = RANKING_CONFIG.IMAGE_SIZE;
      rankingCtx.clearRect(0, 0, size, size);
      const gradient = rankingCtx.createLinearGradient(0, 0, 0, size);
      gradient.addColorStop(0, "#fffafc");
      gradient.addColorStop(1, "#fde8ef");
      rankingCtx.fillStyle = gradient;
      rankingCtx.fillRect(0, 0, size, size);
    }

    function drawRankingHeader(programName, timestamp) {
      const size = RANKING_CONFIG.IMAGE_SIZE;
      const padding = 48;
      const fontSize = 28;
      rankingCtx.font = `700 ${fontSize}px "Zen Maru Gothic", sans-serif`;
      rankingCtx.fillStyle = "#2a2430";
      rankingCtx.textAlign = "left";
      rankingCtx.textBaseline = "middle";
      const maxProgramWidth = 500;
      const originalProgram = String(programName || "番組名なし");
      let program = originalProgram;
      while (rankingCtx.measureText(program).width > maxProgramWidth && program.length > 1) {
        program = program.slice(0, -1);
      }
      if (program !== originalProgram) program = program.slice(0, -1) + "…";
      rankingCtx.fillText(program, padding, 108);
      const dateText = formatDate(timestamp);
      rankingCtx.font = `500 18px "Zen Maru Gothic", sans-serif`;
      rankingCtx.fillStyle = "#7d727a";
      rankingCtx.textAlign = "right";
      rankingCtx.fillText(dateText, size - padding - 10, 118);
    }

    function wrapRankingText(text, maxWidth) {
      const lines = [];
      let line = "";
      for (const char of text) {
        const candidate = line + char;
        if (line && rankingCtx.measureText(candidate).width > maxWidth) {
          lines.push(line);
          line = char;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawRankingEpisodeTitle(title) {
      const size = RANKING_CONFIG.IMAGE_SIZE;
      const padding = 60;
      const maxWidth = size - padding * 2;
      const text = String(title || "エピソードタイトルなし");
      rankingCtx.fillStyle = "#2a2430";
      rankingCtx.textAlign = "center";
      rankingCtx.textBaseline = "middle";
      const maxFontSize = 36;
      const minFontSize = 24;
      let fontSize = maxFontSize;
      while (fontSize > minFontSize) {
        rankingCtx.font = `700 ${fontSize}px "Zen Maru Gothic", sans-serif`;
        const lines = wrapRankingText(text, maxWidth);
        if (lines.length <= 3) break;
        fontSize -= 2;
      }
      rankingCtx.font = `700 ${fontSize}px "Zen Maru Gothic", sans-serif`;
      const lines = wrapRankingText(text, maxWidth);
      const visibleLines = lines.slice(0, 3);
      if (lines.length > 3) {
        let last = visibleLines[2];
        while (rankingCtx.measureText(last + "…").width > maxWidth && last.length > 1) {
          last = last.slice(0, -1);
        }
        visibleLines[2] = last + "…";
      }
      const lineHeight = fontSize * 1.45;
      const startY = 920 - ((visibleLines.length - 1) * lineHeight) / 2;
      visibleLines.forEach((line, index) => {
        rankingCtx.fillText(line, size / 2, startY + index * lineHeight, maxWidth);
      });
    }

    function drawRankingBadge(rank, thumbX, thumbY, thumbHeight) {
      const rawRank = String(rank ?? "").trim();
      if (!rawRank) return;
      const label = `#${rawRank}`;
      rankingCtx.save();
      const fontSize = 62;
      const paddingX = 28;
      const badgeHeight = 96;
      rankingCtx.font = `900 ${fontSize}px "Zen Maru Gothic", sans-serif`;
      const badgeWidth = Math.max(150, rankingCtx.measureText(label).width + paddingX * 2);
      const badgeX = thumbX - 18;
      const badgeY = thumbY + thumbHeight - badgeHeight + 28;
      const radius = 20;
      rankingCtx.shadowColor = "rgba(90, 40, 70, 0.25)";
      rankingCtx.shadowBlur = 16;
      rankingCtx.shadowOffsetX = 0;
      rankingCtx.shadowOffsetY = 6;
      rankingCtx.beginPath();
      rankingCtx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, radius);
      rankingCtx.fillStyle = "#e86a9a";
      rankingCtx.fill();
      rankingCtx.shadowColor = "transparent";
      rankingCtx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      rankingCtx.lineWidth = 1.5;
      rankingCtx.stroke();
      rankingCtx.fillStyle = "#FFFFFF";
      rankingCtx.font = `900 ${fontSize}px "Zen Maru Gothic", sans-serif`;
      rankingCtx.textAlign = "center";
      rankingCtx.textBaseline = "middle";
      const textX = badgeX + badgeWidth / 2;
      const textY = badgeY + badgeHeight / 2 + 1;
      rankingCtx.fillText(label, textX, textY);
      rankingCtx.restore();
    }

    function drawRankingThumbnail(img, rank) {
      const size = RANKING_CONFIG.IMAGE_SIZE;
      const maxWidth = size * RANKING_CONFIG.THUMBNAIL_WIDTH_RATE;
      const maxHeight = RANKING_CONFIG.THUMBNAIL_MAX_HEIGHT;
      const scale = Math.min(maxWidth / img.naturalWidth, maxHeight / img.naturalHeight);
      const width = img.naturalWidth * scale;
      const height = img.naturalHeight * scale;
      const x = (size - width) / 2;
      const minY = 180;
      const maxY = 780;
      const availableHeight = maxY - minY;
      const y = minY + (availableHeight - height) / 2;
      rankingCtx.save();
      rankingCtx.shadowColor = "rgba(90, 40, 70, 0.18)";
      rankingCtx.shadowBlur = 24;
      rankingCtx.shadowOffsetX = 0;
      rankingCtx.shadowOffsetY = 8;
      const radius = 18;
      rankingCtx.beginPath();
      rankingCtx.roundRect(x, y, width, height, radius);
      rankingCtx.clip();
      rankingCtx.drawImage(img, x, y, width, height);
      rankingCtx.restore();
      drawRankingBadge(rank, x, y, height);
    }

    function drawRankingLogo(logoImg) {

    async function loadLatestRanking() {
      saveRankingButton.disabled = true;
      shareRankingButton.disabled = true;
      rankingSection.style.display = "none";
      try {
        const response = await fetch(RANKING_CONFIG.CSV_URL + "&_=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("CSV取得エラー: HTTP " + response.status);
        const csvText = await response.text();
        const trimmedCSV = csvText.trim();
        if (!trimmedCSV || /^<!DOCTYPE html/i.test(trimmedCSV) || /^<html/i.test(trimmedCSV)) {
          throw new Error("公開CSVを取得できません。");
        }
        const parsedRows = parseCSV(csvText);
        if (!parsedRows.length) throw new Error("CSVにデータがありません。");
        let dataRows = parsedRows;
        const firstRow = parsedRows[0].map(v => v.trim().replace(/\s+/g, "").toLowerCase());
        if (firstRow.some(v => ["取得日時", "取得時刻", "timestamp"].includes(v))) {
          dataRows = parsedRows.slice(1);
        }
        const validRows = dataRows.map(row => ({
          row,
          timestamp: parseTimestamp(row[RANKING_COLUMNS.timestamp])
        })).filter(item => item.timestamp !== null);
        if (!validRows.length) throw new Error("有効な取得日時が見つかりません。");
        const latestTime = Math.max(...validRows.map(item => item.timestamp.getTime()));
        rankingLatestTimestamp = new Date(latestTime);
        const now = Date.now();
        const fiveMin = 5 * 60 * 1000;
        if (now - rankingLatestTimestamp.getTime() > fiveMin) {
          rankingSection.style.display = "none";
          return;
        }
        rankingLatestRows = validRows.filter(item => item.timestamp.getTime() === latestTime).map(item => item.row);
        if (!rankingLatestRows.length) throw new Error("最新データがありません。");
        rankingLatestRows.sort((a, b) => {
          const ra = parseInt(a[RANKING_COLUMNS.rank], 10) || 999;
          const rb = parseInt(b[RANKING_COLUMNS.rank], 10) || 999;
          return ra - rb;
        });
        if (rankingLatestRows.length) await renderRankingImage(rankingLatestRows[0]);
      } catch (error) {
        rankingSection.style.display = "none";
        console.error(error);
        rankingLatestRows = [];
        rankingCurrentBlob = null;
      }
    }

    function defaultTopics() {

    function readTopics() {

    async function loadEpisodes() {

        });

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);
      const output = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) output[i] = raw.charCodeAt(i);
      return output;
    }
    async function updateNotificationStatus() {
      const savedTopics = readTopics();
      if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
        notificationStatus.textContent = "このブラウザは通知に対応していません。";
        notificationButton.disabled = true;
        syncTopicInputs(savedTopics, false);
        return;
      }
      const permission = Notification.permission;
      if (permission === "denied") {
        notificationStatus.textContent = "通知がブロックされています。ブラウザの設定から許可してください。";
        notificationButton.disabled = true;
        syncTopicInputs(savedTopics, false);
        return;
      }
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      const enabled = Boolean(subscription) && permission === "granted";
      notificationButton.hidden = enabled;
      unsubscribeButton.hidden = !enabled;
      notificationStatus.textContent = enabled
        ? "この端末で受け取れます。"
        : "まだこの端末では受け取れません。";
      syncTopicInputs(savedTopics, true);
    }
    async function ensureSubscription(topics) {
      if (!PUSH_API_URL || PUSH_API_URL.includes("YOUR_SUBDOMAIN")) {
        throw new Error("PUSH_API_URL が設定されていません。");
      }
      const permission = await Notification.requestPermission();
      if (permission !== "granted") throw new Error("通知が許可されませんでした。");
      const registration = await navigator.serviceWorker.ready;
      const keyResponse = await fetch(PUSH_API_URL + "/vapid-public-key", { cache: "no-store" });
      if (!keyResponse.ok) throw new Error("公開鍵を取得できませんでした。");
      const keyJson = await keyResponse.json();
      const vapidPublicKey = keyJson.publicKey;
      if (!vapidPublicKey) throw new Error("公開鍵が空です。");
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
        });
      }
      const saveResponse = await fetch(PUSH_API_URL + "/subscribe", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ subscription, topics })
      });
      if (!saveResponse.ok) throw new Error("購読を保存できませんでした。");
      const saved = await saveResponse.json();
      return saved.topics || topics;
    }
    async function saveTopicPreference(topics) {
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      if (!subscription) return ensureSubscription(topics);
      const response = await fetch(PUSH_API_URL + "/preferences", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ endpoint: subscription.endpoint, topics })
      });
      if (!response.ok) return ensureSubscription(topics);
      const saved = await response.json();
      return saved.topics || topics;
    }

    const pullIndicator = document.getElementById("pullRefreshIndicator");
    const pullTitle = document.getElementById("pullRefreshTitle");
    const pullMessage = document.getElementById("pullRefreshMessage");
    const pullIcon = pullIndicator.querySelector(".pull-refresh-icon svg");
    const PULL_THRESHOLD = 84;
    const PULL_MAX_DISTANCE = 138;
    let pullStartY = 0;
    let pullDistance = 0;
    let isPulling = false;
    let isRefreshing = false;
    let pullHideTimer = null;

    function setPullIndicatorState(state, distance = 0) {
      pullIndicator.classList.remove("refreshing", "complete");
      if (state === "pulling") {
        pullIndicator.classList.add("visible");
        pullTitle.textContent = distance >= PULL_THRESHOLD ? "離して更新" : "下に引っ張って更新";
        pullMessage.textContent = distance >= PULL_THRESHOLD
          ? "指を離すと最新情報を取得します"
          : "もう少し引っ張ってください";
        pullIndicator.style.setProperty("--pull-offset", Math.min(distance * 0.55, 66) + "px");
        pullIndicator.style.setProperty("--pull-rotation", Math.min(distance / PULL_THRESHOLD, 1) * 180 + "deg");
        pullIndicator.style.setProperty("--pull-scale", String(0.82 + Math.min(distance / PULL_THRESHOLD, 1) * 0.18));
      } else if (state === "refreshing") {
        pullIndicator.classList.add("visible", "refreshing");
        pullTitle.textContent = "更新中…";
        pullMessage.textContent = "ランキング・出演番組を確認しています";
        pullIndicator.style.setProperty("--pull-offset", "0px");
        pullIndicator.style.setProperty("--pull-rotation", "0deg");
        pullIndicator.style.setProperty("--pull-scale", "1");
      } else if (state === "complete") {
        pullIndicator.classList.add("visible", "complete");
        pullTitle.textContent = "更新しました";
        pullMessage.textContent = "最新情報を確認しました";
        pullIndicator.style.setProperty("--pull-offset", "0px");
        pullIndicator.style.setProperty("--pull-rotation", "0deg");
        pullIndicator.style.setProperty("--pull-scale", "1");
        pullIcon.innerHTML = '<path d="M8 20l8 8 16-17" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
      } else {
        pullIndicator.classList.remove("visible");
        pullIndicator.style.removeProperty("--pull-offset");
        pullIndicator.style.removeProperty("--pull-rotation");
        pullIndicator.style.removeProperty("--pull-scale");
        pullIcon.innerHTML = '<path d="M20 4.5c2.2 5.2 5.2 7.8 10.5 8.2-3.8 3.7-5 7.2-3.1 12.1-5.1-1.8-8.8-.8-12.4 3.1-.3-5.4-2.8-8.5-8-10.6 5.2-2.2 7.7-5.3 8-10.6 1.4 1.6 3.1 2.6 5 2.8"/><circle cx="30.5" cy="29.5" r="2"/><circle cx="9" cy="8" r="1.5"/>';
      }
    }

    async function refreshAllContent() {
      if (isRefreshing) return;
      isRefreshing = true;
      clearTimeout(pullHideTimer);
      setPullIndicatorState("refreshing");
      try {
        await Promise.allSettled([
          loadLatestRanking(),
          loadEpisodes()
        ]);
        setPullIndicatorState("complete");
      } finally {
        isRefreshing = false;
        pullHideTimer = setTimeout(() => setPullIndicatorState("hidden"), 1500);
      }
    }

    document.addEventListener("touchstart", (e) => {
      if (isRefreshing || e.touches.length !== 1 || window.scrollY > 0) return;
      pullStartY = e.touches[0].clientY;
      pullDistance = 0;
      isPulling = true;
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (!isPulling || isRefreshing || e.touches.length !== 1) return;
      if (window.scrollY > 0) {
        isPulling = false;
        setPullIndicatorState("hidden");
        return;
      }
      const delta = e.touches[0].clientY - pullStartY;
      if (delta <= 0) {
        pullDistance = 0;
        setPullIndicatorState("hidden");
        return;
      }
      pullDistance = Math.min(delta * 0.72, PULL_MAX_DISTANCE);
      setPullIndicatorState("pulling", pullDistance);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    document.addEventListener("touchend", () => {
      if (!isPulling) return;
      isPulling = false;
      const shouldRefresh = window.scrollY <= 0 && pullDistance >= PULL_THRESHOLD;
      pullStartY = 0;
      pullDistance = 0;
      if (shouldRefresh) {
        refreshAllContent();
      } else {
        setPullIndicatorState("hidden");
      }
    }, { passive: true });

    document.addEventListener("touchcancel", () => {
      isPulling = false;
      pullStartY = 0;
      pullDistance = 0;
      if (!isRefreshing) setPullIndicatorState("hidden");
    }, { passive: true });

    loadLatestRanking();
    updateNotificationStatus();
  </script>
</body>
</html>
