<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6b6cf">
  <title>TVer最新ランキング</title>

  <style>
    :root {
      --main: #e86a9a;
      --main-light: #fde8ef;
      --background: #fff8fb;
      --text: #333;
      --muted: #777;
      --border: #f0dce4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      color: var(--text);
      background: var(--background);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--main);
      font-size: clamp(22px, 4vw, 32px);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .summary-card {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    .summary-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary-value {
      overflow-wrap: anywhere;
      font-size: clamp(15px, 2.5vw, 21px);
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--main);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1000px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #f3e8ed;
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--main-light);
      color: #63364a;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: #fff9fc;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .thumbnail-cell {
      width: 170px;
      min-width: 170px;
    }

    .thumbnail {
      display: block;
      width: 145px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 7px;
      background: #f1f1f1;
    }

    .no-image {
      display: flex;
      width: 145px;
      aspect-ratio: 16 / 9;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: #f4f4f4;
      color: #888;
      font-size: 12px;
    }

    .rank {
      color: var(--main);
      font-size: 20px;
      font-weight: 800;
      text-align: center;
    }

    .episode-title {
      min-width: 220px;
      max-width: 360px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .program-title {
      min-width: 150px;
      overflow-wrap: anywhere;
    }

    .episode-id {
      color: var(--muted);
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 12px;
    }

    .empty {
      padding: 32px;
      color: var(--muted);
      text-align: center;
    }

    .error {
      padding: 16px;
      border: 1px solid #f1b7b7;
      border-radius: 10px;
      background: #fff0f0;
      color: #a40000;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .summary {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .summary-card {
        padding: 12px;
      }

      .toolbar {
        align-items: flex-start;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>📺 TVer最新ランキング</h1>

    <section class="summary">
      <div class="summary-card">
        <div class="summary-label">最新取得日時</div>
        <div class="summary-value" id="latest-date">読み込み中…</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">表示件数</div>
        <div class="summary-value" id="result-count">-</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">ランキング種別</div>
        <div class="summary-value" id="ranking-types">-</div>
      </div>
    </section>

    <div class="toolbar">
      <div class="status" id="status" role="status">
        スプレッドシートを読み込んでいます…
      </div>

      <button id="reload-button" type="button">
        🔄 最新データを再取得
      </button>
    </div>

    <div id="error-area"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>サムネイル</th>
            <th>順位</th>
            <th>ランキング種別</th>
            <th>ランキングID</th>
            <th>番組名</th>
            <th>エピソードタイトル</th>
            <th>放送局</th>
            <th>放送日</th>
            <th>エピソードID</th>
          </tr>
        </thead>
        <tbody id="ranking-body">
          <tr>
            <td class="empty" colspan="9">データを読み込んでいます…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="note">
      ※ 公開されているスプレッドシートの最新取得日時を判定し、
      その日時に取得されたランキングのみを表示します。<br>
      ※ サムネイルはTVerの画像URLから取得します。
      画像が存在しない場合は「画像なし」と表示します。
    </p>
  </main>

  <script>
    // =========================================================
    // 設定
    // =========================================================

    const CONFIG = {
      PUBLISHED_ID:
        "2PACX-1vTJofs8FiOCnnavLtBInpn1d6u9YiJ6kZLFDBNI8iRTL4RBJBz3PSQtMSiSKt35B0xgtv6p9zKTy-75",

      GID: "91701956",

      get CSV_URL() {
        return (
          "https://docs.google.com/spreadsheets/d/e/" +
          this.PUBLISHED_ID +
          "/pub?gid=" +
          this.GID +
          "&single=true&output=csv"
        );
      },

      THUMBNAIL_BASE:
        "https://image-cdn.tver.jp/w=800,dpr=2/images/content/thumbnail/episode/xlarge/"
    };

    // =========================================================
    // 列設定
    //
    // A: 取得日時
    // B: ランキング種別
    // C: ランキングID
    // D: 順位
    // E: エピソードID
    // F: シリーズID
    // G: 番組名
    // H: エピソードタイトル
    // I: 放送局
    // J: 放送日
    // =========================================================

    const DEFAULT_COLUMNS = {
      timestamp: 0,
      rankingType: 1,
      rankingId: 2,
      rank: 3,
      episodeId: 4,
      seriesId: 5,
      programName: 6,
      episodeTitle: 7,
      station: 8,
      broadcastDate: 9
    };

    const COLUMN_ALIASES = {
      timestamp: [
        "取得日時", "取得時刻", "取得日", "取得時間", "timestamp"
      ],
      rankingType: [
        "ランキング種別", "ランキング種類", "種別", "カテゴリ", "ランキング名"
      ],
      rankingId: [
        "ランキングid", "ランキングＩＤ", "ランキングID", "カテゴリid", "id"
      ],
      rank: [
        "順位", "ランキング順位", "rank"
      ],
      episodeId: [
        "エピソードid", "エピソードＩＤ", "episodeid", "episode_id"
      ],
      seriesId: [
        "シリーズid", "シリーズＩＤ", "seriesid", "series_id"
      ],
      programName: [
        "番組名", "番組タイトル", "番組"
      ],
      episodeTitle: [
        "エピソードタイトル", "エピソード名", "タイトル", "episode_title"
      ],
      station: [
        "放送局", "放送局名", "配信元"
      ],
      broadcastDate: [
        "放送日", "放送日時", "配信日"
      ]
    };

    // =========================================================
    // CSVパーサー
    // ダブルクォート内のカンマ・改行に対応
    // =========================================================

    function parseCSV(csvText) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      const text = csvText.replace(/^\uFEFF/, "");

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if (
          (char === "\n" || char === "\r") &&
          !inQuotes
        ) {
          if (char === "\r" && next === "\n") {
            i++;
          }

          row.push(cell);

          if (row.some(value => value.trim() !== "")) {
            rows.push(row);
          }

          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      if (cell !== "" || row.length > 0) {
        row.push(cell);

        if (row.some(value => value.trim() !== "")) {
          rows.push(row);
        }
      }

      return rows;
    }

    // =========================================================
    // ヘッダーの自動判定
    // =========================================================

    function normalizeHeader(value) {
      return String(value ?? "")
        .trim()
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function detectColumns(rows) {
      const columns = { ...DEFAULT_COLUMNS };

      if (!rows.length) {
        return { columns, headerRowIndex: -1 };
      }

      // 最初の数行からヘッダー行を探す
      const searchLimit = Math.min(rows.length, 10);

      for (let rowIndex = 0; rowIndex < searchLimit; rowIndex++) {
        const normalized = rows[rowIndex].map(normalizeHeader);

        const timestampIndex = normalized.findIndex(header =>
          COLUMN_ALIASES.timestamp.some(alias =>
            header === normalizeHeader(alias)
          )
        );

        const rankIndex = normalized.findIndex(header =>
          COLUMN_ALIASES.rank.some(alias =>
            header === normalizeHeader(alias)
          )
        );

        const episodeIdIndex = normalized.findIndex(header =>
          COLUMN_ALIASES.episodeId.some(alias =>
            header === normalizeHeader(alias)
          )
        );

        // 取得日時と順位、またはエピソードIDがあればヘッダー候補
        if (
          timestampIndex !== -1 &&
          (rankIndex !== -1 || episodeIdIndex !== -1)
        ) {
          for (const [key, aliases] of Object.entries(COLUMN_ALIASES)) {
            const index = normalized.findIndex(header =>
              aliases.some(alias =>
                header === normalizeHeader(alias)
              )
            );

            if (index !== -1) {
              columns[key] = index;
            }
          }

          return {
            columns,
            headerRowIndex: rowIndex
          };
        }
      }

      // ヘッダーがない場合はA:Jの既定列を使う
      return {
        columns,
        headerRowIndex: -1
      };
    }

    // =========================================================
    // 取得日時の解析
    // =========================================================

    function parseTimestamp(value) {
      if (value == null || String(value).trim() === "") {
        return null;
      }

      const text = String(value).trim();

      // 2026-10-10 00:17:15
      // 2026/10/10 00:17:15
      // 2026.10.10 00:17:15
      const match = text.match(
        /^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
      );

      if (match) {
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const hour = Number(match[4] || 0);
        const minute = Number(match[5] || 0);
        const second = Number(match[6] || 0);

        // 日本時間の表示をローカル時刻として解釈
        const date = new Date(
          year, month - 1, day, hour, minute, second
        );

        if (!Number.isNaN(date.getTime())) {
          return date;
        }
      }

      // ISO形式や Date.toString() 形式にも対応
      const parsed = new Date(text);

      if (!Number.isNaN(parsed.getTime())) {
        return parsed;
      }

      return null;
    }

    function formatDate(date) {
      if (!date || Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    // =========================================================
    // HTMLへの安全なテキスト設定
    // =========================================================

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function createCell(text, className = "") {
      const td = document.createElement("td");

      if (className) {
        td.className = className;
      }

      td.textContent =
        text == null || String(text).trim() === ""
          ? "-"
          : String(text).trim();

      return td;
    }

    // =========================================================
    // サムネイル作成
    // =========================================================

    function createThumbnailCell(episodeId, episodeTitle) {
      const td = document.createElement("td");
      td.className = "thumbnail-cell";

      const id = String(episodeId ?? "").trim();

      if (!id) {
        const placeholder = document.createElement("div");
        placeholder.className = "no-image";
        placeholder.textContent = "画像なし";
        td.appendChild(placeholder);
        return td;
      }

      const img = document.createElement("img");
      img.className = "thumbnail";
      img.loading = "lazy";
      img.alt = String(episodeTitle || "TVerサムネイル");
      img.referrerPolicy = "no-referrer";
      img.src =
        CONFIG.THUMBNAIL_BASE +
        encodeURIComponent(id) +
        ".jpg";

      img.addEventListener("error", function () {
        const placeholder = document.createElement("div");
        placeholder.className = "no-image";
        placeholder.textContent = "画像なし";
        img.replaceWith(placeholder);
      }, { once: true });

      td.appendChild(img);
      return td;
    }

    // =========================================================
    // ランキング表示
    // =========================================================

    function renderRanking(rows, columns, latestTimestamp) {
      const tbody = document.getElementById("ranking-body");
      tbody.replaceChildren();

      if (!rows.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");

        td.colSpan = 9;
        td.className = "empty";
        td.textContent = "最新取得日時のランキングデータがありません。";

        tr.appendChild(td);
        tbody.appendChild(tr);

        setText("latest-date", formatDate(latestTimestamp));
        setText("result-count", "0件");
        setText("ranking-types", "-");
        return;
      }

      // 順位の昇順。順位が同じ場合は元の順序を維持
      rows.sort((a, b) => {
        const rankA = Number(a[columns.rank]);
        const rankB = Number(b[columns.rank]);

        const validA = Number.isFinite(rankA) && String(a[columns.rank]).trim() !== "";
        const validB = Number.isFinite(rankB) && String(b[columns.rank]).trim() !== "";

        if (validA && validB) {
          return rankA - rankB;
        }

        if (validA) return -1;
        if (validB) return 1;
        return 0;
      });

      const rankingTypes = new Set();

      rows.forEach(row => {
        const rankingType = row[columns.rankingType];

        if (rankingType && String(rankingType).trim()) {
          rankingTypes.add(String(rankingType).trim());
        }

        const episodeId = row[columns.episodeId];
        const episodeTitle = row[columns.episodeTitle];

        const tr = document.createElement("tr");

        tr.appendChild(
          createThumbnailCell(episodeId, episodeTitle)
        );

        const rankCell = createCell(row[columns.rank], "rank");
        tr.appendChild(rankCell);

        tr.appendChild(createCell(row[columns.rankingType]));
        tr.appendChild(createCell(row[columns.rankingId]));
        tr.appendChild(
          createCell(row[columns.programName], "program-title")
        );
        tr.appendChild(
          createCell(episodeTitle, "episode-title")
        );
        tr.appendChild(createCell(row[columns.station]));
        tr.appendChild(createCell(row[columns.broadcastDate]));
        tr.appendChild(createCell(episodeId, "episode-id"));

        tbody.appendChild(tr);
      });

      setText("latest-date", formatDate(latestTimestamp));
      setText("result-count", rows.length + "件");
      setText(
        "ranking-types",
        rankingTypes.size
          ? Array.from(rankingTypes).join("、")
          : "-"
      );
    }

    // =========================================================
    // CSV取得・最新日時抽出
    // =========================================================

    async function outputLatestTverRanking() {
      const button = document.getElementById("reload-button");
      const tbody = document.getElementById("ranking-body");
      const errorArea = document.getElementById("error-area");

      button.disabled = true;
      button.textContent = "読み込み中…";
      errorArea.replaceChildren();

      setText("status", "公開CSVを取得しています…");

      const loadingRow = document.createElement("tr");
      const loadingCell = document.createElement("td");
      loadingCell.colSpan = 9;
      loadingCell.className = "empty";
      loadingCell.textContent = "データを読み込んでいます…";
      loadingRow.appendChild(loadingCell);
      tbody.replaceChildren(loadingRow);

      try {
        const response = await fetch(
          CONFIG.CSV_URL + "&_=" + Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "CSVの取得に失敗しました。HTTPステータス: " +
            response.status
          );
        }

        const csvText = await response.text();

        if (
          !csvText.trim() ||
          csvText.trim().startsWith("<!DOCTYPE html") ||
          csvText.trim().startsWith("<html")
        ) {
          throw new Error(
            "CSVデータを取得できませんでした。スプレッドシートがウェブ公開されているか確認してください。"
          );
        }

        const parsedRows = parseCSV(csvText);

        if (!parsedRows.length) {
          throw new Error("CSVにデータがありません。");
        }

        const detected = detectColumns(parsedRows);
        const columns = detected.columns;

        const dataRows = parsedRows.filter((row, index) => {
          return index !== detected.headerRowIndex;
        });

        // 取得日時を解析し、有効な行だけを抽出
        const validRows = dataRows
          .map(row => ({
            row,
            timestamp: parseTimestamp(row[columns.timestamp])
          }))
          .filter(item => item.timestamp !== null);

        if (!validRows.length) {
          throw new Error(
            "有効な取得日時が見つかりません。CSVの列構成と取得日時の形式を確認してください。"
          );
        }

        // 最新取得日時を求める
        const latestTime = Math.max(
          ...validRows.map(item => item.timestamp.getTime())
        );

        const latestTimestamp = new Date(latestTime);

        // 最新取得日時と一致する行のみ表示
        const latestRows = validRows
          .filter(item => item.timestamp.getTime() === latestTime)
          .map(item => item.row);

        renderRanking(latestRows, columns, latestTimestamp);

        setText(
          "status",
          "取得成功：" + formatDate(new Date()) +
          " にデータを更新しました。"
        );

      } catch (error) {
        tbody.replaceChildren();

        const tr = document.createElement("tr");
        const td = document.createElement("td");

        td.colSpan = 9;
        td.className = "empty";
        td.textContent = "ランキングを表示できませんでした。";

        tr.appendChild(td);
        tbody.appendChild(tr);

        errorArea.replaceChildren();

        const errorBox = document.createElement("div");
        errorBox.className = "error";

        const title = document.createElement("strong");
        title.textContent = "データ取得エラー";

        const message = document.createElement("p");
        message.textContent = error.message || String(error);

        const help = document.createElement("p");
        help.textContent =
          "スプレッドシートのウェブ公開設定と、ブラウザから公開CSVへアクセスできるかを確認してください。";

        errorBox.append(title, message, help);
        errorArea.appendChild(errorBox);

        setText("status", "データを取得できませんでした。");
        setText("latest-date", "-");
        setText("result-count", "-");
        setText("ranking-types", "-");

        console.error("TVerランキング取得エラー:", error);

      } finally {
        button.disabled = false;
        button.textContent = "🔄 最新データを再取得";
      }
    }

    // =========================================================
    // イベント登録・初回読み込み
    // =========================================================

    document
      .getElementById("reload-button")
      .addEventListener("click", outputLatestTverRanking);

    outputLatestTverRanking();
  </script>
</body>
</html>
