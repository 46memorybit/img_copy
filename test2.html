
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6b6cf">
  <title>TVer最新ランキング</title>

  <style>
    :root {
      --main: #e86a9a;
      --main-light: #fde8ef;
      --background: #fff8fb;
      --text: #333;
      --muted: #777;
      --border: #f0dce4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      color: var(--text);
      background: var(--background);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--main);
      font-size: clamp(22px, 4vw, 32px);
    }

    /* 集計情報 */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .summary-card {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    .summary-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary-value {
      overflow-wrap: anywhere;
      font-size: clamp(15px, 2.5vw, 21px);
      font-weight: 700;
    }

    /* 操作エリア */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--main);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* =========================================
       ランキングカード一覧
       ========================================= */

    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(min(100%, 260px), 1fr)
      );
      gap: 20px;
      align-items: start;
    }

    .ranking-card {
      min-width: 0;
      overflow: hidden;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 12px rgb(100 50 70 / 6%);
    }

    /* 左上：番組名
       右上：取得日時 */
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .program-name {
      flex: 1;
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .取得日時 {
      flex-shrink: 0;
      max-width: 48%;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
      text-align: right;
      overflow-wrap: anywhere;
    }

    /* サムネイルの左右上下中央配置 */
    .thumbnail-area {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
    }

    /* 正方形・横幅90% */
    .thumbnail,
    .no-image {
      display: flex;
      width: 90%;
      aspect-ratio: 1 / 1;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border-radius: 8px;
      background: #f4f4f4;
    }

    .thumbnail {
      object-fit: cover;
    }

    .no-image {
      color: #888;
      font-size: 13px;
    }

    /* サムネイルの下：エピソードタイトル */
    .episode-title {
      margin-top: 12px;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    /* 順位 */
    .rank-label {
      margin-top: 8px;
      color: var(--main);
      font-size: 13px;
      font-weight: 700;
    }

    /* 読み込み中・データなし */
    .empty {
      grid-column: 1 / -1;
      padding: 32px;
      color: var(--muted);
      text-align: center;
    }

    /* エラー表示 */
    .error {
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid #f1b7b7;
      border-radius: 10px;
      background: #fff0f0;
      color: #a40000;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    /* スマートフォン */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .summary {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .summary-card {
        padding: 12px;
      }

      .toolbar {
        align-items: flex-start;
      }

      button {
        width: 100%;
      }

      /* スマホでは2列 */
      .ranking-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .ranking-card {
        padding: 8px;
        border-radius: 10px;
      }

      .card-header {
        gap: 5px;
        margin-bottom: 8px;
      }

      .program-name {
        font-size: 11px;
      }

      .取得日時 {
        font-size: 9px;
      }

      .episode-title {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.5;
      }

      .rank-label {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>📺 TVer最新ランキング</h1>

    <!-- 集計情報 -->
    <section class="summary">
      <div class="summary-card">
        <div class="summary-label">最新取得日時</div>
        <div class="summary-value" id="latest-date">
          読み込み中…
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-label">表示件数</div>
        <div class="summary-value" id="result-count">-</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">ランキング種別</div>
        <div class="summary-value" id="ranking-types">-</div>
      </div>
    </section>

    <!-- 更新操作 -->
    <div class="toolbar">
      <div class="status" id="status" role="status">
        公開スプレッドシートを読み込んでいます…
      </div>

      <button id="reload-button" type="button">
        🔄 最新データを再取得
      </button>
    </div>

    <div id="error-area"></div>

    <!-- カード一覧 -->
    <div id="ranking-grid" class="ranking-grid">
      <div class="empty">データを読み込んでいます…</div>
    </div>

    <p class="note">
      ※ 公開されているスプレッドシートの最新取得日時を判定し、
      その日時に取得されたランキングのみを表示します。
      <br>
      ※ サムネイルはTVerの画像URLから取得します。
      画像が存在しない場合は「画像なし」と表示します。
    </p>
  </main>

  <script>
    // =========================================================
    // 設定
    // =========================================================

    const CONFIG = {
      // 公開スプレッドシートID
      PUBLISHED_ID:
        "2PACX-1vTJofs8FiOCnnavLtBInpn1d6u9YiJ6kZLFDBNI8iRTL4RBJBz3PSQtMSiSKt35B0xgtv6p9zKTy-75",

      // 対象シートのGID
      GID: "91701956",

      // 公開CSVのURL
      get CSV_URL() {
        return (
          "https://docs.google.com/spreadsheets/d/e/" +
          this.PUBLISHED_ID +
          "/pub?gid=" +
          this.GID +
          "&single=true&output=csv"
        );
      },

      // TVerサムネイルのベースURL
      THUMBNAIL_BASE:
        "https://image-cdn.tver.jp/w=800,dpr=2/images/content/thumbnail/episode/xlarge/"
    };

    // =========================================================
    // 列設定
    //
    // A: 取得日時
    // B: ランキング種別
    // C: ランキングID
    // D: 順位
    // E: エピソードID
    // F: シリーズID
    // G: 番組名
    // H: エピソードタイトル
    // I: 放送局
    // J: 放送日
    // =========================================================

    const DEFAULT_COLUMNS = {
      timestamp: 0,
      rankingType: 1,
      rankingId: 2,
      rank: 3,
      episodeId: 4,
      seriesId: 5,
      programName: 6,
      episodeTitle: 7,
      station: 8,
      broadcastDate: 9
    };

    const COLUMN_ALIASES = {
      timestamp: [
        "取得日時",
        "取得時刻",
        "取得日",
        "取得時間",
        "timestamp"
      ],

      rankingType: [
        "ランキング種別",
        "ランキング種類",
        "種別",
        "カテゴリ",
        "ランキング名"
      ],

      rankingId: [
        "ランキングid",
        "ランキングＩＤ",
        "ランキングID",
        "カテゴリid",
        "id"
      ],

      rank: [
        "順位",
        "ランキング順位",
        "rank"
      ],

      episodeId: [
        "エピソードid",
        "エピソードＩＤ",
        "episodeid",
        "episode_id"
      ],

      seriesId: [
        "シリーズid",
        "シリーズＩＤ",
        "seriesid",
        "series_id"
      ],

      programName: [
        "番組名",
        "番組タイトル",
        "番組"
      ],

      episodeTitle: [
        "エピソードタイトル",
        "エピソード名",
        "タイトル",
        "episode_title"
      ],

      station: [
        "放送局",
        "放送局名",
        "配信元"
      ],

      broadcastDate: [
        "放送日",
        "放送日時",
        "配信日"
      ]
    };

    // =========================================================
    // CSVパーサー
    // ダブルクォート内のカンマ・改行に対応
    // =========================================================

    function parseCSV(csvText) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      const text = csvText.replace(/^\uFEFF/, "");

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if (
          (char === "\n" || char === "\r") &&
          !inQuotes
        ) {
          if (char === "\r" && next === "\n") {
            i++;
          }

          row.push(cell);

          if (row.some(value => value.trim() !== "")) {
            rows.push(row);
          }

          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      if (cell !== "" || row.length > 0) {
        row.push(cell);

        if (row.some(value => value.trim() !== "")) {
          rows.push(row);
        }
      }

      return rows;
    }

    // =========================================================
    // ヘッダーの自動判定
    // =========================================================

    function normalizeHeader(value) {
      return String(value ?? "")
        .trim()
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function detectColumns(rows) {
      const columns = { ...DEFAULT_COLUMNS };

      if (!rows.length) {
        return {
          columns,
          headerRowIndex: -1
        };
      }

      // 最初の10行からヘッダー行を探す
      const searchLimit = Math.min(rows.length, 10);

      for (let rowIndex = 0; rowIndex < searchLimit; rowIndex++) {
        const normalized = rows[rowIndex].map(normalizeHeader);

        const timestampIndex = normalized.findIndex(header =>
          COLUMN_ALIASES.timestamp.some(alias =>
            header === normalizeHeader(alias)
          )
        );

        const rankIndex = normalized.findIndex(header =>
          COLUMN_ALIASES.rank.some(alias =>
            header === normalizeHeader(alias)
          )
        );

        const episodeIdIndex = normalized.findIndex(header =>
          COLUMN_ALIASES.episodeId.some(alias =>
            header === normalizeHeader(alias)
          )
        );

        // 取得日時と順位、またはエピソードIDがあれば候補
        if (
          timestampIndex !== -1 &&
          (rankIndex !== -1 || episodeIdIndex !== -1)
        ) {
          for (const [key, aliases] of Object.entries(COLUMN_ALIASES)) {
            const index = normalized.findIndex(header =>
              aliases.some(alias =>
                header === normalizeHeader(alias)
              )
            );

            if (index !== -1) {
              columns[key] = index;
            }
          }

          return {
            columns,
            headerRowIndex: rowIndex
          };
        }
      }

      // ヘッダーがない場合はA:Jの既定列を使用
      return {
        columns,
        headerRowIndex: -1
      };
    }

    // =========================================================
    // 取得日時の解析
    // =========================================================

    function parseTimestamp(value) {
      if (value == null || String(value).trim() === "") {
        return null;
      }

      const text = String(value).trim();

      // 2026-10-10 00:17:15
      // 2026/10/10 00:17:15
      // 2026.10.10 00:17:15
      const match = text.match(
        /^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
      );

      if (match) {
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const hour = Number(match[4] || 0);
        const minute = Number(match[5] || 0);
        const second = Number(match[6] || 0);

        // 日本時間をローカル時刻として解釈
        const date = new Date(
          year,
          month - 1,
          day,
          hour,
          minute,
          second
        );

        if (!Number.isNaN(date.getTime())) {
          return date;
        }
      }

      // ISO形式やDate.toString()形式にも対応
      const parsed = new Date(text);

      if (!Number.isNaN(parsed.getTime())) {
        return parsed;
      }

      return null;
    }

    // =========================================================
    // 日時の表示
    // =========================================================

    function formatDate(date) {
      if (!date || Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    // =========================================================
    // テキスト設定
    // =========================================================

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    // =========================================================
    // サムネイル作成
    // =========================================================

    function createThumbnail(episodeId, episodeTitle) {
      const area = document.createElement("div");
      area.className = "thumbnail-area";

      const id = String(episodeId ?? "").trim();

      if (!id) {
        const placeholder = document.createElement("div");
        placeholder.className = "no-image";
        placeholder.textContent = "画像なし";

        area.appendChild(placeholder);
        return area;
      }

      const img = document.createElement("img");

      img.className = "thumbnail";
      img.loading = "lazy";
      img.alt = String(episodeTitle || "TVerサムネイル");
      img.referrerPolicy = "no-referrer";

      img.src =
        CONFIG.THUMBNAIL_BASE +
        encodeURIComponent(id) +
        ".jpg";

      img.addEventListener("error", function () {
        const placeholder = document.createElement("div");

        placeholder.className = "no-image";
        placeholder.textContent = "画像なし";

        img.replaceWith(placeholder);
      }, { once: true });

      area.appendChild(img);

      return area;
    }

    // =========================================================
    // ランキング表示
    // =========================================================

    function renderRanking(rows, columns, latestTimestamp) {
      const grid = document.getElementById("ranking-grid");

      grid.replaceChildren();

      // データなし
      if (!rows.length) {
        const empty = document.createElement("div");

        empty.className = "empty";
        empty.textContent =
          "最新取得日時のランキングデータがありません。";

        grid.appendChild(empty);

        setText("latest-date", formatDate(latestTimestamp));
        setText("result-count", "0件");
        setText("ranking-types", "-");

        return;
      }

      // 順位の昇順。同順位は元の順序を維持
      rows.sort((a, b) => {
        const rankA = Number(a[columns.rank]);
        const rankB = Number(b[columns.rank]);

        const validA =
          Number.isFinite(rankA) &&
          String(a[columns.rank]).trim() !== "";

        const validB =
          Number.isFinite(rankB) &&
          String(b[columns.rank]).trim() !== "";

        if (validA && validB) {
          return rankA - rankB;
        }

        if (validA) return -1;
        if (validB) return 1;

        return 0;
      });

      const rankingTypes = new Set();
      const timestampText = formatDate(latestTimestamp);

      rows.forEach(row => {
        const programName =
          String(row[columns.programName] ?? "").trim() ||
          "番組名なし";

        const episodeTitle =
          String(row[columns.episodeTitle] ?? "").trim() ||
          "タイトルなし";

        const rankingType =
          String(row[columns.rankingType] ?? "").trim();

        if (rankingType) {
          rankingTypes.add(rankingType);
        }

        // カード
        const card = document.createElement("article");
        card.className = "ranking-card";

        // -----------------------------------------
        // 上部：左に番組名、右に取得日時
        // -----------------------------------------

        const header = document.createElement("div");
        header.className = "card-header";

        const program = document.createElement("div");
        program.className = "program-name";
        program.textContent = programName;
        program.title = programName;

        const timestamp = document.createElement("div");
        timestamp.className = "取得日時";
        timestamp.textContent = timestampText;
        timestamp.title = "最新取得日時：" + timestampText;

        header.append(program, timestamp);
        card.appendChild(header);

        // -----------------------------------------
        // 正方形のサムネイル
        // -----------------------------------------

        card.appendChild(
          createThumbnail(
            row[columns.episodeId],
            episodeTitle
          )
        );

        // -----------------------------------------
        // サムネイルの下：エピソードタイトル
        // -----------------------------------------

        const title = document.createElement("div");

        title.className = "episode-title";
        title.textContent = episodeTitle;

        card.appendChild(title);

        // -----------------------------------------
        // 順位
        // -----------------------------------------

        const rank = document.createElement("div");
        rank.className = "rank-label";

        const rankValue =
          String(row[columns.rank] ?? "").trim();

        rank.textContent = rankValue
          ? rankValue + "位"
          : "順位不明";

        card.appendChild(rank);

        // カード一覧に追加
        grid.appendChild(card);
      });

      // 集計情報
      setText("latest-date", timestampText);
      setText("result-count", rows.length + "件");

      setText(
        "ranking-types",
        rankingTypes.size
          ? Array.from(rankingTypes).join("、")
          : "-"
      );
    }

    // =========================================================
    // CSV取得・最新日時抽出
    // =========================================================

    async function outputLatestTverRanking() {
      const button = document.getElementById("reload-button");
      const grid = document.getElementById("ranking-grid");
      const errorArea = document.getElementById("error-area");

      button.disabled = true;
      button.textContent = "読み込み中…";

      errorArea.replaceChildren();

      setText("status", "公開CSVを取得しています…");

      // 読み込み中表示
      grid.replaceChildren();

      const loading = document.createElement("div");

      loading.className = "empty";
      loading.textContent = "データを読み込んでいます…";

      grid.appendChild(loading);

      try {
        const response = await fetch(
          CONFIG.CSV_URL + "&_=" + Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "CSVの取得に失敗しました。HTTPステータス: " +
            response.status
          );
        }

        const csvText = await response.text();

        if (
          !csvText.trim() ||
          csvText.trim().startsWith("<!DOCTYPE html") ||
          csvText.trim().startsWith("<html")
        ) {
          throw new Error(
            "CSVデータを取得できませんでした。" +
            "スプレッドシートがウェブ公開されているか確認してください。"
          );
        }

        const parsedRows = parseCSV(csvText);

        if (!parsedRows.length) {
          throw new Error("CSVにデータがありません。");
        }

        const detected = detectColumns(parsedRows);
        const columns = detected.columns;

        // ヘッダー行を除外
        const dataRows = parsedRows.filter((row, index) => {
          return index !== detected.headerRowIndex;
        });

        // 取得日時が有効な行だけを抽出
        const validRows = dataRows
          .map(row => ({
            row,
            timestamp: parseTimestamp(row[columns.timestamp])
          }))
          .filter(item => item.timestamp !== null);

        if (!validRows.length) {
          throw new Error(
            "有効な取得日時が見つかりません。" +
            "CSVの列構成と取得日時の形式を確認してください。"
          );
        }

        // 最新取得日時を求める
        const latestTime = Math.max(
          ...validRows.map(item => item.timestamp.getTime())
        );

        const latestTimestamp = new Date(latestTime);

        // 最新取得日時と完全一致する行だけを表示
        const latestRows = validRows
          .filter(item => item.timestamp.getTime() === latestTime)
          .map(item => item.row);

        // カード型レイアウトで表示
        renderRanking(
          latestRows,
          columns,
          latestTimestamp
        );

        setText(
          "status",
          "取得成功：" +
          formatDate(new Date()) +
          " にデータを更新しました。"
        );

      } catch (error) {
        grid.replaceChildren();

        const empty = document.createElement("div");

        empty.className = "empty";
        empty.textContent = "ランキングを表示できませんでした。";

        grid.appendChild(empty);

        errorArea.replaceChildren();

        const errorBox = document.createElement("div");
        errorBox.className = "error";

        const title = document.createElement("strong");
        title.textContent = "データ取得エラー";

        const message = document.createElement("p");
        message.textContent = error.message || String(error);

        const help = document.createElement("p");

        help.textContent =
          "スプレッドシートのウェブ公開設定と、" +
          "ブラウザから公開CSVへアクセスできるかを確認してください。";

        errorBox.append(title, message, help);
        errorArea.appendChild(errorBox);

        setText("status", "データを取得できませんでした。");
        setText("latest-date", "-");
        setText("result-count", "-");
        setText("ranking-types", "-");

        console.error("TVerランキング取得エラー:", error);

      } finally {
        button.disabled = false;
        button.textContent = "🔄 最新データを再取得";
      }
    }

    // =========================================================
    // イベント登録・初回読み込み
    // =========================================================

    document
      .getElementById("reload-button")
      .addEventListener("click", outputLatestTverRanking);

    outputLatestTverRanking();
  </script>
</body>
</html>
