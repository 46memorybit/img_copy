    /* =========================================================

      content: "";

      pointer-events: none;

      background:
        radial-gradient(
          circle at 25% 20%,
          rgba(255, 255, 255, .70),
          transparent 30%

        radial-gradient(
          circle at 80% 30%,
          rgba(255, 255, 255, .40),
          transparent 26%
        );

      z-index: 0;

    }


    /* =========================================================
       Stage
    ========================================================= */

    .stage {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      z-index: 1;

      transform: translateZ(0);

    }


    /* =========================================================
       Cube container
       
       3Dは完全に無効化
    ========================================================= */

    .cube {

      position: relative;

      width: 100%;
      height: 100%;

      transform: none;

      transform-style: flat;

      transition: none;

    }


    /* =========================================================
       Page
    ========================================================= */

    .page {

      position: absolute;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: transparent;

      pointer-events: none;

      opacity: 0;

      visibility: hidden;

      transform: translateX(100%);

      transition:
        transform .65s cubic-bezier(.22, .61, .36, 1),
        opacity .35s ease,
        visibility 0s linear .65s;

      z-index: 1;

    }


    .page.is-front {

      pointer-events: auto;

      opacity: 1;

      visibility: visible;

      transform: translateX(0);

      z-index: 3;

      transition:
        transform .65s cubic-bezier(.22, .61, .36, 1),
        opacity .35s ease,
        visibility 0s;

    }


    /*
     * 前方向へ移動するときのページ
     */

    .page.page-from-left {

      transform: translateX(-100%);

      opacity: 0;

      visibility: visible;

      z-index: 2;

    }


    /*
     * 後方向へ移動するときのページ
     */

    .page.page-from-right {

      transform: translateX(100%);

      opacity: 0;

      visibility: visible;

      z-index: 2;

    }


    .page.page-enter-left {

      transform: translateX(-100%);

      opacity: 0;

      visibility: visible;

      z-index: 4;

    }


    .page.page-enter-right {

      transform: translateX(100%);

      opacity: 0;

      visibility: visible;

      z-index: 4;

    }


    /* =========================================================
       Scroll container
    ========================================================= */

    .page-scroll {

      position: relative;

      width: 100%;
      height: 100%;

      overflow-x: hidden;
      overflow-y: auto;

      -webkit-overflow-scrolling: touch;

      touch-action: pan-y;

      overscroll-behavior-x: none;
      overscroll-behavior-y: contain;

      scrollbar-width: thin;

      scrollbar-color:
        rgba(232, 106, 154, .25)
        transparent;

    }


    .page:not(.is-front)
    .page-scroll {

      overflow-y: hidden;

    }

    }

    .youtube-section {

    .youtube-title {

    }


    /* =========================================================
       YouTube / Media card
    ========================================================= */

    .youtube-card {

      position: relative;

      display: block;

      width: 100%;

      padding: 0;

      border:
        1px solid
        rgba(232, 106, 154, .16);

      border-radius: 20px;

      overflow: hidden;

      background:
        rgba(255, 252, 250, .82);

      box-shadow:
        0 12px 34px

      cursor: pointer;

      text-align: left;

      content-visibility: auto;

      contain-intrinsic-size:
        360px 300px;

      contain:
        layout
        paint
        style;

      transition:
        transform .25s ease,

    }


    .youtube-card:hover {

      transform:

      box-shadow:
        0 18px 42px

    }


    .youtube-thumbnail {

      overflow: hidden;

      background: #eee;

    }


    .youtube-thumbnail img {

      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform .35s ease;

    }


    .youtube-card:hover

      transform:
        scale(1.035);

    }


    .youtube-info {

      padding:
        15px 17px 17px;

    }


    .youtube-name {

      min-height: 1.5em;

      font-size: 15px;

      font-weight: 700;

      line-height: 1.6;

    }


    .youtube-loading,
    .youtube-error {

      grid-column: 1 / -1;

      padding: 60px 20px;

      text-align: center;

      color: var(--muted);

    }


    /* =========================================================
       Navigation
    ========================================================= */

    .nav-arrow {

      position: fixed;

      background:
        rgba(255,255,255,.72);

      box-shadow:

      cursor: pointer;

      font-size: 24px;

      display: flex;

      align-items: center;
      justify-content: center;

      transition:

    .nav-arrow:hover {

      transform:

      background:

    }


    .nav-arrow.prev {

      left: 18px;

    }


    .nav-arrow.next {

      right: 18px;

    }


    /* =========================================================
       Indicator
    ========================================================= */

    .page-indicator {

      position: fixed;

      left: 50%;
      bottom: 22px;

      z-index: 50;

      display: flex;

      align-items: center;

      gap: 8px;

      padding:
        8px 13px;

      border-radius: 999px;

      transform:
        translateX(-50%);

      background:
        rgba(255,255,255,.70);

      box-shadow:
        0 8px 25px
        rgba(80,30,60,.10);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

    }


    .indicator {

      width: 7px;
      height: 7px;

      padding: 0;

      border: 0;

      border-radius: 50%;

      background:
        rgba(232,106,154,.25);

      transition:
        transform .25s ease,
        background .25s ease;

      cursor: pointer;

    }


    .indicator.active {

      background:
        var(--sakura);

      transform:
        scale(1.35);

    }


    .indicator-label {

      margin-left: 5px;

      color: var(--muted);

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 14px;

      letter-spacing: .05em;

    }


    /* =========================================================
       Swipe guide
    ========================================================= */

    .swipe-guide {

      position: fixed;

      left: 50%;
      bottom: 72px;

      z-index: 45;

      transform:
        translateX(-50%);

      padding:
        7px 14px;

      border-radius: 999px;

      color: var(--muted);

      font-size: 12px;

      background:
        rgba(255,255,255,.72);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      pointer-events: none;

      opacity: 1;

      transition:
        opacity .5s ease;

    }


    .swipe-guide.is-hidden {

      opacity: 0;

    }


    /* =========================================================
       Edge
    ========================================================= */

    .edge-hint {

      position: fixed;

      top: 0;
      bottom: 0;

      width: 8px;

      z-index: 40;

      pointer-events: none;

      opacity: .5;

    }


    .edge-hint.left {

      left: 0;

      background:
        linear-gradient(
          90deg,
          rgba(232,106,154,.18),
          transparent
        );

    }


    .edge-hint.right {

      right: 0;

      background:
        linear-gradient(
          270deg,
          rgba(232,106,154,.18),
          transparent
        );

    }


    /* =========================================================
       Modal
    ========================================================= */

    .video-modal {

      position: fixed;

      inset: 0;

      z-index: 999;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .25s ease,

    .video-modal.is-open {

      opacity: 1;

      visibility: visible;

    }


    .video-modal-inner {

      position: relative;

      width:
        min(1100px, 100%);

      aspect-ratio: 16 / 9;

      border-radius: 18px;

      overflow: hidden;

      background: #000;

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.4);

    }


    .video-modal iframe {

      display: block;

      width: 100%;
      height: 100%;

      border: 0;

    }


    /* =========================================================
       Close
    ========================================================= */

    .video-modal-close {

      position: fixed;

      left: 50%;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      z-index: 1002;

      width: 52px;
      height: 52px;

      margin: 0;

      padding: 0;

      border: 0;

      transform:

        0 8px 30px
        rgba(0,0,0,.28);

    .video-modal-close:hover {

        translateX(-50%)

      background:
        rgba(255,255,255,1);

    }


    .video-modal-close:active {

      transform:

    }

  </div>

  <script>

    /* =========================================================
       Configuration
    ========================================================= */

    const pageNames = [
      "Profile",
      "Personal",
      "Music",
      "Documentary",
      "Media"
    ];


    const categoryContainers = {

      Personal:
        "personalGrid",

      Music:
        "musicGrid",

        "documentaryGrid"

    };


    /*
     * Media API
     */

    const MEDIA_API_URL =
      "https://script.google.com/macros/s/AKfycbxmznRWhQnydbvZYiWJihJkTtbh78LVsyX9IgUQePzmRV9hFcJXBB77XndSPXuYye6F4g/exec";


    /* =========================================================
       DOM
    ========================================================= */

    const stage =
      document.getElementById(
        "stage"
      );


    const cube =
      document.getElementById(
        "cube"
      );


    const pages =
      Array.from(
        document.querySelectorAll(
          ".page"
        )
      );


    const indicators =
      Array.from(
        document.querySelectorAll(
          ".indicator"
        )
      );


    const pageLabel =
      document.getElementById(
        "pageLabel"
      );


    const swipeGuide =
      document.getElementById(
        "swipeGuide"
      );


    const prevButton =
      document.getElementById(
        "prevButton"
      );


    const nextButton =
      document.getElementById(
        "nextButton"
      );


    const videoModal =
      document.getElementById(
        "videoModal"
      );


    const videoFrame =
      document.getElementById(
        "videoFrame"
      );


    const videoModalClose =
      document.getElementById(
        "videoModalClose"
      );


    /* =========================================================
       State
    ========================================================= */

    const pageCount = 5;

    let currentPage = 0;

    let isAnimating = false;

    let guideHidden = false;


    /* =========================================================
       Mobile detection
    ========================================================= */

    function isMobile() {

      return window.matchMedia(
        "(max-width: 768px)"
      ).matches;

    }


    /* =========================================================
       Normalize
    ========================================================= */

    function normalizePage(
      page
    ) {

      return (
        (page % pageCount) +
        pageCount
      ) % pageCount;

    }


    /* =========================================================
       Set front page
    ========================================================= */

    function setFrontPage(
      index
    ) {

      pages.forEach(
        (page, i) => {

          page.classList.toggle(
            "is-front",
            i === index
          );

          if (i !== index) {

            const scroll =
              page.querySelector(
                ".page-scroll"
              );


            if (scroll) {

              scroll.scrollTop = 0;

            }

          }

        }
      );

    }


    /* =========================================================
       Indicator
    ========================================================= */

    function updateIndicator() {

      indicators.forEach(
        (indicator, index) => {

          indicator.classList.toggle(
            "active",
            index === currentPage
          );

        }
      );


      pageLabel.textContent =
        pageNames[currentPage];

    }


    /* =========================================================
       Guide
    ========================================================= */

    function hideGuide() {

      if (guideHidden) {

        return;

      }


      guideHidden = true;


      swipeGuide.classList.add(
        "is-hidden"
      );

    }


    /* =========================================================
       Page transition
       
       PC / Mobile共通
       3Dは使用しない
    ========================================================= */

    function goToPage(
      targetPage,
      direction
    ) {

      if (isAnimating) {

        return;

      }


      if (
        videoModal.classList.contains(
          "is-open"
        )
      ) {

        return;

      }


      targetPage =
        normalizePage(
          targetPage
        );


      if (
        targetPage === currentPage
      ) {

        return;

      }


      hideGuide();


      const oldPage =
        pages[currentPage];


      const newPage =
        pages[targetPage];


      if (
        !oldPage ||
        !newPage
      ) {

        return;

      }


      isAnimating = true;


      /*
       * direction > 0
       * 次ページ → 左へ流れる
       *
       * direction < 0
       * 前ページ → 右へ流れる
       */

      const enterClass =
        direction > 0
          ? "page-enter-right"
          : "page-enter-left";


      const leaveClass =
        direction > 0
          ? "page-from-left"
          : "page-from-right";


      /*
       * 新ページを画面外に配置
       */

      newPage.classList.remove(
        "page-from-left",
        "page-from-right",
        "page-enter-left",
        "page-enter-right",
        "is-front"
      );


      newPage.classList.add(
        enterClass
      );


      newPage.style.visibility =
        "visible";


      newPage.style.zIndex = "4";


      /*
       * 現在ページを退場
       */

      oldPage.classList.remove(
        "page-from-left",
        "page-from-right"
      );


      oldPage.classList.add(
        leaveClass
      );


      oldPage.classList.remove(
        "is-front"
      );


      oldPage.style.zIndex = "3";


      /*
       * 強制reflow
       */

      void newPage.offsetWidth;


      /*
       * 新ページを中央へ
       */

      newPage.classList.remove(
        enterClass
      );


      newPage.classList.add(
        "is-front"
      );


      newPage.style.zIndex = "4";


      currentPage =
        targetPage;


      updateIndicator();


      const duration =
        isMobile()
          ? 380
          : 680;


      window.setTimeout(
        () => {

          pages.forEach(
            (page, index) => {

              if (
                index === currentPage
              ) {

                page.classList.remove(
                  "page-from-left",
                  "page-from-right",
                  "page-enter-left",
                  "page-enter-right"
                );

                page.classList.add(
                  "is-front"
                );

                page.style.visibility =
                  "visible";

                page.style.zIndex =
                  "3";

              }

              else {

                page.classList.remove(
                  "is-front",
                  "page-from-left",
                  "page-from-right",
                  "page-enter-left",
                  "page-enter-right"
                );

                page.style.visibility =
                  "hidden";

                page.style.zIndex =
                  "1";

              }

            }
          );


          isAnimating = false;

        },
        duration
      );

    }


    function nextPage() {

      goToPage(
        currentPage + 1,
        1
      );

    }


    function previousPage() {

      goToPage(
        currentPage - 1,
        -1
      );

    }


    /* =========================================================
       Navigation buttons
    ========================================================= */

    nextButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        nextPage();

      }
    );


    prevButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        previousPage();

      }
    );


    /* =========================================================
       Indicators
    ========================================================= */

    indicators.forEach(
      (indicator, index) => {

        indicator.addEventListener(
          "click",
          event => {

            event.stopPropagation();


            if (
              index === currentPage
            ) {

              return;

            }


            let diff =
              index -
              currentPage;


            if (
              diff >
              pageCount / 2
            ) {

              diff -= pageCount;

            }


            if (
              diff <
              -pageCount / 2
            ) {

              diff += pageCount;

            }


            goToPage(
              index,
              diff > 0
                ? 1
                : -1
            );

          }
        );

      }
    );


    /* =========================================================
       Keyboard
    ========================================================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          videoModal.classList.contains(
            "is-open"
          )
        ) {

          if (
            event.key ===
            "Escape"
          ) {

            closeVideoModal();

          }

          return;

        }


        if (
          event.target.matches(
            "input, textarea, select"
          )
        ) {

          return;

        }


        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          nextPage();

        }

        else if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          previousPage();

        }

      }
    );


    /* =========================================================
       Horizontal wheel
    ========================================================= */

    let wheelLock = false;


    stage.addEventListener(
      "wheel",
      event => {

        if (
          videoModal.classList.contains(
            "is-open"
          )
        ) {

          return;

        }


        const absX =
          Math.abs(
            event.deltaX
          );


        const absY =
          Math.abs(
            event.deltaY
          );


        if (
          absY >= absX
        ) {

          return;

        }


        if (
          absX < 15
        ) {

          return;

        }


        event.preventDefault();


        if (wheelLock) {

          return;

        }


        wheelLock = true;


        if (
          event.deltaX > 0
        ) {

          nextPage();

        }

        else {

          previousPage();

        }


        window.setTimeout(
          () => {

            wheelLock = false;

          },
          700
        );

      },
      {
        passive: false
      }
    );


    /* =========================================================
       Touch
    ========================================================= */

    let touchStartX = 0;

    let touchStartY = 0;

    let touchStartTime = 0;

    let touchTracking = false;


    function isInteractiveElement(
      target
    ) {

      return !!target.closest(
        "button, a, .youtube-card, iframe"
      );

    }


    document
      .querySelectorAll(
        ".page-scroll"
      )
      .forEach(
        scrollArea => {

          scrollArea.addEventListener(
            "touchstart",
            event => {

              if (
                videoModal.classList.contains(
                  "is-open"
                )
              ) {

                return;

              }


              const page =
                scrollArea.closest(
                  ".page"
                );


              if (
                !page ||
                !page.classList.contains(
                  "is-front"
                )
              ) {

                touchTracking = false;

                return;

              }


              if (
                isInteractiveElement(
                  event.target
                )
              ) {

                touchTracking = false;

                return;

              }


              const touch =
                event.touches[0];


              if (!touch) {

                return;

              }


              touchStartX =
                touch.clientX;


              touchStartY =
                touch.clientY;


              touchStartTime =
                performance.now();


              touchTracking = true;

            },
            {
              passive: true
            }
          );


          scrollArea.addEventListener(
            "touchmove",
            event => {

              if (!touchTracking) {

                return;

              }


              const touch =
                event.touches[0];


              if (!touch) {

                return;

              }


              const diffX =
                touch.clientX -
                touchStartX;


              const diffY =
                touch.clientY -
                touchStartY;


              if (
                Math.abs(diffY) >
                Math.abs(diffX)
              ) {

                touchTracking = false;

              }

            },
            {
              passive: true
            }
          );


          scrollArea.addEventListener(
            "touchend",
            event => {

              if (!touchTracking) {

                return;

              }


              touchTracking = false;


              if (
                videoModal.classList.contains(
                  "is-open"
                )
              ) {

                return;

              }


              const touch =
                event.changedTouches[0];


              if (!touch) {

                return;

              }


              const diffX =
                touch.clientX -
                touchStartX;


              const diffY =
                touch.clientY -
                touchStartY;


              const elapsed =
                performance.now() -
                touchStartTime;


              if (
                Math.abs(diffY) >=
                Math.abs(diffX)
              ) {

                return;

              }


              if (
                Math.abs(diffX) < 55
              ) {

                return;

              }


              if (
                elapsed > 1200
              ) {

                return;

              }


              hideGuide();


              if (
                diffX < 0
              ) {

                nextPage();

              }

              else {

                previousPage();

              }

            },
            {
              passive: true
            }
          );

        }
      );


    /* =========================================================
       PC Mouse drag
    ========================================================= */

    let mouseDown = false;

    let mouseStartX = 0;

    let mouseStartY = 0;


    stage.addEventListener(
      "mousedown",
      event => {

        if (
          event.button !== 0
        ) {

          return;

        }


        if (
          isInteractiveElement(
            event.target
          )
        ) {

          return;

        }


        mouseDown = true;


        mouseStartX =
          event.clientX;


        mouseStartY =
          event.clientY;

      }
    );


    window.addEventListener(
      "mouseup",
      event => {

        if (!mouseDown) {

          return;

        }


        mouseDown = false;


        const diffX =
          event.clientX -
          mouseStartX;


        const diffY =
          event.clientY -
          mouseStartY;


        if (
          Math.abs(diffY) >=
          Math.abs(diffX)
        ) {

          return;

        }


        if (
          Math.abs(diffX) < 60
        ) {

          return;

        }


        hideGuide();


        if (
          diffX < 0
        ) {

          nextPage();

        }

        else {

          previousPage();

        }

      }
    );


    window.addEventListener(
      "blur",
      () => {

        mouseDown = false;

      }
    );


    /* =========================================================
       YouTube ID
    ========================================================= */

    function extractVideoId(
      value
    ) {

      if (!value) {

        return "";

      }


      if (
        typeof value ===
        "object"
      ) {

        value =
          value.videoId ||
          value.id ||
          value.url ||
          value.href ||
          "";

      }


      const text =
        String(value).trim();


      const matched =
        text.match(
          /(?:v=|\/embed\/|\/shorts\/|youtu\.be\/)([A-Za-z0-9_-]{11})/
        ) ||
        text.match(
          /^([A-Za-z0-9_-]{11})$/
        );


      return matched
        ? matched[1]
        : "";

    }


    /* =========================================================
       Video modal
    ========================================================= */

    function openVideoModal(
      videoId
    ) {

      const id =
        extractVideoId(
          videoId
        );


      if (!id) {

        return;

      }


      videoFrame.src =
        `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;


      videoModal.classList.add(
        "is-open"
      );


      videoModal.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.classList.add(
        "modal-open"
      );

    }


    function closeVideoModal() {

      videoModal.classList.remove(
        "is-open"
      );


      videoModal.setAttribute(
        "aria-hidden",
        "true"
      );


      videoFrame.src = "";


      document.body.classList.remove(
        "modal-open"
      );

    }


    videoModalClose.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        closeVideoModal();

      }
    );


    videoModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          videoModal
        ) {

          closeVideoModal();

        }

      }
    );


    /* =========================================================
       YouTube card click
    ========================================================= */

    document.addEventListener(
      "click",
      event => {

        if (
          videoModal.classList.contains(
            "is-open"
          )
        ) {

          return;

        }


        const card =
          event.target.closest(
            ".youtube-card"
          );


        if (!card) {

          return;

        }


        /*
         * Mediaカード
         */

        if (
          card.dataset.mediaUrl
        ) {

          event.preventDefault();

          event.stopPropagation();


          window.open(
            card.dataset.mediaUrl,
            "_blank",
            "noopener,noreferrer"
          );


          return;

        }


        /*
         * YouTubeカード
         */

        const videoId =
          card.dataset.videoId;


        if (videoId) {

          event.preventDefault();

          event.stopPropagation();


          openVideoModal(
            videoId
          );

        }

      }
    );


    /* =========================================================
       Create YouTube card
    ========================================================= */

    function createYouTubeCard(
      rawData
    ) {

      let videoId = "";

      let videoTitle = "";


      if (
        typeof rawData ===
        "object"
      ) {

        videoId =
          extractVideoId(
            rawData.videoId ||
            rawData.id ||
            rawData.url
          );


        videoTitle =
          rawData.title ||
          rawData.name ||
          "";

      }

      else {

        videoId =
          extractVideoId(
            rawData
          );

      }


      if (!videoId) {

        return null;

      }


      const card =
        document.createElement(
          "button"
        );


      card.type = "button";

      card.className =
        "youtube-card";

      card.dataset.videoId =
        videoId;


      const thumbnail =
        document.createElement(
          "div"
        );


      thumbnail.className =
        "youtube-thumbnail";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;


      image.alt =
        videoTitle ||
        "YouTube動画";


      image.width = 1280;

      image.height = 720;

      image.loading =
        "lazy";

      image.decoding =
        "async";


      image.onerror =
        () => {

          if (
            image.dataset.fallback
          ) {

            return;

          }


          image.dataset.fallback =
            "true";


          image.src =
            `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

        };


      thumbnail.appendChild(
        image
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "youtube-info";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "youtube-name";


      title.textContent =
        videoTitle ||
        "読み込み中…";


      info.appendChild(
        title
      );


      card.appendChild(
        thumbnail
      );


      card.appendChild(
        info
      );


      if (!videoTitle) {

        fetch(
          `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}&format=json`
        )
          .then(
            response => {

              if (!response.ok) {

                throw new Error(
                  "oEmbed error"
                );

              }

              return response.json();

            }
          )
          .then(
            data => {

              if (
                data &&
                data.title
              ) {

                title.textContent =
                  data.title;

              }

            }
          )
          .catch(
            () => {

              title.textContent =
                "YouTube動画";

            }
          );

      }


      return card;

    }


    /* =========================================================
       Create Media card
       
       JSON:
       {
         title,
         horizontal_thumbnail_path,
         episodeURL
       }
    ========================================================= */

    function createMediaCard(
      item
    ) {

      if (
        !item ||
        typeof item !== "object"
      ) {

        return null;

      }


      const titleText =
        item.title ||
        "";


      const thumbnailURL =
        item.horizontal_thumbnail_path ||
        "";


      const episodeURL =
        item.episodeURL ||
        "";


      if (
        !titleText ||
        !thumbnailURL ||
        !episodeURL
      ) {

        return null;

      }


      const card =
        document.createElement(
          "button"
        );


      card.type = "button";

      card.className =
        "youtube-card";


      /*
       * Media専用URL
       */

      card.dataset.mediaUrl =
        episodeURL;


      const thumbnail =
        document.createElement(
          "div"
        );


      thumbnail.className =
        "youtube-thumbnail";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        thumbnailURL;


      image.alt =
        titleText;


      image.width = 1280;

      image.height = 720;

      image.loading =
        "lazy";

      image.decoding =
        "async";


      /*
       * TVer等の画像が失敗した場合
       */

      image.onerror =
        () => {

          image.style.display =
            "none";

          thumbnail.classList.add(
            "thumbnail-error"
          );

        };


      thumbnail.appendChild(
        image
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "youtube-info";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "youtube-name";


      title.textContent =
        titleText;


      info.appendChild(
        title
      );


      card.appendChild(
        thumbnail
      );


      card.appendChild(
        info
      );


      return card;

    }


    /* =========================================================
       Category
    ========================================================= */

    function getCategoryData(
      data,
      category
    ) {

      if (!data) {

        return [];

      }


      if (
        Array.isArray(
          data[category]
        )
      ) {

        return data[category];

      }


      if (
        data.YouTube &&
        Array.isArray(
          data.YouTube[category]
        )
      ) {

        return data.YouTube[
          category
        ];

      }


      const key =
        Object.keys(data)
          .find(
            key =>
              key.toLowerCase() ===
              category.toLowerCase()
          );


      if (
        key &&
        Array.isArray(
          data[key]
        )
      ) {

        return data[key];

      }


      return [];

    }


    /* =========================================================
       Load YouTube JSON
    ========================================================= */

    async function loadYouTubeData() {

      try {

        const response =
          await fetch(
            "./YouTube.json",
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const youtubeData =
          await response.json();


        Object.entries(
          categoryContainers
        ).forEach(
          ([category, containerId]) => {

            const container =
              document.getElementById(
                containerId
              );


            if (!container) {

              return;

            }


            const ids =
              getCategoryData(
                youtubeData,
                category
              );


            container.innerHTML = "";


            if (!ids.length) {

              const empty =
                document.createElement(
                  "div"
                );


              empty.className =
                "youtube-error";


              empty.textContent =
                "動画がありません。";


              container.appendChild(
                empty
              );


              return;

            }


            const fragment =
              document.createDocumentFragment();


            ids.forEach(
              rawData => {

                const card =
                  createYouTubeCard(
                    rawData
                  );


                if (card) {

                  fragment.appendChild(
                    card
                  );

                }

              }
            );


            container.appendChild(
              fragment
            );

          }
        );

      }

      catch (error) {

        console.error(
          "YouTube.jsonの読み込みに失敗しました:",
          error
        );


        Object.values(
          categoryContainers
        ).forEach(
          containerId => {

            const container =
              document.getElementById(
                containerId
              );


            if (!container) {

              return;

            }


            container.innerHTML = "";


            const errorElement =
              document.createElement(
                "div"
              );


            errorElement.className =
              "youtube-error";


            errorElement.textContent =
              "動画情報を読み込めませんでした。";


            container.appendChild(
              errorElement
            );

          }
        );

      }

    }


    /* =========================================================
       Load Media API
    ========================================================= */

    async function loadMediaData() {

      const container =
        document.getElementById(
          "mediaGrid"
        );


      if (!container) {

        return;

      }


      try {

        const response =
          await fetch(
            MEDIA_API_URL,
            {
              method: "GET",
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const mediaData =
          await response.json();


        /*
         * APIが配列を直接返す形式
         */

        let items =
          Array.isArray(mediaData)
            ? mediaData
            : [];


        /*
         * 念のため data / items / Media
         * などに入っている場合にも対応
         */

        if (
          !Array.isArray(mediaData) &&
          mediaData &&
          typeof mediaData === "object"
        ) {

          if (
            Array.isArray(
              mediaData.data
            )
          ) {

            items =
              mediaData.data;

          }

          else if (
            Array.isArray(
              mediaData.items
            )
          ) {

            items =
              mediaData.items;

          }

          else if (
            Array.isArray(
              mediaData.Media
            )
          ) {

            items =
              mediaData.Media;

          }

        }


        container.innerHTML = "";


        if (!items.length) {

          const empty =
            document.createElement(
              "div"
            );


          empty.className =
            "youtube-error";


          empty.textContent =
            "メディア情報がありません。";


          container.appendChild(
            empty
          );


          return;

        }


        const fragment =
          document.createDocumentFragment();


        items.forEach(
          item => {

            const card =
              createMediaCard(
                item
              );


            if (card) {

              fragment.appendChild(
                card
              );

            }

          }
        );


        if (!fragment.children.length) {

          const errorElement =
            document.createElement(
              "div"
            );


          errorElement.className =
            "youtube-error";


          errorElement.textContent =
            "表示できるメディアがありません。";


          container.appendChild(
            errorElement
          );


          return;

        }


        container.appendChild(
          fragment
        );

      }

      catch (error) {

        console.error(
          "Media APIの読み込みに失敗しました:",
          error
        );


        container.innerHTML = "";


        const errorElement =
          document.createElement(
            "div"
          );


        errorElement.className =
          "youtube-error";


        errorElement.textContent =
          "メディア情報を読み込めませんでした。";


        container.appendChild(
          errorElement
        );

      }

    }


    /* =========================================================
       Visibility
    ========================================================= */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.hidden
        ) {

          mouseDown = false;

          touchTracking = false;

        }

      }
    );


    /* =========================================================
       Initialize
    ========================================================= */

    pages.forEach(
      (page, index) => {

        if (index === currentPage) {

          page.classList.add(
            "is-front"
          );

          page.style.visibility =
            "visible";

          page.style.zIndex =
            "3";

        }

        else {

          page.classList.remove(
            "is-front"
          );

          page.style.visibility =
            "hidden";

          page.style.zIndex =
            "1";

        }

      }
    );


    updateIndicator();


    /*
     * YouTubeとMediaを並行読み込み
     */

    loadYouTubeData();

    loadMediaData();

  </script>

</body>
</html>
