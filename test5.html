<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fde8ef">
  <title>画面キャプチャ・X共有</title>

  <!-- HTMLを画像化するライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin: 0 0 20px;
    }

    .section {
      margin-bottom: 20px;
      padding: 16px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: bold;
    }

    /*
     * この要素がキャプチャ対象
     * 内容を変更すると共有画像にも反映される
     */
    #capture-area {
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 5%;
      background: linear-gradient(145deg, #fff5f8, #fde8ef);
      border: 1px solid #f4c7d5;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .capture-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5%;
    }

    .program-name {
      font-size: clamp(12px, 3.5vw, 18px);
      font-weight: bold;
      color: #b83d70;
    }

    .capture-date {
      font-size: clamp(9px, 2.5vw, 12px);
      color: #777;
      text-align: right;
    }

    .capture-image {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .capture-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder {
      padding: 10px;
      color: #999;
      text-align: center;
      font-size: 14px;
    }

    .capture-caption {
      margin-top: 4%;
      font-size: clamp(12px, 3.5vw, 17px);
      font-weight: bold;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font: inherit;
      font-size: 14px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .share-button {
      background: #111;
      color: #fff;
    }

    .save-button {
      background: #f3d7e2;
      color: #762a4a;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.7;
      color: #666;
    }

    .preview-image {
      display: none;
      width: 100%;
      margin-top: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    @media (min-width: 480px) {
      .button-group {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>画面キャプチャ・X共有</h1>

    <section class="section">
      <h2 class="section-title">キャプチャ対象</h2>

      <!-- この領域だけを画像化する -->
      <div id="capture-area">
        <div class="capture-header">
          <div class="program-name" id="preview-program">
            サクラミーツ
          </div>
          <div class="capture-date" id="preview-date"></div>
        </div>

        <div class="capture-image">
          <img id="preview-source" alt="キャプチャ画像" hidden>
          <div class="placeholder" id="image-placeholder">
            下の設定から画像URLを入力してください
          </div>
        </div>

        <div class="capture-caption" id="preview-caption">
          TVerランキング
        </div>
      </div>

      <label for="image-url">画像URL</label>
      <input
        id="image-url"
        type="url"
        placeholder="https://example.com/image.jpg"
      >

      <label for="program">番組名</label>
      <input
        id="program"
        type="text"
        value="サクラミーツ"
      >

      <label for="caption">画像内のタイトル</label>
      <input
        id="caption"
        type="text"
        value="TVerランキング"
      >

      <label for="post-text">Xに共有する投稿テキスト</label>
      <textarea id="post-text">サクラミーツ TVerランキング🔥
#サクラミーツ</textarea>

      <div class="button-group">
        <button
          type="button"
          class="share-button"
          id="share-button"
        >
          📤 キャプチャして共有
        </button>

        <button
          type="button"
          class="save-button"
          id="save-button"
        >
          💾 PNG画像を保存
        </button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">
        共有する画像URLを入力してください。
      </div>

      <img
        id="generated-preview"
        class="preview-image"
        alt="生成したキャプチャ画像のプレビュー"
      >

      <p class="note">
        ※ 共有ボタンを押すと、指定範囲をPNG画像に変換して
        Web Share APIで共有します。共有先の一覧にXがあれば選択してください。
        X側の仕様や端末によって、画像・テキストの受け渡し結果が異なる場合があります。
      </p>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    let generatedBlob = null;
    let generatedObjectURL = null;

    // 日付を表示
    function updateDate() {
      $("preview-date").textContent =
        new Intl.DateTimeFormat("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(new Date());
    }

    updateDate();

    function setStatus(message) {
      $("status").textContent = message;
    }

    function updateText() {
      $("preview-program").textContent =
        $("program").value || "サクラミーツ";

      $("preview-caption").textContent =
        $("caption").value || "TVerランキング";
    }

    $("program").addEventListener("input", updateText);
    $("caption").addEventListener("input", updateText);

    // 画像URLの読み込み
    $("image-url").addEventListener("change", () => {
      const url = $("image-url").value.trim();

      if (!url) return;

      const img = $("preview-source");
      img.hidden = true;
      $("image-placeholder").hidden = false;
      $("image-placeholder").textContent = "画像を読み込み中…";

      img.onload = () => {
        img.hidden = false;
        $("image-placeholder").hidden = true;
        setStatus("画像を読み込みました。共有できます。");
      };

      img.onerror = () => {
        img.hidden = true;
        $("image-placeholder").hidden = false;
        $("image-placeholder").textContent =
          "画像を読み込めません。URLやCORS設定を確認してください。";
        setStatus("画像の読み込みに失敗しました。");
      };

      img.src = url;
    });

    // キャプチャ対象内の画像を読み込む
    async function waitForImages(element) {
      const images = [...element.querySelectorAll("img")];

      await Promise.all(images.map(async (img) => {
        if (!img.src || img.hidden) return;

        if (!img.complete) {
          await new Promise((resolve) => {
            img.onload = resolve;
            img.onerror = resolve;
          });
        }

        if (img.decode && img.naturalWidth > 0) {
          try {
            await img.decode();
          } catch (_) {}
        }
      }));
    }

    // 指定範囲をPNG Blobに変換
    async function createCapture() {
      if (typeof html2canvas !== "function") {
        throw new Error(
          "画像化ライブラリを読み込めません。通信環境を確認してください。"
        );
      }

      updateDate();
      updateText();

      const target = $("capture-area");

      await waitForImages(target);

      const canvas = await html2canvas(target, {
        backgroundColor: null,
        scale: 2,
        useCORS: true,
        logging: false
      });

      const blob = await new Promise((resolve, reject) => {
        canvas.toBlob((result) => {
          if (result) resolve(result);
          else reject(new Error("PNG画像を生成できませんでした。"));
        }, "image/png");
      });

      generatedBlob = blob;

      if (generatedObjectURL) {
        URL.revokeObjectURL(generatedObjectURL);
      }

      generatedObjectURL = URL.createObjectURL(blob);
      $("generated-preview").src = generatedObjectURL;
      $("generated-preview").style.display = "block";

      return blob;
    }

    // Web Share APIで画像とテキストを共有
    $("share-button").addEventListener("click", async () => {
      const button = $("share-button");

      try {
        if (!navigator.share) {
          throw new Error(
            "このブラウザはWeb Share APIに対応していません。"
          );
        }

        if (!navigator.canShare) {
          throw new Error(
            "共有ファイルに対応しているか確認できません。"
          );
        }

        button.disabled = true;
        setStatus("キャプチャ画像を作成しています…");

        const blob = await createCapture();

        const file = new File(
          [blob],
          "sakurameets-capture.png",
          { type: "image/png" }
        );

        if (!navigator.canShare({ files: [file] })) {
          throw new Error(
            "このブラウザでは画像ファイルの共有に対応していません。PNG保存をご利用ください。"
          );
        }

        const text = $("post-text").value;

        setStatus("共有メニューを開いています…");

        // 画像とテキストを1回の共有操作で渡す
        await navigator.share({
          files: [file],
          title: $("caption").value || "画面キャプチャ",
          text: text
        });

        setStatus(
          "共有画面を終了しました。Xで投稿が完了したかは、X側で確認してください。"
        );

      } catch (error) {
        if (error.name === "AbortError") {
          setStatus("共有をキャンセルしました。");
        } else {
          setStatus("共有できませんでした：" + error.message);
        }
      } finally {
        button.disabled = false;
      }
    });

    // PNG画像を保存
    $("save-button").addEventListener("click", async () => {
      const button = $("save-button");

      try {
        button.disabled = true;
        setStatus("PNG画像を作成しています…");

        const blob = await createCapture();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "sakurameets-capture.png";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        setStatus("PNG画像の保存を開始しました。");

      } catch (error) {
        setStatus("保存できませんでした：" + error.message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
