
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fde8ef">
  <title>TVerランキング画像メーカー</title>

  <style>
    :root {
      --pink: #e86a9a;
      --pink-light: #fde8ef;
      --text: #493942;
      --muted: #8b7881;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px 32px;
      color: var(--text);
      background: linear-gradient(180deg, #fff7fa, #fff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 22px;
    }

    .description {
      margin: 0 0 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    #preview {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid #f1d4df;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 5px 24px rgb(125 59 83 / 10%);
    }

    #captureCard {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 4%;
      overflow: hidden;
      background:
        radial-gradient(circle at 100% 0%, #fff0f5 0, transparent 42%),
        #fff;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      min-height: 10%;
      margin-bottom: 2%;
    }

    #programName {
      max-width: 70%;
      color: var(--pink);
      font-size: clamp(11px, 3vw, 16px);
      font-weight: 800;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    #retrievedAt {
      flex-shrink: 0;
      color: var(--muted);
      font-size: clamp(8px, 2vw, 11px);
      text-align: right;
      line-height: 1.5;
    }

    #thumbnailFrame {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #f5f0f2;
    }

    #thumbnail {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #thumbnail[hidden] {
      display: none;
    }

    #noImage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #f4eff1;
      color: #9b8991;
      text-align: center;
    }

    #noImage[hidden] {
      display: none;
    }

    #noImage strong {
      font-size: clamp(22px, 7vw, 36px);
      letter-spacing: 0.08em;
    }

    #noImage span {
      padding: 0 12px;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    #rankBadge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 2;
      min-width: 58px;
      max-width: calc(100% - 20px);
      padding: 7px 12px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: linear-gradient(135deg, #e86a9a, #b94376);
      color: #fff;
      font-size: clamp(18px, 5vw, 27px);
      font-weight: 900;
      line-height: 1.1;
      box-shadow: 0 2px 8px rgb(0 0 0 / 22%);
      overflow-wrap: anywhere;
    }

    #episodeTitle {
      display: -webkit-box;
      flex-shrink: 0;
      margin: 3% 0 0;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(12px, 3.2vw, 17px);
      font-weight: 800;
      line-height: 1.45;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 2%;
      color: var(--muted);
      font-size: clamp(8px, 2vw, 10px);
    }

    .brand {
      color: var(--pink);
      font-weight: 800;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 48px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #shareButton {
      background: var(--pink);
      color: #fff;
    }

    #saveButton {
      background: var(--pink-light);
      color: #a53f69;
      border: 1px solid #f1d4df;
    }

    #status {
      min-height: 42px;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (min-width: 560px) {
      body {
        padding-top: 32px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>TVerランキング画像メーカー</h1>
    <p class="description">テストモード：エピソードIDの照合なし</p>

    <div id="preview">
      <div id="captureCard">
        <div class="header">
          <div id="programName">TVerランキング</div>
          <div id="retrievedAt"></div>
        </div>

        <div id="thumbnailFrame">
          <img id="thumbnail" alt="エピソードサムネイル" hidden>

          <div id="noImage">
            <strong>NO IMAGE</strong>
            <span>サムネイル画像はありません</span>
          </div>

          <div id="rankBadge">--位</div>
        </div>

        <p id="episodeTitle">データを取得しています…</p>

        <div class="footer">
          <span class="brand">TVerランキング</span>
          <span id="episodeIdLabel"></span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="shareButton" disabled>画像を共有</button>
      <button id="saveButton" disabled>画像を保存</button>
    </div>

    <div id="status" role="status" aria-live="polite">
      ランキングデータを取得しています…
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    "use strict";

    // =========================================================
    // 設定
    // =========================================================

    const CONFIG = {
      // 順位・タイトル・取得日時の取得元
      SHEET_CSV_URL:
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJofs8FiOCnnavLtBInpn1d6u9YiJ6kZLFDBNI8iRTL4RBJBz3PSQtMSiSKt35B0xgtv6p9zKTy-75/pub?gid=91701956&single=true&output=csv",

      // サムネイルURLの取得元
      THUMBNAIL_API_URL:
        "https://api.konnagi.com/meets-app-tver&radiko",

      CAPTURE_SCALE: 2
    };

    // =========================================================
    // DOM
    // =========================================================

    const captureCard = document.getElementById("captureCard");
    const programName = document.getElementById("programName");
    const retrievedAt = document.getElementById("retrievedAt");
    const thumbnail = document.getElementById("thumbnail");
    const noImage = document.getElementById("noImage");
    const rankBadge = document.getElementById("rankBadge");
    const episodeTitle = document.getElementById("episodeTitle");
    const episodeIdLabel = document.getElementById("episodeIdLabel");
    const statusElement = document.getElementById("status");
    const shareButton = document.getElementById("shareButton");
    const saveButton = document.getElementById("saveButton");

    let currentRow = null;
    let imageReady = false;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    // =========================================================
    // CSVパーサー
    // =========================================================

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      text = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              cell += '"';
              i++;
            } else {
              quoted = false;
            }
          } else {
            cell += ch;
          }
        } else if (ch === '"') {
          quoted = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (ch !== "\r") {
          cell += ch;
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell);
        rows.push(row);
      }

      return rows.filter(r => r.some(v => String(v).trim() !== ""));
    }

    function normalizeHeader(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[\s_\-　]/g, "");
    }

    function findColumn(headers, candidates, fallbackIndex) {
      const normalized = headers.map(normalizeHeader);

      for (const candidate of candidates) {
        const index = normalized.indexOf(normalizeHeader(candidate));
        if (index !== -1) return index;
      }

      return fallbackIndex;
    }

    // =========================================================
    // スプレッドシートの列を読み取る
    //
    // 既定の列順：
    // timestamp, rankingType, rankingId, rank, episodeId,
    // seriesId, programName, episodeTitle, station, broadcastDate
    //
    // 実際のヘッダー名が異なる場合は候補名を追加する
    // =========================================================

    function parseSheetRows(csvText) {
      const rows = parseCSV(csvText);

      if (rows.length < 2) {
        throw new Error("スプレッドシートにデータ行がありません");
      }

      const headers = rows[0];

      const columns = {
        timestamp: findColumn(
          headers, ["timestamp", "取得日時", "取得時刻", "日時"], 0
        ),
        rankingType: findColumn(
          headers, ["rankingType", "ランキング種別"], 1
        ),
        rankingId: findColumn(
          headers, ["rankingId", "ランキングID", "ランキング"], 2
        ),
        rank: findColumn(
          headers, ["rank", "順位", "ランキング順位"], 3
        ),
        episodeId: findColumn(
          headers, ["episodeId", "エピソードID"], 4
        ),
        seriesId: findColumn(
          headers, ["seriesId", "シリーズID"], 5
        ),
        programName: findColumn(
          headers, ["programName", "番組名", "番組"], 6
        ),
        episodeTitle: findColumn(
          headers, ["episodeTitle", "エピソードタイトル", "タイトル"], 7
        ),
        station: findColumn(
          headers, ["station", "放送局"], 8
        ),
        broadcastDate: findColumn(
          headers, ["broadcastDate", "放送日", "配信日"], 9
        )
      };

      return rows.slice(1).map(cells => {
        const get = key => {
          const index = columns[key];
          return index >= 0 ? String(cells[index] ?? "").trim() : "";
        };

        return {
          timestamp: get("timestamp"),
          rankingType: get("rankingType"),
          rankingId: get("rankingId"),
          rank: get("rank"),
          episodeId: get("episodeId"),
          seriesId: get("seriesId"),
          programName: get("programName"),
          episodeTitle: get("episodeTitle"),
          station: get("station"),
          broadcastDate: get("broadcastDate")
        };
      });
    }

    function parseTimestamp(value) {
      if (!value) return NaN;

      const date = new Date(value);

      if (!Number.isNaN(date.getTime())) {
        return date.getTime();
      }

      const number = Number(value);

      if (Number.isFinite(number) && number > 0) {
        return number < 1e12 ? number * 1000 : number;
      }

      return NaN;
    }

    function formatTimestamp(value) {
      const time = parseTimestamp(value);
      if (!Number.isFinite(time)) return value || "";

      const date = new Date(time);

      return date.toLocaleDateString("ja-JP", {
        month: "2-digit",
        day: "2-digit"
      }) + " " + date.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    // =========================================================
    // 主データ：Googleスプレッドシート
    // =========================================================

    async function fetchLatestRanking() {
      setStatus("スプレッドシートからランキングを取得しています…");

      const response = await fetch(CONFIG.SHEET_CSV_URL, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          "スプレッドシート取得失敗（HTTP " + response.status + "）"
        );
      }

      const csvText = await response.text();

      if (
        /<!doctype html|<html[\s>]/i.test(csvText) &&
        !/timestamp|取得日時|episodeId|エピソードID/i.test(csvText)
      ) {
        throw new Error(
          "CSVではなくHTMLが返されました。公開設定を確認してください。"
        );
      }

      const rows = parseSheetRows(csvText);

      const validRows = rows.filter(row =>
        Number.isFinite(parseTimestamp(row.timestamp)) &&
        row.episodeId &&
        row.rank &&
        Number.isFinite(Number(row.rank))
      );

      if (validRows.length === 0) {
        throw new Error(
          "有効なランキングデータがありません。CSVの列名・列順を確認してください。"
        );
      }

      const latestTime = Math.max(
        ...validRows.map(row => parseTimestamp(row.timestamp))
      );

      const latestRows = validRows.filter(
        row => parseTimestamp(row.timestamp) === latestTime
      );

      // 全ランキング（all）があれば優先する
      const allRows = latestRows.filter(row =>
        String(row.rankingId).toLowerCase() === "all" ||
        String(row.rankingType).toLowerCase() === "all"
      );

      const candidates = allRows.length ? allRows : latestRows;

      candidates.sort((a, b) => Number(a.rank) - Number(b.rank));

      return candidates[0];
    }

    // =========================================================
    // サムネイルAPI
    // テスト用：エピソードIDは照合しない
    // horizontal_thumbnail_path がある最初の項目を使用
    // =========================================================

    async function fetchTestThumbnailUrl() {
      setStatus("APIからサムネイルURLを取得しています…");

      const response = await fetch(CONFIG.THUMBNAIL_API_URL, {
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(
          "サムネイルAPI取得失敗（HTTP " + response.status + "）"
        );
      }

      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error("サムネイルAPIのレスポンスが配列ではありません");
      }

      const item = data.find(entry =>
        entry &&
        typeof entry.horizontal_thumbnail_path === "string" &&
        entry.horizontal_thumbnail_path.trim() !== ""
      );

      if (!item) {
        return {
          url: "",
          apiEpisodeURL: ""
        };
      }

      const url = item.horizontal_thumbnail_path.trim();

      try {
        const parsed = new URL(url);

        if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
          throw new Error("HTTP(S)以外の画像URLです");
        }

        return {
          url: parsed.href,
          apiEpisodeURL: item.episodeURL || ""
        };
      } catch (error) {
        console.warn("無効な画像URL:", url, error);
        return {
          url: "",
          apiEpisodeURL: ""
        };
      }
    }

    // =========================================================
    // サムネイル表示・NO IMAGE表示
    // =========================================================

    function showNoImage(message = "NO IMAGE") {
      thumbnail.hidden = true;
      thumbnail.removeAttribute("src");
      noImage.hidden = false;
      noImage.querySelector("strong").textContent = "NO IMAGE";
      noImage.querySelector("span").textContent = message;
    }

    function loadThumbnail(url) {
      return new Promise(resolve => {
        if (!url) {
          showNoImage("サムネイル画像はありません");
          resolve(false);
          return;
        }

        thumbnail.hidden = true;
        noImage.hidden = false;
        noImage.querySelector("strong").textContent = "LOADING";
        noImage.querySelector("span").textContent = "画像を読み込んでいます…";

        // Canvasキャプチャ用のCORS読み込み
        thumbnail.crossOrigin = "anonymous";

        thumbnail.onload = () => {
          thumbnail.hidden = false;
          noImage.hidden = true;
          resolve(true);
        };

        thumbnail.onerror = () => {
          showNoImage("画像を取得できませんでした");
          resolve(false);
        };

        thumbnail.src = url;
      });
    }

    // =========================================================
    // 画像カード描画
    // =========================================================

    async function renderCard(row, thumbnailInfo) {
      currentRow = row;
      imageReady = false;

      shareButton.disabled = true;
      saveButton.disabled = true;

      programName.textContent = row.programName || "TVerランキング";
      retrievedAt.textContent = formatTimestamp(row.timestamp);
      episodeTitle.textContent = row.episodeTitle || "タイトル不明";
      rankBadge.textContent = Number(row.rank) + "位";
      episodeIdLabel.textContent = row.episodeId
        ? "ID: " + row.episodeId
        : "";

      const imageLoaded = await loadThumbnail(thumbnailInfo.url);

      imageReady = true;
      shareButton.disabled = false;
      saveButton.disabled = false;

      setStatus(
        "表示完了（テストモード：ID照合なし）\n" +
        "順位：" + row.rank + "位\n" +
        "タイトル：" + (row.episodeTitle || "不明") + "\n" +
        "スプレッドシートのエピソードID：" + (row.episodeId || "なし") + "\n" +
        "サムネイル：" + (imageLoaded ? "APIから取得" : "NO IMAGE") +
        (thumbnailInfo.apiEpisodeURL
          ? "\nサムネイル元のエピソード：" + thumbnailInfo.apiEpisodeURL
          : "")
      );
    }

    // =========================================================
    // PNG生成
    // =========================================================

    async function createImageBlob() {
      if (!imageReady || !currentRow) {
        throw new Error("画像の準備が完了していません");
      }

      if (typeof html2canvas !== "function") {
        throw new Error("画像生成ライブラリを読み込めませんでした");
      }

      const canvas = await html2canvas(captureCard, {
        backgroundColor: "#ffffff",
        scale: CONFIG.CAPTURE_SCALE,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 15000
      });

      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("PNG画像を生成できませんでした"));
          }
        }, "image/png");
      });
    }

    function makeFileName() {
      const rank = currentRow ? currentRow.rank : "ranking";
      const id = currentRow
        ? String(currentRow.episodeId || "").replace(/[^a-zA-Z0-9_-]/g, "")
        : "";

      return "tver-ranking-" + rank + "位" +
        (id ? "-" + id : "") + ".png";
    }

    // =========================================================
    // PNG保存
    // =========================================================

    saveButton.addEventListener("click", async () => {
      saveButton.disabled = true;
      setStatus("PNG画像を作成しています…");

      try {
        const blob = await createImageBlob();
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = objectUrl;
        link.download = makeFileName();

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
        setStatus("PNG画像を保存しました。");
      } catch (error) {
        console.error(error);
        setStatus("画像保存エラー：" + error.message);
      } finally {
        saveButton.disabled = !imageReady;
      }
    });

    // =========================================================
    // Web Share API
    // =========================================================

    shareButton.addEventListener("click", async () => {
      shareButton.disabled = true;
      setStatus("共有用のPNG画像を作成しています…");

      try {
        const blob = await createImageBlob();
        const file = new File(
          [blob],
          makeFileName(),
          { type: "image/png" }
        );

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          await navigator.share({
            files: [file],
            title: "TVerランキング",
            text: currentRow
              ? currentRow.rank + "位 " + currentRow.episodeTitle
              : "TVerランキング"
          });

          setStatus("共有画面を開きました。共有先でXを選択してください。");
        } else {
          // 共有非対応なら画像保存に切り替える
          const objectUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");

          link.href = objectUrl;
          link.download = makeFileName();

          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);

          setStatus(
            "画像共有に対応していないブラウザです。\n" +
            "PNG画像を保存しました。Xで添付してください。"
          );
        }
      } catch (error) {
        if (error.name === "AbortError") {
          setStatus("共有をキャンセルしました。");
        } else {
          console.error(error);
          setStatus("共有エラー：" + error.message);
        }
      } finally {
        shareButton.disabled = !imageReady;
      }
    });

    // =========================================================
    // 起動
    // =========================================================

    async function main() {
      try {
        // 1. ランキングデータはスプレッドシートから取得
        const row = await fetchLatestRanking();

        // 2. サムネイルはAPIから取得。ID照合はしない
        let thumbnailInfo = {
          url: "",
          apiEpisodeURL: ""
        };

        try {
          thumbnailInfo = await fetchTestThumbnailUrl();
        } catch (error) {
          console.error("サムネイルAPIエラー:", error);
          setStatus(
            "サムネイルAPIに接続できませんでした。\n" +
            "ランキング情報を表示し、画像はNO IMAGEにします。"
          );
        }

        // 3. 順位とタイトルはシートの値、画像はAPIの値
        await renderCard(row, thumbnailInfo);

      } catch (error) {
        console.error(error);

        showNoImage("データを取得できませんでした");
        programName.textContent = "TVerランキング";
        rankBadge.textContent = "--位";
        episodeTitle.textContent = "ランキングデータを取得できませんでした";

        setStatus(
          "エラー：" + error.message +
          "\nスプレッドシートの公開設定、CSV URL、列名を確認してください。"
        );
      }
    }

    main();
  </script>
</body>
</html>
