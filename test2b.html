
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6b6cf">
  <title>TVerランキング画像メーカー</title>

  <style>
    :root {
      --main: #e86a9a;
      --background: #fff8fb;
      --text: #333;
      --border: #f0dce4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 16px;
      color: var(--main);
      font-size: 22px;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 9px;
      background: var(--main);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .status {
      margin: 12px 0;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .preview-title {
      margin: 20px 0 10px;
      font-size: 15px;
      font-weight: 700;
    }

    /* 正方形の画像プレビュー */
    .image-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .note {
      margin-top: 14px;
      color: #777;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>📺 TVerランキング画像メーカー</h1>

    <div class="controls">
      <div>
        <label for="episode-select">
          エピソードを選択
        </label>
        <select id="episode-select" disabled>
          <option value="">読み込み中...</option>
        </select>
      </div>

      <button id="reload-button" type="button">
        🔄 最新データを取得
      </button>

      <button id="save-button" type="button" disabled>
        📥 正方形の画像を保存
      </button>
    </div>

    <div id="status" class="status" role="status">
      公開スプレッドシートを読み込んでいます...
    </div>

    <div class="preview-title">画像プレビュー（1:1）</div>

    <div class="image-frame">
      <canvas
        id="image-canvas"
        width="1080"
        height="1080"
        aria-label="番組名、取得日時、サムネイル、エピソードタイトルを配置した正方形の画像"
      ></canvas>
    </div>

    <p class="note">
      ・画像サイズ：1080 × 1080 px<br>
      ・サムネイル：横幅最大90%、中央配置<br>
      ・元画像のアスペクト比を維持し、切り取りません。<br>
      ・保存形式：PNG
    </p>
  </main>

  <script>
    // =========================================================
    // 設定
    // =========================================================

    const CONFIG = {
      PUBLISHED_ID:
        "2PACX-1vTJofs8FiOCnnavLtBInpn1d6u9YiJ6kZLFDBNI8iRTL4RBJBz3PSQtMSiSKt35B0xgtv6p9zKTy-75",

      GID: "91701956",

      THUMBNAIL_BASE:
        "https://image-cdn.tver.jp/w=800,dpr=2/images/content/thumbnail/episode/xlarge/",

      IMAGE_SIZE: 1080,

      // サムネイルの最大幅（正方形の90%）
      THUMBNAIL_WIDTH_RATE: 0.90,

      // サムネイルの最大高さ
      THUMBNAIL_MAX_HEIGHT: 620
    };

    CONFIG.CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/" +
      CONFIG.PUBLISHED_ID +
      "/pub?gid=" +
      CONFIG.GID +
      "&single=true&output=csv";

    // CSVの列番号（0始まり）
    const COLUMNS = {
      timestamp: 0,
      rankingType: 1,
      rankingId: 2,
      rank: 3,
      episodeId: 4,
      seriesId: 5,
      programName: 6,
      episodeTitle: 7
    };

    // =========================================================
    // DOM
    // =========================================================

    const canvas = document.getElementById("image-canvas");
    const ctx = canvas.getContext("2d");

    const select = document.getElementById("episode-select");
    const reloadButton = document.getElementById("reload-button");
    const saveButton = document.getElementById("save-button");
    const status = document.getElementById("status");

    let latestRows = [];
    let latestTimestamp = null;
    let currentImage = null;
    let currentImageUrl = "";
    let renderVersion = 0;

    // =========================================================
    // CSVパーサー
    // =========================================================

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      text = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if (
          (char === "\n" || char === "\r") &&
          !inQuotes
        ) {
          if (char === "\r" && next === "\n") {
            i++;
          }

          row.push(cell);

          if (row.some(v => v.trim() !== "")) {
            rows.push(row);
          }

          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      if (cell !== "" || row.length > 0) {
        row.push(cell);

        if (row.some(v => v.trim() !== "")) {
          rows.push(row);
        }
      }

      return rows;
    }

    // =========================================================
    // 取得日時の解析
    // =========================================================

    function parseTimestamp(value) {
      if (value == null || String(value).trim() === "") {
        return null;
      }

      const text = String(value).trim();

      const match = text.match(
        /^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
      );

      if (match) {
        const date = new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3]),
          Number(match[4] || 0),
          Number(match[5] || 0),
          Number(match[6] || 0)
        );

        if (!Number.isNaN(date.getTime())) {
          return date;
        }
      }

      const parsed = new Date(text);

      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatDate(date) {
      if (!date) return "-";

      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    // =========================================================
    // キャンバスの初期表示
    // =========================================================

    function drawBackground() {
      const size = CONFIG.IMAGE_SIZE;

      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);
    }

    function drawText(text, x, y, maxWidth, fontSize) {
      ctx.font = `700 ${fontSize}px sans-serif`;
      ctx.fillStyle = "#333333";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      let output = String(text || "-");

      while (
        ctx.measureText(output).width > maxWidth &&
        output.length > 1
      ) {
        output = output.slice(0, -1);
      }

      if (output !== String(text || "-")) {
        output = output.slice(0, -1) + "…";
      }

      ctx.fillText(output, x, y);
    }

    function drawHeader(programName, timestamp) {
      const size = CONFIG.IMAGE_SIZE;
      const padding = 40;
      const fontSize = 29;

      ctx.fillStyle = "#e86a9a";
      ctx.fillRect(0, 0, size, 5);

      // 左上：番組名
      ctx.font = `700 ${fontSize}px sans-serif`;
      ctx.fillStyle = "#e86a9a";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      const maxProgramWidth = 540;
      let program = String(programName || "番組名なし");

      while (
        ctx.measureText(program).width > maxProgramWidth &&
        program.length > 1
      ) {
        program = program.slice(0, -1);
      }

      if (program !== String(programName || "番組名なし")) {
        program = program.slice(0, -1) + "…";
      }

      ctx.fillText(program, padding, 62);

      // 右上：取得日時
      const dateText = formatDate(timestamp);

      ctx.font = "500 19px sans-serif";
      ctx.fillStyle = "#777777";
      ctx.textAlign = "right";
      ctx.fillText(dateText, size - padding, 62);

      // ヘッダー下の区切り線
      ctx.strokeStyle = "#f0dce4";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padding, 108);
      ctx.lineTo(size - padding, 108);
      ctx.stroke();
    }

    // =========================================================
    // エピソードタイトル
    // =========================================================

    function drawEpisodeTitle(title) {
      const size = CONFIG.IMAGE_SIZE;
      const padding = 55;
      const maxWidth = size - padding * 2;

      const text = String(title || "エピソードタイトルなし");

      ctx.fillStyle = "#e86a9a";
      ctx.fillRect(padding, 868, size - padding * 2, 3);

      ctx.fillStyle = "#333333";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const maxFontSize = 39;
      const minFontSize = 25;
      let fontSize = maxFontSize;

      // 文字数に合わせてフォントサイズを調整
      while (fontSize > minFontSize) {
        ctx.font = `700 ${fontSize}px sans-serif`;

        const lines = wrapText(text, maxWidth);

        if (lines.length <= 3) break;

        fontSize -= 2;
      }

      ctx.font = `700 ${fontSize}px sans-serif`;

      const lines = wrapText(text, maxWidth);
      const visibleLines = lines.slice(0, 3);

      if (lines.length > 3) {
        let last = visibleLines[2];

        while (
          ctx.measureText(last + "…").width > maxWidth &&
          last.length > 1
        ) {
          last = last.slice(0, -1);
        }

        visibleLines[2] = last + "…";
      }

      const lineHeight = fontSize * 1.45;
      const startY =
        925 - ((visibleLines.length - 1) * lineHeight) / 2;

      visibleLines.forEach((line, index) => {
        ctx.fillText(
          line,
          size / 2,
          startY + index * lineHeight,
          maxWidth
        );
      });
    }

    function wrapText(text, maxWidth) {
      const lines = [];
      let line = "";

      for (const char of text) {
        const candidate = line + char;

        if (
          line &&
          ctx.measureText(candidate).width > maxWidth
        ) {
          lines.push(line);
          line = char;
        } else {
          line = candidate;
        }
      }

      if (line) lines.push(line);

      return lines;
    }

    // =========================================================
    // サムネイルの描画
    // 比率を維持し、切り取り・引き伸ばしをしない
    // =========================================================

    function drawThumbnail(img) {
      const size = CONFIG.IMAGE_SIZE;

      const maxWidth =
        size * CONFIG.THUMBNAIL_WIDTH_RATE;

      const maxHeight = CONFIG.THUMBNAIL_MAX_HEIGHT;

      const scale = Math.min(
        maxWidth / img.naturalWidth,
        maxHeight / img.naturalHeight
      );

      const width = img.naturalWidth * scale;
      const height = img.naturalHeight * scale;

      const x = (size - width) / 2;

      // 画像の上端と下端の間に十分な余白を確保
      const minY = 135;
      const maxY = 845;

      const availableHeight = maxY - minY;
      const y = minY + (availableHeight - height) / 2;

      ctx.drawImage(img, x, y, width, height);
    }

    // =========================================================
    // 画像の生成
    // =========================================================

    async function renderImage(row) {
      const version = ++renderVersion;

      saveButton.disabled = true;
      currentImage = null;

      const programName =
        String(row[COLUMNS.programName] || "").trim() ||
        "番組名なし";

      const episodeTitle =
        String(row[COLUMNS.episodeTitle] || "").trim() ||
        "エピソードタイトルなし";

      const episodeId =
        String(row[COLUMNS.episodeId] || "").trim();

      drawBackground();
      drawHeader(programName, latestTimestamp);
      drawEpisodeTitle(episodeTitle);

      if (!episodeId) {
        status.textContent =
          "エピソードIDがないため、サムネイルを表示できません。";

        return;
      }

      const imageUrl =
        CONFIG.THUMBNAIL_BASE +
        encodeURIComponent(episodeId) +
        ".jpg";

      currentImageUrl = imageUrl;

      status.textContent = "サムネイルを読み込んでいます...";

      try {
        const img = new Image();

        // CanvasからPNG保存できるようCORSを指定
        img.crossOrigin = "anonymous";
        img.referrerPolicy = "no-referrer";

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(
            new Error("サムネイルの取得に失敗しました。")
          );
          img.src = imageUrl;
        });

        if (version !== renderVersion) return;

        if (!img.naturalWidth || !img.naturalHeight) {
          throw new Error("画像サイズを取得できませんでした。");
        }

        drawBackground();
        drawHeader(programName, latestTimestamp);
        drawThumbnail(img);
        drawEpisodeTitle(episodeTitle);

        // CanvasのPNG出力が可能か確認
        await new Promise((resolve, reject) => {
          canvas.toBlob(blob => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error(
                "画像の保存準備に失敗しました。"
              ));
            }
          }, "image/png");
        });

        if (version !== renderVersion) return;

        currentImage = img;
        saveButton.disabled = false;

        status.textContent =
          "画像を生成しました。PNG形式で保存できます。";

      } catch (error) {
        if (version !== renderVersion) return;

        drawBackground();
        drawHeader(programName, latestTimestamp);
        drawEpisodeTitle(episodeTitle);

        currentImage = null;
        saveButton.disabled = true;

        status.textContent =
          error.message +
          " 画像配信元がCanvasへの利用を許可していない場合は、CORS設定が必要です。";
      }
    }

    // =========================================================
    // CSVから最新取得日時のランキングを取得
    // =========================================================

    async function loadLatestData() {
      reloadButton.disabled = true;
      select.disabled = true;
      saveButton.disabled = true;

      status.textContent =
        "公開スプレッドシートを読み込んでいます...";

      try {
        const response = await fetch(
          CONFIG.CSV_URL + "&_=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            "CSV取得エラー: HTTP " + response.status
          );
        }

        const csvText = await response.text();

        if (
          !csvText.trim() ||
          csvText.trim().startsWith("<!DOCTYPE html") ||
          csvText.trim().startsWith("<html")
        ) {
          throw new Error(
            "公開CSVを取得できません。公開設定を確認してください。"
          );
        }

        const parsedRows = parseCSV(csvText);

        if (!parsedRows.length) {
          throw new Error("CSVにデータがありません。");
        }

        // 取得日時列がヘッダー行か自動判定
        let dataRows = parsedRows;
        const firstRow = parsedRows[0].map(v =>
          v.trim().replace(/\s+/g, "").toLowerCase()
        );

        if (
          firstRow.some(v =>
            ["取得日時", "取得時刻", "timestamp"].includes(v)
          )
        ) {
          dataRows = parsedRows.slice(1);
        }

        const validRows = dataRows
          .map(row => ({
            row,
            timestamp: parseTimestamp(row[COLUMNS.timestamp])
          }))
          .filter(item => item.timestamp !== null);

        if (!validRows.length) {
          throw new Error(
            "有効な取得日時が見つかりません。CSVの列構成を確認してください。"
          );
        }

        const latestTime = Math.max(
          ...validRows.map(item => item.timestamp.getTime())
        );

        latestTimestamp = new Date(latestTime);

        latestRows = validRows
          .filter(item =>
            item.timestamp.getTime() === latestTime
          )
          .map(item => item.row);

        if (!latestRows.length) {
          throw new Error("最新データがありません。");
        }

        select.replaceChildren();

        latestRows.forEach((row, index) => {
          const option = document.createElement("option");

          option.value = String(index);

          const rank = row[COLUMNS.rank] || "-";
          const program =
            row[COLUMNS.programName] || "番組名なし";
          const title =
            row[COLUMNS.episodeTitle] || "タイトルなし";

          option.textContent =
            rank + "位｜" + program + "｜" + title;

          select.appendChild(option);
        });

        select.disabled = false;

        status.textContent =
          "最新取得日時：" + formatDate(latestTimestamp) +
          " ／ " + latestRows.length + "件";

        await renderImage(latestRows[0]);

      } catch (error) {
        status.textContent =
          "データ取得エラー：" + error.message;

        console.error(error);

        select.replaceChildren();

        const option = document.createElement("option");
        option.value = "";
        option.textContent = "データを取得できませんでした";
        select.appendChild(option);

      } finally {
        reloadButton.disabled = false;
      }
    }

    // =========================================================
    // PNG画像を保存
    // =========================================================

    function saveImage() {
      if (!currentImage) {
        status.textContent =
          "保存できる画像がありません。";

        return;
      }

      try {
        canvas.toBlob(blob => {
          if (!blob) {
            status.textContent =
              "PNG画像を作成できませんでした。";

            return;
          }

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");

          const row = latestRows[Number(select.value)] || [];
          const episodeId =
            String(row[COLUMNS.episodeId] || "episode");

          link.href = url;
          link.download = "tver-ranking-" +
            episodeId.replace(/[^a-zA-Z0-9_-]/g, "_") +
            ".png";

          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1000);

          status.textContent =
            "PNG画像の保存を開始しました。";

        }, "image/png");

      } catch (error) {
        status.textContent =
          "画像を保存できませんでした。";

        console.error(error);
      }
    }

    // =========================================================
    // イベント
    // =========================================================

    select.addEventListener("change", () => {
      const row = latestRows[Number(select.value)];

      if (row) {
        renderImage(row);
      }
    });

    reloadButton.addEventListener("click", loadLatestData);
    saveButton.addEventListener("click", saveImage);

    // 初回読み込み
    drawBackground();
    loadLatestData();
  </script>
</body>
</html>
