
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6b6cf">
  <title>テキスト＋画像をXに共有</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px;
      font-family: system-ui, sans-serif;
      color: #333;
      background: #fff7fa;
    }

    main {
      max-width: 520px;
      margin: auto;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0000000d;
    }

    h1 {
      font-size: 21px;
      text-align: center;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    textarea,
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 360px;
      margin-top: 12px;
      border-radius: 10px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #e86a9a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .sub {
      color: #777;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
<main>
  <h1>テキスト＋画像をXに共有</h1>

  <label for="textInput">投稿テキスト</label>
  <textarea id="textInput">メインパーソナリティ #小島凪紗✨
「櫻坂46こちら有楽町星空放送局」
#櫻坂46こち星 #櫻坂46</textarea>

  <label for="imageInput">投稿画像</label>
  <input id="imageInput" type="file" accept="image/*">

  <img id="preview" alt="画像プレビュー">

  <button id="shareButton" type="button">
    Xにテキストと画像を共有
  </button>

  <button id="textButton" type="button">
    テキストだけコピー
  </button>

  <p id="status" role="status" aria-live="polite">
    テキストと画像を指定して共有してください。
  </p>

  <p class="sub">
    Android Chrome向け。共有画面が表示されたらXを選択してください。
    X側の仕様によっては、文章や画像の再確認が必要な場合があります。
  </p>
</main>

<script>
  const textInput = document.getElementById("textInput");
  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");
  const shareButton = document.getElementById("shareButton");
  const textButton = document.getElementById("textButton");
  const status = document.getElementById("status");

  let selectedImage = null;
  let previewURL = null;

  imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];

    selectedImage = file || null;

    if (previewURL) {
      URL.revokeObjectURL(previewURL);
      previewURL = null;
    }

    if (!file) {
      preview.style.display = "none";
      preview.removeAttribute("src");
      status.textContent = "画像が選択されていません。";
      return;
    }

    if (!file.type.startsWith("image/")) {
      selectedImage = null;
      imageInput.value = "";
      preview.style.display = "none";
      status.textContent = "画像ファイルを選択してください。";
      return;
    }

    previewURL = URL.createObjectURL(file);
    preview.src = previewURL;
    preview.style.display = "block";
    status.textContent = "画像を選択しました。";
  });

  // テキストと画像をAndroidの共有シートに渡す
  shareButton.addEventListener("click", async () => {
    const text = textInput.value;
    const file = selectedImage;

    if (!file) {
      status.textContent = "先に画像を選択してください。";
      return;
    }

    if (!navigator.share || !navigator.canShare) {
      status.textContent =
        "このブラウザはファイル共有に対応していません。Chromeで開いてください。";
      return;
    }

    const shareData = {
      title: "Xへの投稿",
      text: text,
      files: [file]
    };

    if (!navigator.canShare(shareData)) {
      status.textContent =
        "この環境では画像共有に対応していません。別の画像形式をお試しください。";
      return;
    }

    shareButton.disabled = true;
    status.textContent = "共有画面を開いています…";

    try {
      await navigator.share(shareData);
      status.textContent =
        "共有処理が終了しました。X側で投稿内容を確認してください。";
    } catch (error) {
      if (error.name === "AbortError") {
        status.textContent = "共有をキャンセルしました。";
      } else {
        console.error(error);
        status.textContent =
          "共有できませんでした。HTTPS接続とブラウザの対応状況を確認してください。";
      }
    } finally {
      shareButton.disabled = false;
    }
  });

  // テキストだけをコピーする
  textButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(textInput.value);
      status.textContent = "テキストをコピーしました。";
    } catch (error) {
      console.error(error);
      status.textContent =
        "テキストをコピーできませんでした。HTTPS接続を確認してください。";
    }
  });
</script>
</body>
</html>
